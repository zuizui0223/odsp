[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odsp-occurrence-information"
version = "0.3.0"
description = "Multidimensional niche geometry and source-preserving occurrence axis information"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["odsp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
