[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odsp-niche-geometry"
version = "0.10.0"
description = "Projection-aware state-resolved ecological prediction and multidimensional niche evidence"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyproj>=3.6,<4"]
predict = ["scikit-learn>=1.4,<2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["odsp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
