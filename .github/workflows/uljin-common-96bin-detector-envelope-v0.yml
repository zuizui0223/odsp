name: uljin-common-96bin-detector-envelope-v0

on:
  push:
    branches:
      - method/uljin-96-clock-bin-detector-envelope-v0
    paths:
      - 'ULJIN_COMMON_96BIN_DETECTOR_ENVELOPE_V0_CONTRACT.json'
      - 'odsp/uljin_common_96bin_detector_envelope_v0.py'
      - 'tests/test_uljin_common_96bin_detector_envelope_v0.py'
      - 'scripts/run_uljin_common_96bin_detector_envelope_v0.py'
      - '.github/workflows/uljin-common-96bin-detector-envelope-v0.yml'
  workflow_dispatch:

jobs:
  first-sharp-96bin-common-detector-q:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install without optional SciPy
        run: python -m pip install -e '.[dev]'
      - name: Verify 4-vertex exhaustive extremum and same original civil bin comparison
        run: python -m pytest -q tests/test_uljin_common_96bin_detector_envelope_v0.py
      - name: Score FIRST frozen 240 sharp detector q envelopes across common civil bins
        run: python scripts/run_uljin_common_96bin_detector_envelope_v0.py
      - name: Archive first exact source-free 96 clock-bin sensitivity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uljin-common-96bin-detector-envelope-first-v0
          path: ULJIN_COMMON_96BIN_DETECTOR_ENVELOPE_V0_FIRST_RECEIPT.json
          if-no-files-found: warn
