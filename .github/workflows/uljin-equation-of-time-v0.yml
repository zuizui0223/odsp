name: uljin-original-41-equation-of-time-v0

on:
  push:
    branches:
      - ecology/uljin-photoperiod-mirror-design-v0
    paths:
      - 'ULJIN_ORIGINAL_41_EQUATION_OF_TIME_AUDIT_V0_CONTRACT.json'
      - 'odsp/uljin_original_pairs_equation_of_time_v0.py'
      - 'tests/test_uljin_original_pairs_equation_of_time_v0.py'
      - 'scripts/run_uljin_original_pairs_equation_of_time_v0.py'
      - '.github/workflows/uljin-equation-of-time-v0.yml'
  workflow_dispatch:

jobs:
  original-calendar-civil-noon-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Test unchanged 41 date pairs under equation-of-time displacement
        run: python -m pytest -q tests/test_uljin_original_pairs_equation_of_time_v0.py
      - name: Reproduce original 41 astronomical noon offsets
        run: python scripts/run_uljin_original_pairs_equation_of_time_v0.py
      - name: Preserve first source-free outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uljin-original-mirror-equation-of-time-first
          path: ULJIN_ORIGINAL_41_EQUATION_OF_TIME_FIRST_RECEIPT.json
          if-no-files-found: warn
