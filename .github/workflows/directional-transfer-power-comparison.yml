name: directional-transfer-power-comparison

on:
  pull_request:
    paths:
      - 'odsp/bootstrap_t.py'
      - 'odsp/multicontrast_bootstrap_t.py'
      - 'odsp/information_transfer_v2.py'
      - 'odsp/positive_transfer_bootstrap_t.py'
      - 'odsp/information_transfer_positive_v2.py'
      - 'odsp/transfer_ceiling_operating_characteristics.py'
      - 'odsp/directional_transfer_power_comparison.py'
      - 'tests/test_directional_transfer_power_comparison.py'
      - 'tests/test_directional_transfer_power_comparison_receipt.py'
      - 'ODSP_DIRECTIONAL_TRANSFER_POWER_COMPARISON_CONTRACT.json'
      - 'DIRECTIONAL_TRANSFER_POWER_COMPARISON_RECEIPT.json'
      - '.github/workflows/directional-transfer-power-comparison.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core package without prediction extra
        run: python -m pip install -e '.[dev]'
      - name: Run directional power comparison contract and receipt tests
        run: >-
          python -m pytest -q
          tests/test_directional_transfer_power_comparison.py
          tests/test_directional_transfer_power_comparison_receipt.py
      - name: Re-run 1000-simulation paired comparison and match frozen receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from odsp.directional_transfer_power_comparison import (
              COMPARISON_VERSION,
              run_directional_transfer_power_comparison,
          )
          from odsp.transfer_ceiling_operating_characteristics import GENERATOR_VERSION

          reference = json.loads(
              Path('TRANSFER_CEILING_OPERATING_CHARACTERISTICS_RECEIPT.json').read_text()
          )
          contract = json.loads(
              Path('ODSP_DIRECTIONAL_TRANSFER_POWER_COMPARISON_CONTRACT.json').read_text()
          )
          expected = json.loads(
              Path('DIRECTIONAL_TRANSFER_POWER_COMPARISON_RECEIPT.json').read_text()
          )
          result = run_directional_transfer_power_comparison()
          observed = result.as_dict()
          print('DIRECTIONAL_TRANSFER_POWER_COMPARISON=' + json.dumps(observed, sort_keys=True))
          assert observed['comparison_version'] == COMPARISON_VERSION
          assert observed['reference_generator_version'] == GENERATOR_VERSION
          assert observed['same_world_per_method'] is True
          assert observed['same_bootstrap_seed_per_method'] is True
          assert result.qualification_pass, observed

          run = expected['first_1000_simulation_run']
          assert observed['seed'] == run['seed']
          assert observed['simulations_per_scenario'] == run['simulations_per_scenario']
          assert observed['bootstrap_draws_per_interval'] == run['bootstrap_draws_per_interval']
          assert observed['group_count'] == run['group_count']
          assert observed['step_correlation'] == run['step_correlation']
          assert observed['noise_standard_deviation'] == run['noise_standard_deviation']
          assert observed['familywise_confidence_level'] == run['familywise_confidence_level']

          frozen_reference = {row['scenario_id']: row for row in reference['scenarios']}
          frozen_candidate = {row['scenario_id']: row for row in expected['scenarios']}
          actual = {row['scenario_id']: row for row in observed['scenarios']}
          assert set(actual) == set(frozen_reference) == set(frozen_candidate)
          predeclared_threshold = float(
              contract['qualification_rules']['coarse_truth_overreach_maximum_rate']
          )
          numeric_fields = (
              'two_sided_exact_ceiling_recovery_rate',
              'one_sided_exact_ceiling_recovery_rate',
              'exact_recovery_rate_difference',
              'two_sided_overreach_rate',
              'one_sided_overreach_rate',
              'two_sided_underreach_rate',
              'one_sided_underreach_rate',
              'two_sided_full_ceiling_rate',
              'one_sided_full_ceiling_rate',
          )
          for scenario_id in sorted(actual):
              row = actual[scenario_id]
              ref = frozen_reference[scenario_id]
              cand = frozen_candidate[scenario_id]
              assert abs(row['two_sided_exact_ceiling_recovery_rate'] - ref['exact_ceiling_recovery_rate']) <= 1e-15
              assert abs(row['two_sided_overreach_rate'] - ref['overreach_rate']) <= 1e-15
              assert abs(row['two_sided_underreach_rate'] - ref['underreach_rate']) <= 1e-15
              assert abs(row['two_sided_full_ceiling_rate'] - ref['full_ceiling_rate']) <= 1e-15
              for field in numeric_fields:
                  assert abs(float(row[field]) - float(cand[field])) <= 1e-15, (
                      scenario_id, field, row[field], cand[field]
                  )
              assert row['paired_dataset_ceiling_regression_count'] == cand['paired_dataset_ceiling_regression_count'] == 0
              assert row['paired_dataset_ceiling_advance_count'] == cand['paired_dataset_ceiling_advance_count']
              assert row['candidate_acceptance_pass'] is True
              if row['truth_ceiling'] == 'coarse':
                  assert row['one_sided_overreach_rate'] <= predeclared_threshold
          print('DIRECTIONAL_TRANSFER_POWER_COMPARISON_MATCHES_FROZEN_RECEIPT=true')
          PY
