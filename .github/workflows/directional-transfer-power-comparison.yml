name: directional-transfer-power-comparison

on:
  pull_request:
    paths:
      - 'odsp/bootstrap_t.py'
      - 'odsp/multicontrast_bootstrap_t.py'
      - 'odsp/information_transfer_v2.py'
      - 'odsp/positive_transfer_bootstrap_t.py'
      - 'odsp/information_transfer_positive_v2.py'
      - 'odsp/transfer_ceiling_operating_characteristics.py'
      - 'odsp/directional_transfer_power_comparison.py'
      - 'tests/test_directional_transfer_power_comparison.py'
      - 'ODSP_DIRECTIONAL_TRANSFER_POWER_COMPARISON_CONTRACT.json'
      - 'DIRECTIONAL_TRANSFER_POWER_COMPARISON_RECEIPT.json'
      - '.github/workflows/directional-transfer-power-comparison.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core package without prediction extra
        run: python -m pip install -e '.[dev]'
      - name: Run directional power comparison contract tests
        run: python -m pytest -q tests/test_directional_transfer_power_comparison.py
      - name: Run first predeclared 1000-simulation paired power comparison
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from odsp.directional_transfer_power_comparison import (
              COMPARISON_VERSION,
              run_directional_transfer_power_comparison,
          )
          from odsp.transfer_ceiling_operating_characteristics import GENERATOR_VERSION

          reference = json.loads(
              Path('TRANSFER_CEILING_OPERATING_CHARACTERISTICS_RECEIPT.json').read_text()
          )
          result = run_directional_transfer_power_comparison()
          payload = result.as_dict()
          print('DIRECTIONAL_TRANSFER_POWER_COMPARISON=' + json.dumps(payload, sort_keys=True))
          assert payload['comparison_version'] == COMPARISON_VERSION
          assert payload['reference_generator_version'] == GENERATOR_VERSION
          assert payload['same_world_per_method'] is True
          assert payload['same_bootstrap_seed_per_method'] is True
          assert result.qualification_pass, payload

          frozen = {row['scenario_id']: row for row in reference['scenarios']}
          actual = {row['scenario_id']: row for row in payload['scenarios']}
          assert set(actual) == set(frozen)
          for scenario_id in sorted(actual):
              row = actual[scenario_id]
              ref = frozen[scenario_id]
              assert abs(row['two_sided_exact_ceiling_recovery_rate'] - ref['exact_ceiling_recovery_rate']) <= 1e-15
              assert abs(row['two_sided_overreach_rate'] - ref['overreach_rate']) <= 1e-15
              assert abs(row['two_sided_underreach_rate'] - ref['underreach_rate']) <= 1e-15
              assert abs(row['two_sided_full_ceiling_rate'] - ref['full_ceiling_rate']) <= 1e-15
              assert row['paired_dataset_ceiling_regression_count'] == 0
              assert row['candidate_acceptance_pass'] is True
              if row['truth_ceiling'] == 'coarse':
                  assert row['candidate_overreach_threshold'] is not None
                  assert row['one_sided_overreach_rate'] <= row['candidate_overreach_threshold']
          print('DIRECTIONAL_TRANSFER_POWER_COMPARISON_QUALIFIED=true')
          PY
