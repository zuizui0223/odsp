name: bop-red-kite-sui-gps-yearid-admission-v1
on:
  pull_request:
    paths:
      - 'research/BOP_RED_KITE_SUI_GPS_YEAR_ID_ADMISSION_V1_CONTRACT.json'
      - 'BOP_RED_KITE_SUI_GPS_YEAR_ID_ADMISSION_V1_FIRST_RECEIPT.json'
      - 'scripts/bop_red_kite_sui_gps_year_id_admission_v1.py'
      - 'scripts/verify_bop_red_kite_sui_gps_year_id_first_v1.py'
      - 'tests/test_bop_red_kite_sui_gps_year_id_admission_v1.py'
      - 'tests/test_bop_red_kite_sui_gps_year_id_first_v1.py'
      - 'docs/bop_red_kite_sui_gps_year_id_admission_v1.md'
      - 'manuscript/BOP_INDEPENDENT_ANIMAL_GAIN_METHODS_DRAFT_v1.md'
      - 'README.md'
      - '.github/workflows/bop-red-kite-sui-gps-yearid-admission-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
# Original first Swiss source and exact MD5 were verified in run 44456757144.
# Subsequent workflow executions MUST NOT reread 266 MB provider GPS or labels.
jobs:
  immutable-source-and-histogram-offline-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10','3.12','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - name: Synthetic Swiss geo/date/hourly/ID tests and tamper protection of real 697/258 cohort
        run: python -m pytest tests/test_bop_red_kite_sui_gps_year_id_admission_v1.py tests/test_bop_red_kite_sui_gps_year_id_first_v1.py
      - name: Offline verify original ZIP/JSON hashes, 12 arm histograms and 121.992 expectation
        run: python scripts/verify_bop_red_kite_sui_gps_year_id_first_v1.py
