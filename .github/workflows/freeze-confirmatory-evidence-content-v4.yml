name: freeze-confirmatory-evidence-content-v4

on:
  pull_request:
    paths:
      - 'odsp/confirmatory_route_evidence.py'
      - 'odsp/frozen_confirmatory_route.py'
      - 'ODSP_CONFIRMATORY_ROUTE_EVIDENCE_REGISTRY_V3.json'
      - 'ODSP_CONFIRMATORY_METHOD_ROUTING_CONTRACT.json'
      - 'tests/test_confirmatory_route_evidence_v2.py'
      - 'ODSP_CONFIRMATORY_EVIDENCE_CONTENT_LOCK_V1.json'
      - 'ONE_SIDED_POSITIVE_BOOTSTRAP_T_NULL_CALIBRATION_RECEIPT.json'
      - 'INDEPENDENT_C4_ONE_SIDED_SUPPORT_ENVELOPE_RECEIPT.json'
      - 'INDEPENDENT_C12_ONE_SIDED_SUPPORT_ENVELOPE_RECEIPT.json'
      - 'ODSP_ALL_REFIT_DIRECTIONAL_ROBUSTNESS_CONTRACT.json'
      - 'ODSP_REFIT_ONE_SIDED_POSITIVE_TRANSFER_CONTRACT.json'
      - 'ODSP_UNTOUCHED_EXTERNAL_FREEZE_SEMANTIC_LOCK_V2.json'
      - 'PAIRED_ONE_SIDED_POSITIVE_BOOTSTRAP_T_NULL_CALIBRATION_RECEIPT.json'
      - 'ODSP_PAIRED_REFIT_UNTOUCHED_EXTERNAL_V3_CONTRACT.json'
      - 'ODSP_INDEPENDENT_DIRECTIONAL_LATTICE_4_12EDGE_CONTRACT.json'
      - 'INDEPENDENT_DIRECTIONAL_LATTICE_FAMILY_CALIBRATION_RECEIPT.json'
      - 'ODSP_ALL_REFIT_INDEPENDENT_DIRECTIONAL_LATTICE_4_12EDGE_CONTRACT.json'
      - 'ODSP_UNTOUCHED_EXTERNAL_INDEPENDENT_ALL_REFIT_LATTICE_V5_CONTRACT.json'
      - 'PAIRED_DIRECTIONAL_LATTICE_FAMILY_CALIBRATION_RECEIPT.json'
      - 'ODSP_ALL_REFIT_PAIRED_POSITIVE_LATTICE_CONTRACT.json'
      - 'ODSP_UNTOUCHED_EXTERNAL_PAIRED_ALL_REFIT_LATTICE_V4_CONTRACT.json'
      - 'MULTICONTRAST_BOOTSTRAP_T_V2_OPERATING_CHARACTERISTICS_RECEIPT.json'
      - 'ODSP_INFORMATION_TRANSFER_BOOTSTRAP_T_V2_CONTRACT.json'
      - 'tests/test_confirmatory_evidence_content_lock_v1.py'
      - '.github/workflows/freeze-confirmatory-evidence-content-v4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core package with test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run qualification evidence content-lock tests
        run: python -m pytest -q tests/test_confirmatory_evidence_content_lock_v1.py
