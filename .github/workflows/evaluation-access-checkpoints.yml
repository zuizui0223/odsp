name: evaluation-access-checkpoints

on:
  pull_request:
    paths:
      - 'EVALUATION_ACCESS_CHECKPOINT_CONTRACT.json'
      - 'EVALUATION_ACCESS_CHECKPOINT_VALIDATION_RECEIPT.json'
      - 'odsp/evaluation_access_checkpoints.py'
      - 'odsp/evaluation_access_checkpoints_benchmark.py'
      - 'scripts/run_evaluation_access_checkpoints_benchmark.py'
      - 'tests/test_evaluation_access_checkpoints.py'
      - 'tests/test_evaluation_access_checkpoints_contract.py'
      - 'tests/test_evaluation_access_checkpoints_benchmark.py'
      - 'tests/test_evaluation_access_checkpoints_receipt.py'
      - 'docs/evaluation_access_checkpoints.md'
      - '.github/workflows/evaluation-access-checkpoints.yml'
  push:
    branches: [main]
    paths:
      - 'EVALUATION_ACCESS_CHECKPOINT_CONTRACT.json'
      - 'EVALUATION_ACCESS_CHECKPOINT_VALIDATION_RECEIPT.json'
      - 'odsp/evaluation_access_checkpoints.py'
      - 'odsp/evaluation_access_checkpoints_benchmark.py'
      - 'scripts/run_evaluation_access_checkpoints_benchmark.py'
      - 'tests/test_evaluation_access_checkpoints.py'
      - 'tests/test_evaluation_access_checkpoints_contract.py'
      - 'tests/test_evaluation_access_checkpoints_benchmark.py'
      - 'tests/test_evaluation_access_checkpoints_receipt.py'
      - 'docs/evaluation_access_checkpoints.md'
      - '.github/workflows/evaluation-access-checkpoints.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ODSP development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Test evaluation-access checkpoint API and frozen contract
        run: |
          python -m pytest -q \
            tests/test_evaluation_access_checkpoints.py \
            tests/test_evaluation_access_checkpoints_contract.py
          if [ -f tests/test_evaluation_access_checkpoints_receipt.py ]; then
            python -m pytest -q tests/test_evaluation_access_checkpoints_receipt.py
          fi
      - name: Run frozen evaluation-access checkpoint benchmark
        run: |
          python scripts/run_evaluation_access_checkpoints_benchmark.py \
            --output artifacts/EVALUATION_ACCESS_CHECKPOINT_BENCHMARK.json
          python -m pytest -q tests/test_evaluation_access_checkpoints_benchmark.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/EVALUATION_ACCESS_CHECKPOINT_BENCHMARK.json').read_text())
          assert r['passed'] is True
          assert len(r['checks']) == 16
          assert all(row['passed'] for row in r['checks'])
          assert r['clean']['separation_category'] == 'evaluation_access_checkpoints_consistent'
          assert r['middle_mismatch']['mismatched_checkpoint_count'] == 1
          assert r['order_mismatch']['checkpoint_order_strictly_increasing'] is False
          assert r['missing_terminal']['terminal_checkpoint_present'] is False
          print(json.dumps(r, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-access-checkpoints-benchmark
          path: artifacts/EVALUATION_ACCESS_CHECKPOINT_BENCHMARK.json
          if-no-files-found: error
          retention-days: 90
