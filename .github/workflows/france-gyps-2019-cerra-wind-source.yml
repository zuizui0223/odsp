name: French Gyps 2019-2021 CERRA regional wind common-vs-individual 5km source gate

on:
  push:
    branches: [prospective/france-gyps-cerra-wind-2019-2021-20261023]
    paths:
      - prospective/FRANCE_GYPS_CERRA_2019_2021_SHARED_VS_BIRD_WIND_PREHEIGHT_GATE_V1.json
      - prospective/france_gyps_2019_cerra_wind_prehight.py
      - prospective/test_france_gyps_2019_cerra_wind_prehight.py
      - .github/workflows/france-gyps-2019-cerra-wind-source.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test equal bird centroid, CERRA quantiles and independent shared weather donor support
        run: |
          python -m pip install pytest numpy pyproj
          python -m pytest -q prospective/test_france_gyps_2019_cerra_wind_prehight.py

  original-nonvertical-source:
    needs: synthetic
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pyproj
      - name: Verify original source first-5minute GPS population of 28 birds before weather assignment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/france_gyps_wind
          curl --http1.1 --fail --location --silent --show-error --retry 4 --retry-all-errors --max-time 180 \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/zuizui0223/odsp/actions/artifacts/12398443408/zip' \
            -o build/france_gyps_wind/preheight_source.zip
          # GitHub may repackage artifact transport ZIP; verify exact source JSON bytes below.
          unzip -p build/france_gyps_wind/preheight_source.zip FRANCE_GYPS_2019_2021_XY_INSTRUMENT_SUPPORT_V1.json \
            > build/france_gyps_wind/preheight_source.json
          echo '5459a3c5d717d655bbdeef3844625c4757eb2c94c312def85c0306977525ce87  build/france_gyps_wind/preheight_source.json' | sha256sum --check
          python - <<'PY'
          import json
          x=json.load(open('build/france_gyps_wind/preheight_source.json'))
          assert x['numeric_native_GPS_height_values_read'] is False
          assert x['numeric_barometric_height_values_read'] is False
          assert x['selected_biological_animals']==30
          assert x['selected_native_GPS_five_minute_events']==742423
          assert x['horizontal_day_eligibility_by_cell_m']['5000']['n_unique_birds_with_qualifying_day_events']==28
          assert x['horizontal_day_eligibility_by_cell_m']['5000']['source_bird_ID_sha256']=='031d6226418cc0291a48d7d4eb44f1cae003df3a411ef3767a5229dbd45b1928'
          print('Original source 28 biological bird IDs verified')
          PY
      - name: Download original public French GPS 2019–2021, checksum fixed
        run: |
          set -euo pipefail
          cd build/france_gyps_wind
          # Dataverse/CDN frequently closes a large response near its last
          # 7 MB.  Do NOT restart the 1.09 GB from byte zero for every retry.
          # Curl auto-resumes at the current local file size with HTTP Range.
          for attempt in $(seq 1 14); do
            oldbytes="$(stat -c %s windTurbineAvoidance.zip 2>/dev/null || echo 0)"
            if curl --http1.1 --fail --location --silent --show-error \
                --continue-at - --connect-timeout 50 --max-time 600 \
                'https://data.indores.fr/api/access/datafile/5114' \
                -o windTurbineAvoidance.zip; then
              echo "Full official source transfer completed at attempt $attempt"
              break
            fi
            newbytes="$(stat -c %s windTurbineAvoidance.zip 2>/dev/null || echo 0)"
            echo "Interruption during source transfer: bytes before=$oldbytes after=$newbytes"
            if [ "$oldbytes" -gt 0 ] && [ "$newbytes" -le "$oldbytes" ]; then
              echo "Official endpoint did not support forward byte-range progress; not retrying identical source"
              exit 1
            fi
            sleep 5
          done
          echo 'b18cc8004d311d19ff24060f655178bf  windTurbineAvoidance.zip' | md5sum --check
          test "$(stat -c %s windTurbineAvoidance.zip)" -eq 1093170227
      - name: Derive 28-bird equal regional source centroid, independent CERRA wind and exact 5km donor support
        run: |
          set -euo pipefail
          python -m prospective.france_gyps_2019_cerra_wind_prehight \
            --zip build/france_gyps_wind/windTurbineAvoidance.zip \
            --preheight build/france_gyps_wind/preheight_source.json \
            --out build/france_gyps_wind/FRANCE_GYPS_2019_2021_CERRA_WIND_CONTEXT_NOHEIGHT_V1.json
      - name: Confirm no numeric native GPS or barometric altitude used for eligibility
        run: |
          python - <<'PY'
          import json
          d=json.load(open('build/france_gyps_wind/FRANCE_GYPS_2019_2021_CERRA_WIND_CONTEXT_NOHEIGHT_V1.json'))
          assert d['source_ZIP_MD5']=='b18cc8004d311d19ff24060f655178bf'
          assert d['source_original_5km_birds']==28
          assert d['source_original_5km_bird_sha256']=='031d6226418cc0291a48d7d4eb44f1cae003df3a411ef3767a5229dbd45b1928'
          assert d['ALTITUDE_VALUES_OPENED_IN_THIS_SOURCE_GATE'] is False
          assert len(d['weather_source_years'])==3
          assert d['calendar_days_with_wind_labels']>=875
          a=d['source_wind_eligibility']
          assert not a['native_GPS_height_used'] and not a['barometric_height_used']
          assert a['original_bird_own_wind_same_cell']['n_individuals']<=28
          assert a['shared_species_other_bird_same_yearmonth_wind_context']['n_individuals']<=28
          print(json.dumps({
            'site_center':d['source_equal_bird_median_centroid'],
            'wind_calendar_days':d['calendar_days_with_wind_labels'],
            'same_bird_wind_candidates':a['original_bird_own_wind_same_cell']['n_individuals'],
            'same_bird_scored_days':a['original_bird_own_wind_same_cell']['scorable_bird_days'],
            'shared_response_wind_candidates':a['shared_species_other_bird_same_yearmonth_wind_context']['n_individuals'],
            'shared_response_wind_days':a['shared_species_other_bird_same_yearmonth_wind_context']['scorable_bird_days'],
            'shared_response_wind_fixes':a['shared_species_other_bird_same_yearmonth_wind_context']['scorable_first_5min_fixes'],
            'altitudes_read':False,
            'future_environment_test_confirmatory':False
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: france-gyps-2019-2021-CERRA-shared-vs-individual-source-support-noheight
          path: build/france_gyps_wind/FRANCE_GYPS_2019_2021_CERRA_WIND_CONTEXT_NOHEIGHT_V1.json
          if-no-files-found: warn
