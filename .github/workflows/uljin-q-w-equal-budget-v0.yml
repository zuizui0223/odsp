name: uljin-q-w-equal-budget-v0

on:
  push:
    branches:
      - method/uljin-q-w-fixed-budget-allocation-v0
    paths:
      - 'ULJIN_Q_W_EQUAL_BUDGET_V0_CONTRACT.json'
      - 'odsp/uljin_q_w_equal_budget_v0.py'
      - 'tests/test_uljin_q_w_equal_budget_v0.py'
      - 'scripts/run_uljin_q_w_equal_budget_v0.py'
      - '.github/workflows/uljin-q-w-equal-budget-v0.yml'
  workflow_dispatch:

jobs:
  first-frozen-source-free-equal-budget-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install 'scipy>=1.12,<2'
      - name: Verify source opportunity costs and all frozen biological nulls
        run: python -m pytest -q tests/test_uljin_q_w_equal_budget_v0.py
      - name: First pre-frozen 9600-world equal external measurement budget comparison
        run: python scripts/run_uljin_q_w_equal_budget_v0.py
      - name: Archive first complete allocation and exact null calibration receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uljin-q-w-equal-budget-first-v0
          path: ULJIN_Q_W_EQUAL_BUDGET_V0_FIRST_RECEIPT.json
          if-no-files-found: warn
