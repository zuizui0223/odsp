name: bootstrap-t-calibration

on:
  pull_request:
    paths:
      - 'odsp/bootstrap_t_operating_characteristics.py'
      - 'tests/test_bootstrap_t_operating_characteristics.py'
      - '.github/workflows/bootstrap-t-calibration.yml'
      - 'odsp/bootstrap_t.py'
      - 'odsp/simultaneous_group_certification.py'
      - 'odsp/simultaneous_group_certification_v2.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core package
        run: python -m pip install -e '.[dev]'
      - name: Run calibration benchmark tests
        run: python -m pytest -q tests/test_bootstrap_t_operating_characteristics.py
      - name: Run and print full known-null calibration panel
        run: |
          python - <<'PY'
          import json
          from odsp.bootstrap_t_operating_characteristics import run_bootstrap_t_operating_characteristics
          result = run_bootstrap_t_operating_characteristics(
              seed=20260914,
              simulations=1000,
              bootstrap_draws=500,
          )
          print('BOOTSTRAP_T_CALIBRATION_JSON=' + json.dumps(result.as_dict(), sort_keys=True))
          PY
