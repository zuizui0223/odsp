name: Utah within-study four ungulates diel and solar daylight ecology
on:
  push:
    branches: [ecology/utah-four-taxa-solar-20261019]
    paths:
      - 'research/MOVEBANK_UTAH_DIEL_PHOTOPERIOD_V0_20261019.json'
      - 'scripts/movebank_utah_diel_photoperiod_20261019.py'
      - 'tests/test_movebank_utah_diel_photoperiod_20261019.py'
      - '.github/workflows/movebank-utah-diel-photoperiod-20261019.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original_four_species_diel_ecology:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ecological contrast, daylight slope and missingness synthetic known truths
        run: python -m unittest discover -s tests -p 'test_movebank_utah_diel_photoperiod_20261019.py' -v
      - name: MD5 verified original four-taxonomic group GPS daylight and night displacement
        run: python -m scripts.movebank_utah_diel_photoperiod_20261019 --out outputs/utah_diel_photoperiod_20261019
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: utah-solar-diel-original-four-taxa-20261019
          path: outputs/utah_diel_photoperiod_20261019/utah_four_species_diel_photoperiod.json
          if-no-files-found: warn
