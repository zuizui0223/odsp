name: forecast-assessment-v6

on:
  pull_request:
    paths:
      - 'FORECAST_ASSESSMENT_V6_SELECTION_PROVENANCE_CONTRACT.json'
      - 'FORECAST_ASSESSMENT_V6_SELECTION_PROVENANCE_VALIDATION_RECEIPT.json'
      - 'odsp/forecast_assessment_v6.py'
      - 'odsp/forecast_assessment_v6_benchmark.py'
      - 'scripts/run_forecast_assessment_v6_benchmark.py'
      - 'tests/test_forecast_assessment_v6.py'
      - 'tests/test_forecast_assessment_v6_short_circuit.py'
      - 'tests/test_forecast_assessment_v6_benchmark.py'
      - 'tests/test_forecast_assessment_v6_contract.py'
      - 'tests/test_forecast_assessment_v6_receipt.py'
      - 'docs/forecast_assessment_v6_selection_provenance.md'
      - '.github/workflows/forecast-assessment-v6.yml'
  push:
    branches: [main]
    paths:
      - 'FORECAST_ASSESSMENT_V6_SELECTION_PROVENANCE_CONTRACT.json'
      - 'FORECAST_ASSESSMENT_V6_SELECTION_PROVENANCE_VALIDATION_RECEIPT.json'
      - 'odsp/forecast_assessment_v6.py'
      - 'odsp/forecast_assessment_v6_benchmark.py'
      - 'scripts/run_forecast_assessment_v6_benchmark.py'
      - 'tests/test_forecast_assessment_v6.py'
      - 'tests/test_forecast_assessment_v6_short_circuit.py'
      - 'tests/test_forecast_assessment_v6_benchmark.py'
      - 'tests/test_forecast_assessment_v6_contract.py'
      - 'tests/test_forecast_assessment_v6_receipt.py'
      - 'docs/forecast_assessment_v6_selection_provenance.md'
      - '.github/workflows/forecast-assessment-v6.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ODSP prediction dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,predict]'
      - name: Test Forecast Assessment v6 API and frozen contract
        run: |
          python -m pytest -q \
            tests/test_forecast_assessment_v6.py \
            tests/test_forecast_assessment_v6_short_circuit.py \
            tests/test_forecast_assessment_v6_contract.py
          if [ -f tests/test_forecast_assessment_v6_receipt.py ]; then
            python -m pytest -q tests/test_forecast_assessment_v6_receipt.py
          fi
      - name: Run frozen Forecast Assessment v6 benchmark
        run: |
          python scripts/run_forecast_assessment_v6_benchmark.py \
            --output artifacts/FORECAST_ASSESSMENT_V6_SELECTION_PROVENANCE_BENCHMARK.json
          python -m pytest -q tests/test_forecast_assessment_v6_benchmark.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/FORECAST_ASSESSMENT_V6_SELECTION_PROVENANCE_BENCHMARK.json').read_text())
          assert r['passed'] is True
          assert len(r['checks']) == 15
          assert all(row['passed'] for row in r['checks'])
          assert r['clean_selection']['v6_certification']['certification_status'] == 'certified'
          assert r['selection_leakage']['downstream_v5_assessment'] is None
          assert r['selection_leakage']['v6_certification']['certification_status'] == 'unavailable'
          assert r['selection_leakage_without_scheme']['v6_certification']['certification_status'] == 'unavailable'
          print(json.dumps(r, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: forecast-assessment-v6-selection-provenance-benchmark
          path: artifacts/FORECAST_ASSESSMENT_V6_SELECTION_PROVENANCE_BENCHMARK.json
          if-no-files-found: error
          retention-days: 90
