name: ODSP nectarivore original key grammar source-only diagnosis v1.2
on:
  push:
    branches:
      - prospective/nectarivore-vertical-resource-source-gate-20261123
    paths:
      - 'scripts/nectarivore_zenodo_key_grammar_v1_2.py'
      - 'tests/test_nectarivore_zenodo_key_grammar_v1_2.py'
      - '.github/workflows/nectarivore-key-grammar-v1_2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original_explanations_and_plant_ID:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source-only grammar rules synthetic test
        run: python -m unittest -v tests.test_nectarivore_zenodo_key_grammar_v1_2
      - name: Read original ML_ID formats, camera effort missingness and Explanation sheets
        run: python -m scripts.nectarivore_zenodo_key_grammar_v1_2
      - name: Archive source diagnosis without ecological responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nectarivore-plant-key-grammar-v1_2
          path: results/nectarivore_zenodo_key_grammar_v1_2.json
          if-no-files-found: error
          retention-days: 60
