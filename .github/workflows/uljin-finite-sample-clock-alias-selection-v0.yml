name: uljin-finite-sample-clock-alias-selection-v0

on:
  push:
    branches:
      - method/uljin-finite-sample-clock-alias-selection-v0
    paths:
      - 'ULJIN_FINITE_SAMPLE_CLOCK_ALIAS_SELECTION_V0_CONTRACT.json'
      - 'odsp/uljin_finite_sample_clock_alias_selection_v0.py'
      - 'tests/test_uljin_finite_sample_clock_alias_selection_v0.py'
      - 'scripts/run_uljin_finite_sample_clock_alias_selection_v0.py'
      - '.github/workflows/uljin-finite-sample-clock-alias-selection-v0.yml'
  workflow_dispatch:

jobs:
  first-frozen-synthetic-panel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate source-free latent-event identity and original fitter equivalence
        run: python -m pytest -q tests/test_uljin_finite_sample_clock_alias_selection_v0.py
      - name: FIRST pre-frozen complete nine-case 200-world selection panel
        run: python scripts/run_uljin_finite_sample_clock_alias_selection_v0.py
      - name: Archive first full synthetic panel with zero source records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uljin-finite-sample-clock-alias-selection-first-v0
          path: ULJIN_FINITE_SAMPLE_CLOCK_ALIAS_SELECTION_V0_FIRST_RECEIPT.json
          if-no-files-found: warn
