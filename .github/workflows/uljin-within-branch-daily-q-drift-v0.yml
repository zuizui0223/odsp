name: uljin-within-branch-daily-q-drift-v0

on:
  push:
    branches:
      - method/uljin-within-branch-daily-q-drift-v0
    paths:
      - 'ULJIN_WITHIN_BRANCH_DAILY_Q_DRIFT_V0_CONTRACT.json'
      - 'odsp/uljin_within_branch_daily_q_drift_v0.py'
      - 'tests/test_uljin_within_branch_daily_q_drift_v0.py'
      - 'scripts/run_uljin_within_branch_daily_q_drift_v0.py'
      - '.github/workflows/uljin-within-branch-daily-q-drift-v0.yml'
  workflow_dispatch:

jobs:
  first-frozen-daily-detector-q:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ODSP and exact source q reference beta quantiles
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install 'scipy>=1.12,<2'
      - name: Verify legitimate IID qmean source, daily q oracle scope, eps monotonicity, PR260 replay
        run: python -m pytest -q tests/test_uljin_within_branch_daily_q_drift_v0.py
      - name: FIRST complete 384 frozen q drift physical-site score comparisons
        run: python scripts/run_uljin_within_branch_daily_q_drift_v0.py
      - name: Archive first daily camera detector drift results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uljin-within-branch-daily-q-drift-first-v0
          path: ULJIN_WITHIN_BRANCH_DAILY_Q_DRIFT_V0_FIRST_RECEIPT.json
          if-no-files-found: warn
