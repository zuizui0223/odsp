name: uljin-operation-only-mirror-hours-synthetic-v0

on:
  push:
    branches:
      - ecology/uljin-photoperiod-mirror-design-v0
    paths:
      - 'ULJIN_OPERATION_ONLY_MIRRORED_DAY_EXPOSURE_V0_CONTRACT.json'
      - 'odsp/uljin_operation_only_mirror_hour_support_v0.py'
      - 'tests/test_uljin_operation_only_mirror_hour_support_v0.py'
      - 'scripts/run_uljin_operation_only_hour_support_synthetic_v0.py'
      - '.github/workflows/uljin-operation-mirror-hour-support-v0.yml'
  workflow_dispatch:

jobs:
  operation-only-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Verify exact original date pairs and merged six-bin camera uptime
        run: python -m pytest -q tests/test_uljin_operation_only_mirror_hour_support_v0.py
      - name: Run invented-source control only (NEVER open actual wildlife events)
        run: python scripts/run_uljin_operation_only_hour_support_synthetic_v0.py
      - name: Preserve first source-unavailable synthetic receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uljin-operation-only-hour-support-synthetic-v0
          path: ULJIN_OPERATION_ONLY_HOUR_SUPPORT_SYNTHETIC_FIRST_RECEIPT.json
          if-no-files-found: warn
