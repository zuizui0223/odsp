name: ri-zipinfo-only-technical-preflight-v0

on:
  push:
    branches:
      - ecology/ri-solar-vs-clock-transfer-v0
    paths:
      - 'ODSP_RI_SOLAR_V0_ZIPINFO_TECHNICAL_RECOVERY_CONTRACT.json'
      - 'odsp/ri_zipinfo_technical_recovery_v0.py'
      - 'scripts/preflight_ri_zipinfo_technical_recovery_v0.py'
      - 'tests/test_ri_zipinfo_technical_recovery_v0.py'
      - '.github/workflows/ri-zipinfo-technical-preflight-v0.yml'
  workflow_dispatch:

jobs:
  central-directory-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Verify new structural guard before touching pinned source
        run: python -m pytest -q tests/test_ri_zipinfo_technical_recovery_v0.py
      - name: Inspect only ZIP central-directory metadata (NO CSV extracted)
        run: python scripts/preflight_ri_zipinfo_technical_recovery_v0.py
      - name: Preserve first technical metadata receipt even if blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ri-zipinfo-v0-first-technical-structure
          path: RI_SOLAR_V0_ZIPINFO_FIRST_TECHNICAL_RECEIPT.json
          if-no-files-found: warn
