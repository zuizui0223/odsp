name: n2-mee-v6-submission-sync

on:
  pull_request:
    paths:
      - 'BOP_RODENT_POPULATION_TRANSFER_AMENDMENT_RECEIPT.json'
      - 'N2_MEE_STATE_PREDICTION_V6_CONTRACT.json'
      - 'manuscript/N2_MEE_TITLE_PAGE_TEMPLATE_v5.md'
      - 'manuscript/N2_MEE_COVER_LETTER_DRAFT_v6.md'
      - 'manuscript/N2_MEE_DISCLOSURE_DRAFTS_v6.md'
      - 'scripts/build_n2_mee_manuscript_v6.py'
      - 'scripts/build_n2_mee_review_bundle_v6.py'
      - 'scripts/render_n2_mee_review_docx_v6.py'
      - 'scripts/validate_n2_mee_review_docx_v4.py'
      - 'scripts/build_n2_mee_submission_handoff_v6.py'
      - 'tests/test_n2_mee_v6_submission_sync.py'
      - 'tests/test_n2_mee_state_prediction_v6.py'
      - 'tests/test_n2_mee_state_prediction_v6_contract.py'
      - '.github/workflows/n2-mee-v6-submission-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package, DOCX dependencies and pandoc
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install 'python-docx>=1.1,<2'
          sudo apt-get update -qq
          sudo apt-get install -y pandoc

      - name: Validate v6 manuscript and submission surfaces
        run: >-
          python -m pytest -q
          tests/test_n2_mee_state_prediction_v6.py
          tests/test_n2_mee_state_prediction_v6_contract.py
          tests/test_n2_mee_v6_submission_sync.py

      - name: Build validated v6 manuscript Markdown
        run: |
          mkdir -p build/n2_mee_v6_submission
          python scripts/build_n2_mee_manuscript_v6.py             --output build/n2_mee_v6_submission/N2_MEE_MANUSCRIPT_DRAFT_v6.md             --manifest build/n2_mee_v6_submission/manuscript_v6_manifest.json

      - name: Build anonymous v6 review code bundle
        run: >-
          python scripts/build_n2_mee_review_bundle_v6.py
          --output build/n2_mee_v6_submission/N2_MEE_ANONYMOUS_REVIEW_BUNDLE_v6.zip

      - name: Render anonymous v6 review DOCX
        run: |
          python scripts/render_n2_mee_review_docx_v6.py             --input build/n2_mee_v6_submission/N2_MEE_MANUSCRIPT_DRAFT_v6.md             --output build/n2_mee_v6_submission/N2_MEE_ANONYMOUS_REVIEW_v6.docx             --manifest build/n2_mee_v6_submission/review_docx_v6_manifest.json

      - name: Fail-closed DOCX structural validation
        run: |
          python scripts/validate_n2_mee_review_docx_v4.py             --docx build/n2_mee_v6_submission/N2_MEE_ANONYMOUS_REVIEW_v6.docx             --out-json build/n2_mee_v6_submission/review_docx_v6_validation.json

      - name: Build v6 submission-system handoff
        run: |
          python scripts/build_n2_mee_submission_handoff_v6.py             --json build/n2_mee_v6_submission/N2_MEE_SUBMISSION_HANDOFF_PACKET_V6.json             --markdown build/n2_mee_v6_submission/N2_MEE_SUBMISSION_HANDOFF_V6.md

      - name: Copy administrative submission drafts
        run: |
          cp manuscript/N2_MEE_TITLE_PAGE_TEMPLATE_v5.md build/n2_mee_v6_submission/N2_MEE_TITLE_PAGE_TEMPLATE_v6.md
          cp manuscript/N2_MEE_COVER_LETTER_DRAFT_v6.md build/n2_mee_v6_submission/
          cp manuscript/N2_MEE_DISCLOSURE_DRAFTS_v6.md build/n2_mee_v6_submission/

      - name: Upload v6 submission-sync artifact
        uses: actions/upload-artifact@v4
        with:
          name: n2-mee-v6-submission-sync
          path: build/n2_mee_v6_submission/
          if-no-files-found: error
          retention-days: 90
