name: uljin-threeway-margin-identifiability-v0

on:
  push:
    branches:
      - method/uljin-threeway-margin-identifiability-v0
    paths:
      - 'ULJIN_THREEWAY_MARGIN_IDENTIFIABILITY_V0_CONTRACT.json'
      - 'odsp/uljin_threeway_margin_identifiability_v0.py'
      - 'tests/test_uljin_threeway_margin_identifiability_v0.py'
      - 'scripts/run_uljin_threeway_margin_identifiability_v0.py'
      - '.github/workflows/uljin-threeway-margin-identifiability-v0.yml'
  workflow_dispatch:

jobs:
  first-exact-source-free-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Validate positive integer worlds, all three two-way margins, rank and Poisson law boundaries
        run: python -m pytest -q tests/test_uljin_threeway_margin_identifiability_v0.py
      - name: Compute first exact witness from frozen source-free contract
        run: python scripts/run_uljin_threeway_margin_identifiability_v0.py
      - name: Archive first source-free complete contingency table receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uljin-threeway-identifiability-first-v0
          path: ULJIN_THREEWAY_MARGIN_IDENTIFIABILITY_V0_FIRST_RECEIPT.json
          if-no-files-found: warn
