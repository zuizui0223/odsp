name: uljin-geometry-neutral-paired-placebo-v1

on:
  push:
    branches:
      - method/uljin-geometry-neutral-paired-placebo-v1
    paths:
      - 'ULJIN_GEOMETRY_NEUTRAL_PAIRED_PLACEBO_V1_CONTRACT.json'
      - 'odsp/uljin_geometry_neutral_paired_placebo_v1.py'
      - 'tests/test_uljin_geometry_neutral_paired_placebo_v1.py'
      - 'scripts/run_uljin_geometry_neutral_paired_placebo_v1.py'
      - '.github/workflows/uljin-geometry-neutral-paired-placebo-v1.yml'
  workflow_dispatch:

jobs:
  first-source-free-paired-placebo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate exact v0 latent-event replay and frozen placebo policy
        run: python -m pytest -q tests/test_uljin_geometry_neutral_paired_placebo_v1.py
      - name: First frozen 9x200 paired geometry counterfactual
        run: python scripts/run_uljin_geometry_neutral_paired_placebo_v1.py
      - name: Archive initial paired placebo without real animal data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uljin-geometry-neutral-paired-placebo-first-v1
          path: ULJIN_GEOMETRY_NEUTRAL_PAIRED_PLACEBO_V1_FIRST_RECEIPT.json
          if-no-files-found: warn
