name: French Gyps tag-alias quarantine dual native altitude QA sensitivity

on:
  push:
    branches: [diagnostic/france-gyps-clean-dual-height-20261024]
    paths:
      - prospective/FRANCE_GYPS_2019_2021_CLEAN_DUAL_HEIGHT_QA_FREEZE_V1.json
      - prospective/france_gyps_clean_tag_dualheight_qa.py
      - prospective/download_france_gyps_dataverse_verified_ranges.py
      - prospective/test_download_france_gyps_dataverse_verified_ranges.py
      - prospective/test_france_gyps_clean_tag_dualheight_qa.py
      - .github/workflows/france-gyps-clean-tag-dualheight-qa.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify static test and native tag alias exclusions do not change old source result
        env:
          NUMBA_CACHE_DIR: /tmp/france-gyps-clean-source-synthetic-numba
        run: |
          python -m pip install pytest numpy numba pyproj
          python -m pytest -q prospective/test_france_gyps_clean_tag_dualheight_qa.py prospective/test_download_france_gyps_dataverse_verified_ranges.py

  fixed-clean-source:
    needs: synthetic
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy numba pyproj
      - name: Verify separately archived original and clean outcome-blind source identities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/france_gyps_clean
          cd build/france_gyps_clean
          for entry in \
            '12398443408 original_preheight.zip' \
            '12399325799 original_crosswalk.zip' \
            '12400333253 cleaned_noheight.zip' \
            '12399538915 original_dualheight.zip'; do
            set -- $entry
            curl --fail --location --silent --show-error --retry 4 --max-time 180 \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/zuizui0223/odsp/actions/artifacts/$1/zip" \
              -o "$2"
          done
          echo '77286e6ad5639fdeca5c73b6c9049b6b00e3e601b467d34f966495c3d0f28a6c  original_preheight.zip' | sha256sum --check
          echo '86a5c4c587119fb62ab331833ece731b2d937b46f717ed1f20dff86763dcdb6e  original_crosswalk.zip' | sha256sum --check
          echo '99677b58289e2663bfd1c87f0de661f996be0032ff39973e9725cb32ccb5189b  cleaned_noheight.zip' | sha256sum --check
          echo '4e73b15038ba45e025f21a2b1bd951d3f063b8dc4148bed8bbdd9473f07f4864  original_dualheight.zip' | sha256sum --check
          unzip -p original_preheight.zip FRANCE_GYPS_2019_2021_XY_INSTRUMENT_SUPPORT_V1.json > original_preheight.json
          unzip -p original_crosswalk.zip FRANCE_GYPS_2019_VS_SCACCO_PARENT_STUDY_SOURCE_CROSSWALK_V1.json > original_crosswalk.json
          unzip -p cleaned_noheight.zip FRANCE_GYPS_2019_2021_XY_INSTRUMENT_SUPPORT_V1.json > cleaned_noheight.json
          unzip -p original_dualheight.zip FRANCE_GYPS_2019_2021_GPS_BARO_DUAL_HEIGHT_RESULT_V1.json > original_dualheight.json
      - name: Validate source-only 27-bird alias-quarantined analysis population before reading heights
        run: |
          python - <<'PY'
          import json
          from prospective.france_gyps_clean_tag_dualheight_qa import verify_preheight,check_historical_result
          from pathlib import Path
          base=Path('build/france_gyps_clean')
          files={key:json.loads((base/(key+'.json')).read_text())
                 for key in ('original_preheight','original_crosswalk','cleaned_noheight','original_dualheight')}
          accepted=verify_preheight(files['original_preheight'],files['original_crosswalk'],files['cleaned_noheight'])
          original_scored=check_historical_result(files['original_dualheight'],accepted)
          assert len(accepted)==27
          assert len(original_scored&accepted)==26
          assert files['cleaned_noheight']['numeric_native_GPS_height_values_read'] is False
          print('Frozen preheight source original 28 -> clean 27, source score intersection 26 verified')
          PY
      - name: Retrieve original 1.09GB via source-confirmed HTTP206 chunks and full MD5
        run: |
          set -euo pipefail
          python -m prospective.download_france_gyps_dataverse_verified_ranges \
            --out build/france_gyps_clean/windTurbineAvoidance.zip --parallel 3
          echo 'b18cc8004d311d19ff24060f655178bf  build/france_gyps_clean/windTurbineAvoidance.zip' | md5sum --check
          test "$(stat -c %s build/france_gyps_clean/windTurbineAvoidance.zip)" -eq 1093170227
      - name: Rerun unchanged two-native-height D1 5km model on strict noheight tag/test cleaned cohort
        env:
          NUMBA_CACHE_DIR: /tmp/france-gyps-clean-27-dual-altitude-numba
        run: |
          set -euo pipefail
          python -m prospective.france_gyps_clean_tag_dualheight_qa \
            --source build/france_gyps_clean/windTurbineAvoidance.zip \
            --original-preheight build/france_gyps_clean/original_preheight.json \
            --original-crosswalk build/france_gyps_clean/original_crosswalk.json \
            --corrected-noheight build/france_gyps_clean/cleaned_noheight.json \
            --historical-dualheight build/france_gyps_clean/original_dualheight.json \
            --out build/france_gyps_clean/results
      - name: Enforce postoutcome sensitivity label and no numerical source selection rescue
        run: |
          python - <<'PY'
          import json
          p='build/france_gyps_clean/results/FRANCE_GYPS_CLEAN_TAG_QUARANTINE_DUALHEIGHT_QA_RESULT_V1.json'
          x=json.load(open(p))
          assert x['classification']=='POST_OUTCOME_SOURCE_QUALITY_SENSITIVITY'
          assert x['original_biological_endpoint_modified'] is False
          assert x['clean_preheight_birds']==27
          assert x['source_zip_md5']=='b18cc8004d311d19ff24060f655178bf'
          assert len(x['excluded_exact_source_labels'])==3
          assert x['status'] in {'unavailable','clean_source_QA_both_sensor_identity_retained',
                               'clean_source_QA_unavailable','clean_source_QA_not_both_supported'}
          for source,result in x['sensor_results'].items():
              assert result['terminal'] in {'unavailable','supported_own_bird_altitude_shape',
                                            'not_supported_own_bird_altitude_shape'}
              if result['terminal']!='unavailable':
                  assert result['observed']['eligible_birds']>=10
                  assert result['calibration']['valid']>=950
          print(json.dumps({
             'status':x['status'],
             'preheight_clean_birds':x['clean_preheight_birds'],
             'clean_scored_birds':{n:r['observed']['eligible_birds'] for n,r in x['sensor_results'].items()},
             'clean_Holm':{n:r.get('holm_p_upper') for n,r in x['sensor_results'].items()},
             'nonbird_and_reused_tag_excluded':True,
             'original_27_bird_historical_result_kept':True
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: france-gyps-2019-2021-clean27-tag-alias-dual-native-height-QA-v1
          path: build/france_gyps_clean/results/*
          if-no-files-found: warn
