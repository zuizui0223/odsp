name: transfer-ceiling-operating-characteristics

on:
  pull_request:
    paths:
      - 'odsp/bootstrap_t.py'
      - 'odsp/multicontrast_bootstrap_t.py'
      - 'odsp/information_transfer_v2.py'
      - 'odsp/transfer_ceiling_operating_characteristics.py'
      - 'tests/test_transfer_ceiling_operating_characteristics.py'
      - 'ODSP_TRANSFER_CEILING_OPERATING_CHARACTERISTICS_CONTRACT.json'
      - 'TRANSFER_CEILING_OPERATING_CHARACTERISTICS_RECEIPT.json'
      - '.github/workflows/transfer-ceiling-operating-characteristics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core package without prediction extra
        run: python -m pip install -e '.[dev]'
      - name: Run transfer-ceiling operating-characteristics tests
        run: python -m pytest -q tests/test_transfer_ceiling_operating_characteristics.py
      - name: Run first predeclared 1000-simulation mixed-truth panel
        run: |
          python - <<'PY'
          import json
          from odsp.transfer_ceiling_operating_characteristics import (
              GENERATOR_VERSION,
              run_transfer_ceiling_operating_characteristics,
          )

          result = run_transfer_ceiling_operating_characteristics()
          payload = result.as_dict()
          print('TRANSFER_CEILING_OPERATING_CHARACTERISTICS=' + json.dumps(payload, sort_keys=True))
          assert payload['generator_version'] == GENERATOR_VERSION
          assert result.qualification_pass, payload
          assert all(row['acceptance_pass'] is True for row in payload['scenarios'])
          print('TRANSFER_CEILING_OPERATING_CHARACTERISTICS_QUALIFIED=true')
          PY
