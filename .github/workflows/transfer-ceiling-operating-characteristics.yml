name: transfer-ceiling-operating-characteristics

on:
  pull_request:
    paths:
      - 'odsp/bootstrap_t.py'
      - 'odsp/multicontrast_bootstrap_t.py'
      - 'odsp/information_transfer_v2.py'
      - 'odsp/transfer_ceiling_operating_characteristics.py'
      - 'tests/test_transfer_ceiling_operating_characteristics.py'
      - 'tests/test_transfer_ceiling_operating_characteristics_receipt.py'
      - 'ODSP_TRANSFER_CEILING_OPERATING_CHARACTERISTICS_CONTRACT.json'
      - 'TRANSFER_CEILING_OPERATING_CHARACTERISTICS_RECEIPT.json'
      - '.github/workflows/transfer-ceiling-operating-characteristics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core package without prediction extra
        run: python -m pip install -e '.[dev]'
      - name: Run transfer-ceiling operating-characteristics and receipt tests
        run: >-
          python -m pytest -q
          tests/test_transfer_ceiling_operating_characteristics.py
          tests/test_transfer_ceiling_operating_characteristics_receipt.py
      - name: Re-run 1000-simulation mixed-truth panel and match frozen receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from odsp.transfer_ceiling_operating_characteristics import (
              GENERATOR_VERSION,
              run_transfer_ceiling_operating_characteristics,
          )

          expected = json.loads(Path('TRANSFER_CEILING_OPERATING_CHARACTERISTICS_RECEIPT.json').read_text())
          result = run_transfer_ceiling_operating_characteristics()
          observed = result.as_dict()
          print('TRANSFER_CEILING_OPERATING_CHARACTERISTICS=' + json.dumps(observed, sort_keys=True))
          assert result.qualification_pass, observed
          assert observed['generator_version'] == GENERATOR_VERSION == expected['generator_version']
          frozen = {row['scenario_id']: row for row in expected['scenarios']}
          actual = {row['scenario_id']: row for row in observed['scenarios']}
          assert set(actual) == set(frozen)
          fields = (
              'exact_ceiling_recovery_rate',
              'overreach_rate',
              'underreach_rate',
              'full_ceiling_rate',
          )
          run = expected['first_1000_simulation_run']
          for scenario_id in sorted(frozen):
              assert actual[scenario_id]['simulations'] == run['simulations_per_scenario']
              assert actual[scenario_id]['blocks_per_group'] == frozen[scenario_id]['blocks_per_group']
              assert actual[scenario_id]['distribution'] == frozen[scenario_id]['distribution']
              assert actual[scenario_id]['truth_ceiling'] == frozen[scenario_id]['truth_ceiling']
              assert actual[scenario_id]['acceptance_pass'] is True
              for field in fields:
                  assert abs(float(actual[scenario_id][field]) - float(frozen[scenario_id][field])) <= 1e-15, (
                      scenario_id, field, actual[scenario_id][field], frozen[scenario_id][field]
                  )
          assert observed['seed'] == run['seed']
          assert observed['simulations_per_scenario'] == run['simulations_per_scenario']
          assert observed['bootstrap_draws_per_interval'] == run['bootstrap_draws_per_interval']
          assert observed['group_count'] == run['group_count']
          assert observed['step_correlation'] == run['step_correlation']
          assert observed['noise_standard_deviation'] == run['noise_standard_deviation']
          print('TRANSFER_CEILING_OPERATING_CHARACTERISTICS_MATCHES_FROZEN_RECEIPT=true')
          PY
