name: forecast-assessment-v3

on:
  pull_request:
    paths:
      - 'FORECAST_ASSESSMENT_V3_CONTRACT.json'
      - 'FORECAST_ASSESSMENT_V3_VALIDATION_RECEIPT.json'
      - 'odsp/forecast_assessment_v3.py'
      - 'odsp/forecast_assessment_v3_benchmark.py'
      - 'scripts/run_forecast_assessment_v3_benchmark.py'
      - 'tests/test_forecast_assessment_v3.py'
      - 'tests/test_forecast_assessment_v3_benchmark.py'
      - 'tests/test_forecast_assessment_v3_contract.py'
      - 'tests/test_forecast_assessment_v3_receipt.py'
      - 'docs/forecast_assessment_v3.md'
      - '.github/workflows/forecast-assessment-v3.yml'
  push:
    branches: [main]
    paths:
      - 'FORECAST_ASSESSMENT_V3_CONTRACT.json'
      - 'FORECAST_ASSESSMENT_V3_VALIDATION_RECEIPT.json'
      - 'odsp/forecast_assessment_v3.py'
      - 'odsp/forecast_assessment_v3_benchmark.py'
      - 'scripts/run_forecast_assessment_v3_benchmark.py'
      - 'tests/test_forecast_assessment_v3.py'
      - 'tests/test_forecast_assessment_v3_benchmark.py'
      - 'tests/test_forecast_assessment_v3_contract.py'
      - 'tests/test_forecast_assessment_v3_receipt.py'
      - 'docs/forecast_assessment_v3.md'
      - '.github/workflows/forecast-assessment-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ODSP prediction dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,predict]'
      - name: Test Forecast Assessment v3 API and frozen contract
        run: |
          python -m pytest -q \
            tests/test_forecast_assessment_v3.py \
            tests/test_forecast_assessment_v3_benchmark.py \
            tests/test_forecast_assessment_v3_contract.py
          if [ -f tests/test_forecast_assessment_v3_receipt.py ]; then
            python -m pytest -q tests/test_forecast_assessment_v3_receipt.py
          fi
      - name: Run frozen Forecast Assessment v3 benchmark
        run: |
          python scripts/run_forecast_assessment_v3_benchmark.py \
            --output artifacts/FORECAST_ASSESSMENT_V3_BENCHMARK.json \
            --seed 20260907
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/FORECAST_ASSESSMENT_V3_BENCHMARK.json').read_text())
          assert r['passed'] is True
          assert len(r['checks']) == 12
          assert all(row['passed'] for row in r['checks'])
          assert r['strong']['v3_certification']['certification_status'] == 'certified'
          assert r['scheme_sensitive']['v3_certification']['certification_status'] == 'not_certified'
          assert r['scheme_unavailable']['v3_certification']['certification_status'] == 'unavailable'
          print(json.dumps(r,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: forecast-assessment-v3-benchmark
          path: artifacts/FORECAST_ASSESSMENT_V3_BENCHMARK.json
          if-no-files-found: error
          retention-days: 90
