name: training-process-positive-iut-v2-power

on:
  pull_request:
    paths:
      - 'odsp/training_process_positive_iut.py'
      - 'odsp/training_process_positive_iut_power_calibration.py'
      - 'tests/test_training_process_positive_iut_v2.py'
      - 'ODSP_TRAINING_PROCESS_POSITIVE_IUT_V2_CONTRACT.json'
      - 'ODSP_TRAINING_PROCESS_POSITIVE_IUT_V2_POWER_CALIBRATION_CONTRACT.json'
      - 'scripts/run_training_process_positive_iut_power_calibration.py'
      - '.github/workflows/training-process-positive-iut-v2-power.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-power:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_training_process_positive_iut_v2.py
      - name: Run first frozen v2 power panel
        run: |
          python scripts/run_training_process_positive_iut_power_calibration.py \
            --output /tmp/iut-v2-power.json --seed 20261008 --simulations 1000 --bootstrap-draws 500
          echo IUT_V2_POWER_BEGIN
          cat /tmp/iut-v2-power.json
          echo IUT_V2_POWER_END
