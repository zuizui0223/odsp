name: n2-stage2-real-data-one-shot-v1

on:
  push:
    branches:
      - main
    paths:
      - 'N2_STAGE2_EXECUTION_ARMED.json'

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify one-shot arming event
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          marker = json.loads(Path("N2_STAGE2_EXECUTION_ARMED.json").read_text())
          expected_contract = "8a83079f395b7e22bf82d87a430d8169247bf996"
          expected_fix = "6bc65a1a5575d61835838e711d6f0221af320034"
          if marker["contract_merge_sha"] != expected_contract:
              raise SystemExit("stage-2 contract SHA mismatch")
          if marker["few_cluster_fix_merge_sha"] != expected_fix:
              raise SystemExit("few-cluster fix SHA mismatch")
          subprocess.run(
              ["git", "merge-base", "--is-ancestor", expected_contract, "HEAD"],
              check=True,
          )
          subprocess.run(
              ["git", "merge-base", "--is-ancestor", expected_fix, "HEAD"],
              check=True,
          )
          added = subprocess.check_output(
              ["git", "diff", "--diff-filter=A", "--name-only", "HEAD^", "HEAD"],
              text=True,
          ).splitlines()
          if "N2_STAGE2_EXECUTION_ARMED.json" not in added:
              raise SystemExit(
                  "stage-2 one-shot marker was not newly added; refusing rerun"
              )
          PY

      - name: Install package with prediction dependencies
        run: python -m pip install -e '.[predict]'

      - name: Fetch pinned Palmer Penguins source
        run: |
          mkdir -p build/stage2
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.request import urlopen

          contract = json.loads(
              Path("N2_POOLED_REFERENCE_FAILURE_MODE_STAGE2_REAL_DATA_CONTRACT.json").read_text()
          )
          penguins = next(
              row for row in contract["systems"]
              if row["system_id"] == "PALMER_PENGUINS"
          )
          url = penguins["source"]["url"]
          data = urlopen(url, timeout=60).read()
          Path("build/stage2/penguins.csv").write_bytes(data)
          print(url)
          print(len(data))
          PY

      - name: Run fresh frozen Penguins audit
        run: >-
          python scripts/run_n2_stage2_penguins.py
          --raw-csv build/stage2/penguins.csv
          --contract N2_POOLED_REFERENCE_FAILURE_MODE_STAGE2_REAL_DATA_CONTRACT.json
          --out build/stage2/N2_STAGE2_PALMER_PENGUINS_RESULT_V1.json

      - name: Aggregate Stage2 real-data triangulation
        run: >-
          python scripts/aggregate_n2_stage2_real_data.py
          --penguins-result build/stage2/N2_STAGE2_PALMER_PENGUINS_RESULT_V1.json
          --out build/stage2/N2_STAGE2_REAL_DATA_RESULT_V1.json

      - uses: actions/upload-artifact@v4
        with:
          name: n2-stage2-real-data-one-shot-v1
          path: |
            build/stage2/N2_STAGE2_PALMER_PENGUINS_RESULT_V1.json
            build/stage2/N2_STAGE2_REAL_DATA_RESULT_V1.json
          if-no-files-found: error
          retention-days: 90
