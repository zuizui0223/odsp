name: n2-bat-thickness-terminal

on:
  pull_request:
    paths:
      - 'N2_BAT_THICKNESS_EXECUTION_AUTHORIZATION.json'
      - 'N2_BAT_THICKNESS_CONTRACT.json'
      - 'N2_BAT_REPOSITORY_SOURCE_MANIFEST.json'
      - 'odsp/n2_bat_thickness.py'
      - 'scripts/n2_bat_thickness_execute.py'
      - 'tests/test_n2_bat_thickness.py'
      - 'tests/test_n2_bat_thickness_contract.py'
      - '.github/workflows/n2-bat-thickness-terminal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Verify frozen contract and engine on synthetic data only
        run: |
          python -m pytest \
            tests/test_n2_bat_thickness_contract.py \
            tests/test_n2_bat_thickness.py

  one-shot-empirical-terminal:
    needs: synthetic-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen engine and projection dependency
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install 'pyproj>=3.6,<4'
      - name: Execute frozen empirical endpoint once
        id: execute
        shell: bash
        run: |
          mkdir -p terminal-output
          set +e
          python scripts/n2_bat_thickness_execute.py \
            --output-dir terminal-output \
            > terminal-output/execution-stdout.json \
            2> terminal-output/execution-stderr.txt
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ] && [ "$code" -ne 3 ]; then
            exit "$code"
          fi
      - name: Audit outcome boundary
        if: always()
        env:
          EXECUTION_EXIT_CODE: ${{ steps.execute.outputs.exit_code }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path('terminal-output')
          code_text = os.environ.get('EXECUTION_EXIT_CODE', '')
          if not code_text:
              raise SystemExit('execution step did not publish an exit code')
          code = int(code_text)
          marker = root / 'numeric_open_marker.json'
          receipt = root / 'n2_bat_thickness_terminal_receipt.json'
          pre_failure = root / 'pre_numeric_failure.json'
          invalid = root / 'numeric_open_invalid_execution.json'

          if code == 0:
              assert marker.exists()
              assert receipt.exists()
              assert not pre_failure.exists()
              assert not invalid.exists()
              m = json.loads(marker.read_text())
              r = json.loads(receipt.read_text())
              assert m['numeric_height_open_started'] is True
              assert r['scientific_terminal_decision'] is True
              assert r['numeric_open_marker_present'] is True
              assert r['raw_numeric_height_values_persisted'] is False
              assert r['post_outcome_retuning'] is False
              assert r['terminal_category'] in {
                  'empirical_n2_thickness_generalizing',
                  'empirical_n2_thickness_generalization_mixed',
                  'empirical_n2_thickness_not_generalizing',
                  'empirical_n2_thickness_unavailable',
              }
              primary = r.get('primary')
              if primary is not None:
                  assert 'information_nats' in primary
                  assert 'effective_vertical_states' in primary
                  assert len(primary['sealed_scores']) == 2
              serialized = json.dumps(r, sort_keys=True)
              forbidden = [
                  'height_min_result', 'height_max_result', 'height_mean_result',
                  'height_median_result', 'height_quantiles_result', 'raw_height_values'
              ]
              assert all(key not in serialized for key in forbidden)
              print('Scientific terminal receipt is complete; no raw numeric heights persisted.')
          elif code == 2:
              assert pre_failure.exists()
              assert not marker.exists()
              assert not receipt.exists()
              p = json.loads(pre_failure.read_text())
              assert p['numeric_height_opened'] is False
              assert p['scientific_terminal_decision'] is False
              print('Pre-numeric technical failure; scientific endpoint remains unopened.')
          elif code == 3:
              assert marker.exists()
              assert invalid.exists()
              assert not receipt.exists()
              p = json.loads(invalid.read_text())
              assert p['execution_status'] == 'invalid_after_numeric_open_no_rerun'
              assert p['post_outcome_retuning'] is False
              print('Numeric values were opened but execution was invalid; no rerun is authorized.')
          else:
              raise AssertionError(f'unexpected execution exit code {code}')
          PY
      - name: Upload immutable terminal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n2-bat-thickness-terminal-evidence
          path: terminal-output/
          if-no-files-found: error
          retention-days: 30
      - name: Fail workflow for non-terminal execution
        if: always()
        env:
          EXECUTION_EXIT_CODE: ${{ steps.execute.outputs.exit_code }}
        run: |
          if [ "${EXECUTION_EXIT_CODE}" != "0" ]; then
            exit 1
          fi
