name: publish-pypi

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to publish; must exactly match pyproject.toml'
        required: true
        default: '0.11.0'
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_tag: ${{ steps.release_meta.outputs.release_tag }}
      package_version: ${{ steps.release_meta.outputs.package_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve and verify release version
        id: release_meta
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path

          text = Path('pyproject.toml').read_text(encoding='utf-8')
          match = re.search(r'^version = "([^"]+)"$', text, re.M)
          if match is None:
              raise SystemExit('package version not found in pyproject.toml')
          version = match.group(1)
          event = os.environ['GITHUB_EVENT_NAME']
          if event == 'push':
              tag = os.environ['GITHUB_REF_NAME']
              if tag != f'v{version}':
                  raise SystemExit(
                      f'tag {tag!r} does not match package version v{version}'
                  )
          elif event == 'workflow_dispatch':
              requested = os.environ.get('REQUESTED_VERSION', '').strip()
              if requested != version:
                  raise SystemExit(
                      f'requested version {requested!r} does not match package version {version!r}'
                  )
              tag = f'v{version}'
          else:
              raise SystemExit(f'unsupported release event: {event}')

          output = Path(os.environ['GITHUB_OUTPUT'])
          with output.open('a', encoding='utf-8') as handle:
              handle.write(f'package_version={version}\n')
              handle.write(f'release_tag={tag}\n')
          PY
      - name: Install release tooling
        run: python -m pip install '.[release]'
      - name: Build distributions
        run: python -m build
      - name: Validate distributions
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/odsp-niche-geometry
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Create GitHub release after successful PyPI publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            gh release create "${RELEASE_TAG}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --generate-notes \
              --title "ODSP ${RELEASE_TAG}"
          else
            gh release create "${RELEASE_TAG}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --generate-notes \
              --title "ODSP ${RELEASE_TAG}"
          fi
