name: independent-directional-lattice-12edge-calibration

on:
  push:
    branches:
      - 'method/independent-directional-lattice-12edge-calibration'
  pull_request:
    paths:
      - 'odsp/independent_positive_lattice_family_calibration.py'
      - 'ODSP_INDEPENDENT_DIRECTIONAL_LATTICE_FAMILY_CALIBRATION_CONTRACT.json'
      - 'INDEPENDENT_DIRECTIONAL_LATTICE_FAMILY_CALIBRATION_RECEIPT.json'
      - 'tests/test_independent_positive_lattice_family_calibration.py'
      - 'tests/test_independent_positive_lattice_family_calibration_receipt.py'
      - '.github/workflows/independent-directional-lattice-12edge-calibration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core package with test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run contract, calibration and receipt tests
        run: >-
          python -m pytest -q
          tests/test_independent_positive_lattice_family_calibration.py
          tests/test_independent_positive_lattice_family_calibration_receipt.py
      - name: Re-run frozen 1000-simulation panel and match receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from odsp.independent_positive_lattice_family_calibration import run_independent_directional_lattice_family_calibration

          result = run_independent_directional_lattice_family_calibration(
              seed=20260922,
              simulations_per_scenario=1000,
              bootstrap_draws=500,
              group_count=6,
              contrast_correlation=0.5,
              confidence_level=0.95,
          )
          payload = result.as_dict()
          frozen = json.loads(
              Path("INDEPENDENT_DIRECTIONAL_LATTICE_FAMILY_CALIBRATION_RECEIPT.json").read_text(
                  encoding="utf-8"
              )
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          assert result.qualification_pass
          assert payload["generator_version"] == frozen["generator_version"]
          assert payload["seed"] == frozen["first_1000_simulation_run"]["seed"]
          assert payload["simulations_per_scenario"] == frozen["first_1000_simulation_run"]["simulations_per_scenario"]
          assert payload["bootstrap_draws_per_interval"] == frozen["first_1000_simulation_run"]["bootstrap_draws_per_interval"]
          assert payload["group_count"] == frozen["first_1000_simulation_run"]["group_count"]
          assert payload["contrast_correlation"] == frozen["first_1000_simulation_run"]["contrast_correlation"]
          assert payload["familywise_lower_confidence_level"] == frozen["first_1000_simulation_run"]["familywise_lower_confidence_level"]
          actual = {row["scenario_id"]: row for row in payload["scenarios"]}
          expected = {row["scenario_id"]: row for row in frozen["scenarios"]}
          assert actual.keys() == expected.keys()
          for scenario_id, row in actual.items():
              receipt = expected[scenario_id]
              for key in (
                  "distribution",
                  "blocks_per_group",
                  "contrast_count",
                  "one_sided_familywise_false_positive_rate",
                  "terminal_false_generalizing_rate",
                  "monte_carlo_standard_error",
                  "acceptance_pass",
              ):
                  assert row[key] == receipt[key]
          PY
