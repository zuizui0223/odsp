name: uljin-independent-q-split-alpha-v0

on:
  push:
    branches:
      - method/uljin-independent-q-calibration-split-alpha-v0
    paths:
      - 'ULJIN_INDEPENDENT_Q_SPLIT_ALPHA_V0_CONTRACT.json'
      - 'odsp/uljin_independent_q_split_alpha_v0.py'
      - 'tests/test_uljin_independent_q_split_alpha_v0.py'
      - 'scripts/run_uljin_independent_q_split_alpha_v0.py'
      - '.github/workflows/uljin-independent-q-split-alpha-v0.yml'
  workflow_dispatch:

jobs:
  first-frozen-independent-detector-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate joint Hoeffding coverage split alpha and zero-detector HOLD
        run: python -m pytest -q tests/test_uljin_independent_q_split_alpha_v0.py
      - name: First frozen complete independent calibration plus exact Fisher screen
        run: python scripts/run_uljin_independent_q_split_alpha_v0.py
      - name: Archive source-free calibration joint error receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uljin-independent-q-split-alpha-first-v0
          path: ULJIN_INDEPENDENT_Q_SPLIT_ALPHA_V0_FIRST_RECEIPT.json
          if-no-files-found: warn
