name: bop-dryad-external-source-only-preflight

on:
  pull_request:
    paths:
      - "research/BOP_DRYAD_EXTERNAL_SCHEMA_PREFLIGHT_V1_CONTRACT.json"
      - "scripts/bop_dryad_external_schema_preflight_v1.py"
      - "tests/test_bop_dryad_external_schema_preflight_v1.py"
      - "docs/bop_dryad_external_schema_preflight_v1.md"
      - ".github/workflows/bop-dryad-external-source-only-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feature-and-source-policy-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install minimal scientific test environment
        run: python -m pip install -e '.[dev]'
      - name: Validate source-only contract, feature mismatches and no-GPS access policy
        run: python -m pytest tests/test_bop_dryad_external_schema_preflight_v1.py

  official-small-metadata-probe:
    needs: feature-and-source-policy-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: No GPS downloads: two Dryad API calls plus three small file streams only
        run: python scripts/bop_dryad_external_schema_preflight_v1.py --out "$RUNNER_TEMP/bop-dryad-source-only-v1.json"
      - name: Check scientific ceiling and forbid direct frozen RF reuse
        run: |
          python -c "import json,os,pathlib; p=pathlib.Path(os.environ['RUNNER_TEMP'])/'bop-dryad-source-only-v1.json'; r=json.loads(p.read_text()); assert r['candidate_admission']=='NOT_ADMITTED'; assert r['raw_gps_or_height_outcomes_accessed'] is False; assert r['original_BOP_RF_direct_external_transfer_status']=='ORIGINAL_RF_PREDICTOR_INCOMPATIBLE'; assert r['BOP_existing_mixed_terminal_reclassified'] is False; print(json.dumps({'source':r['metadata_source_status'],'API':r['official_metadata_api']['dataset']['status'],'small_files':{k:v['status'] for k,v in r['small_non_gps_file_checks'].items()}},sort_keys=True))"
      - name: Archive deidentified source-only result including explicit holds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bop-dryad-source-only-v1
          path: ${{ runner.temp }}/bop-dryad-source-only-v1.json
          if-no-files-found: warn
          retention-days: 90
