name: bop-red-kite-raw-group-prefix-only-v1
on:
  pull_request:
    paths:
      - "research/BOP_RED_KITE_RAW_GROUP_PREFIX_ONLY_V1_CONTRACT.json"
      - "scripts/bop_red_kite_raw_group_prefix_only_v1.py"
      - "tests/test_bop_red_kite_raw_group_prefix_only_v1.py"
      - "docs/bop_red_kite_raw_group_prefix_only_v1.md"
      - ".github/workflows/bop-red-kite-raw-group-prefix-only-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-source-boundary-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest tests/test_bop_red_kite_raw_group_prefix_only_v1.py
  official-source-key-projection:
    needs: offline-source-boundary-tests
    if: ${{ needs.offline-source-boundary-tests.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Project only first key fields of exact two published source CSVs
        run: python scripts/bop_red_kite_raw_group_prefix_only_v1.py --out "$RUNNER_TEMP/bop-red-kite-raw-group-prefix-first.json"
      - name: Archive aggregate-only receipt even on data access HOLD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bop-red-kite-raw-group-prefix-first
          path: ${{ runner.temp }}/bop-red-kite-raw-group-prefix-first.json
          retention-days: 90
          if-no-files-found: warn
