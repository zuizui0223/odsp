name: snapshot-usa-2024-outcome-blind-deployments-v0

on:
  push:
    branches:
      - research/snapshot-usa-2024-outcome-blind-screen-v0
    paths:
      - 'ODSP_SNAPSHOT_USA_2024_DEPLOYMENT_SCREEN_V0_CONTRACT.json'
      - 'odsp/snapshot_usa_2024_structural_screen_v0.py'
      - 'scripts/screen_snapshot_usa_2024_deployments_v0.py'
      - 'tests/test_snapshot_usa_2024_structural_screen_v0.py'
      - '.github/workflows/snapshot-usa-2024-outcome-blind-deployments-v0.yml'
  workflow_dispatch:

jobs:
  structural:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Test structural methodology before any real deployment metadata is read
        run: python -m pytest -q tests/test_snapshot_usa_2024_structural_screen_v0.py
      - name: Download ONLY the predeclared deployment metadata CSV; never sequences
        run: |
          python scripts/screen_snapshot_usa_2024_deployments_v0.py \
            --frozen-download \
            --receipt snapshot_usa_2024_outcome_blind_deployment_receipt.json
      - name: Freeze structural receipt even if source is unavailable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-usa-2024-deployment-only-structural-receipt-v0
          path: snapshot_usa_2024_outcome_blind_deployment_receipt.json
          if-no-files-found: warn
