name: bop-red-kite-source-inventory-v1

on:
  pull_request:
    paths:
      - "research/BOP_RED_KITE_SOURCE_INVENTORY_V1_CONTRACT.json"
      - "scripts/bop_red_kite_source_inventory_v1.py"
      - "tests/test_bop_red_kite_source_inventory_v1.py"
      - "tests/test_bop_red_kite_first_inventory_receipt.py"
      - "scripts/verify_bop_red_kite_source_inventory_v1.py"
      - "BOP_RED_KITE_SOURCE_INVENTORY_V1_FIRST_RECEIPT.json"
      - "docs/bop_red_kite_source_inventory_v1.md"
      - ".github/workflows/bop-red-kite-source-inventory-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-outcome-source-rules:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Verify exact API URL, provider record version, synthetic mock MD5s and zero outcome access
        run: python -m pytest tests/test_bop_red_kite_source_inventory_v1.py tests/test_bop_method_spine_v1.py tests/test_bop_red_kite_first_inventory_receipt.py

  official-zenodo-record-inventory:
    needs: no-outcome-source-rules
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read EXACT public metadata API only; no Zenodo files/GPS/labels
        run: python scripts/bop_red_kite_source_inventory_v1.py --out "$RUNNER_TEMP/red-kite-inventory-first.json"
      - name: Replay full metadata-only result against original first official Actions artifact
        run: python scripts/verify_bop_red_kite_source_inventory_v1.py --result "$RUNNER_TEMP/red-kite-inventory-first.json"
      - name: Preserve first result, including metadata API failure/hold
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bop-red-kite-source-inventory-first
          path: ${{ runner.temp }}/red-kite-inventory-first.json
          retention-days: 90
          if-no-files-found: warn
