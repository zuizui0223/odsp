name: refit-information-lattice

on:
  pull_request:
    paths:
      - 'odsp/information_lattice.py'
      - 'odsp/refit_information_lattice.py'
      - 'tests/test_information_lattice.py'
      - 'tests/test_refit_information_lattice.py'
      - 'tests/test_refit_information_lattice_method_contract.py'
      - 'docs/refit_aware_information_lattice_v1.md'
      - 'ODSP_REFIT_INFORMATION_LATTICE_CONTRACT_V1.json'
      - '.github/workflows/refit-information-lattice.yml'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core package without prediction extra
        run: python -m pip install -e '.[dev]'
      - name: Run fixed and refit-aware lattice tests
        run: >-
          python -m pytest -q
          tests/test_information_lattice.py
          tests/test_refit_information_lattice.py
          tests/test_refit_information_lattice_method_contract.py
      - name: Import refit-aware lattice without prediction extra
        run: >-
          python -c "from odsp.refit_information_lattice import certify_refit_information_lattice; assert callable(certify_refit_information_lattice)"
