name: evaluation-ledger-binding

on:
  pull_request:
    paths:
      - 'EVALUATION_LEDGER_BINDING_CONTRACT.json'
      - 'EVALUATION_LEDGER_BINDING_VALIDATION_RECEIPT.json'
      - 'odsp/evaluation_ledger_binding.py'
      - 'odsp/evaluation_ledger_binding_benchmark.py'
      - 'scripts/run_evaluation_ledger_binding_benchmark.py'
      - 'tests/test_evaluation_ledger_binding.py'
      - 'tests/test_evaluation_ledger_binding_contract.py'
      - 'tests/test_evaluation_ledger_binding_benchmark.py'
      - 'tests/test_evaluation_ledger_binding_receipt.py'
      - 'docs/evaluation_ledger_binding.md'
      - '.github/workflows/evaluation-ledger-binding.yml'
  push:
    branches: [main]
    paths:
      - 'EVALUATION_LEDGER_BINDING_CONTRACT.json'
      - 'EVALUATION_LEDGER_BINDING_VALIDATION_RECEIPT.json'
      - 'odsp/evaluation_ledger_binding.py'
      - 'odsp/evaluation_ledger_binding_benchmark.py'
      - 'scripts/run_evaluation_ledger_binding_benchmark.py'
      - 'tests/test_evaluation_ledger_binding.py'
      - 'tests/test_evaluation_ledger_binding_contract.py'
      - 'tests/test_evaluation_ledger_binding_benchmark.py'
      - 'tests/test_evaluation_ledger_binding_receipt.py'
      - 'docs/evaluation_ledger_binding.md'
      - '.github/workflows/evaluation-ledger-binding.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ODSP development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Test evaluation-ledger binding API and frozen contract
        run: |
          python -m pytest -q \
            tests/test_evaluation_ledger_binding.py \
            tests/test_evaluation_ledger_binding_contract.py
          if [ -f tests/test_evaluation_ledger_binding_receipt.py ]; then
            python -m pytest -q tests/test_evaluation_ledger_binding_receipt.py
          fi
      - name: Run frozen evaluation-ledger binding benchmark
        run: |
          python scripts/run_evaluation_ledger_binding_benchmark.py \
            --output artifacts/EVALUATION_LEDGER_BINDING_BENCHMARK.json
          python -m pytest -q tests/test_evaluation_ledger_binding_benchmark.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/EVALUATION_LEDGER_BINDING_BENCHMARK.json').read_text())
          assert r['passed'] is True
          assert len(r['checks']) == 16
          assert all(row['passed'] for row in r['checks'])
          assert r['clean']['separation_category'] == 'evaluation_ledgers_consistently_bound'
          assert r['wrong_declared_final_digest']['separation_category'] == 'evaluation_ledger_binding_mismatch'
          assert r['stage_digest_substitution']['mismatched_stage_count'] == 1
          print(json.dumps(r, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-ledger-binding-benchmark
          path: artifacts/EVALUATION_LEDGER_BINDING_BENCHMARK.json
          if-no-files-found: error
          retention-days: 90
