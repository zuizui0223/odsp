name: independent French Gyps paired GPS vs barometric height 5km probability-shape source validation

on:
  push:
    branches: [prospective/france-griffon-2019-2021-20261022]
    paths:
      - prospective/FRANCE_GYPS_2019_2021_DUAL_SENSOR_5KM_IDENTITY_FREEZE_V1.json
      - prospective/france_gyps_2019_dualsensor_identity.py
      - prospective/test_france_gyps_2019_dualsensor_identity.py
      - .github/workflows/france-gyps-2019-dual-height-identity.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest numpy numba pyproj
      - name: Test source provenance, GPS vs barometric same events and exact-date null
        env:
          NUMBA_CACHE_DIR: /tmp/french-Gyps-paired-sensor-synthetic-numba
        run: |
          python -m pytest -q prospective/test_france_gyps_2019_dualsensor_identity.py
          python - <<'PY'
          import json
          d=json.load(open('prospective/FRANCE_GYPS_2019_2021_DUAL_SENSOR_5KM_IDENTITY_FREEZE_V1.json'))
          assert d['phase']=='FROZEN_BEFORE_NUMERIC_NATIVE_GPS_OR_BAROMETRIC_HEIGHT'
          assert d['source']['source_first5min_flight_records']==742423
          assert d['source']['eligible5km_birds']==28
          assert d['vertical_profile']['target_day_scored_events_min']==50
          assert d['null']['permutations']==999 if 'permutations' in d['null'] else True
          print('Paired source and numerical scoring family fixed before native height')
          PY
  original-french-source:
    needs: synthetic
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy numba pyproj
      - name: Retrieve exact original SOURCE and cross-study study-name/animal-ID source gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/france_gyps_sensor
          curl --fail --location --silent --show-error --retry 4 --max-time 150 \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/zuizui0223/odsp/actions/artifacts/12398443408/zip' \
            -o build/france_gyps_sensor/preheight.zip
          echo '77286e6ad5639fdeca5c73b6c9049b6b00e3e601b467d34f966495c3d0f28a6c  build/france_gyps_sensor/preheight.zip' | sha256sum --check
          unzip -p build/france_gyps_sensor/preheight.zip \
            FRANCE_GYPS_2019_2021_XY_INSTRUMENT_SUPPORT_V1.json \
            > build/france_gyps_sensor/source_preheight.json
          curl --fail --location --silent --show-error --retry 4 --max-time 150 \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/zuizui0223/odsp/actions/artifacts/12399325799/zip' \
            -o build/france_gyps_sensor/crosswalk.zip
          echo '86a5c4c587119fb62ab331833ece731b2d937b46f717ed1f20dff86763dcdb6e  build/france_gyps_sensor/crosswalk.zip' | sha256sum --check
          unzip -p build/france_gyps_sensor/crosswalk.zip \
            FRANCE_GYPS_2019_VS_SCACCO_PARENT_STUDY_SOURCE_CROSSWALK_V1.json \
            > build/france_gyps_sensor/source_crosswalk.json
          python - <<'PY'
          import json
          x=json.load(open('build/france_gyps_sensor/source_preheight.json'))
          y=json.load(open('build/france_gyps_sensor/source_crosswalk.json'))
          assert x['numeric_native_GPS_height_values_read'] is False
          assert x['horizontal_day_eligibility_by_cell_m']['5000']['n_unique_birds_with_qualifying_day_events']==28
          assert x['horizontal_day_eligibility_by_cell_m']['5000']['source_bird_ID_sha256']=='031d6226418cc0291a48d7d4eb44f1cae003df3a411ef3767a5229dbd45b1928'
          assert y['source_independence_category']=='DIFFERENT_STUDY_NAMES_AND_ZERO_EXACT_SOURCE_ANIMAL_IDS'
          assert y['native_height_values_read'] is False
          print('All original 30/28 Gyps-source constraints and other-study name/ID separation checked before native heights')
          PY
      - name: Fetch original official 2019-2021 raw GPS 1.09GB archive after biological source gates
        run: |
          set -euo pipefail
          cd build/france_gyps_sensor
          curl --http1.1 --fail --location --silent --show-error \
            --retry 6 --retry-all-errors --retry-delay 8 --max-time 1800 \
            'https://data.indores.fr/api/access/datafile/5114' \
            -o windTurbineAvoidance.zip
          echo 'b18cc8004d311d19ff24060f655178bf  windTurbineAvoidance.zip' | md5sum --check
          test "$(stat -c %s windTurbineAvoidance.zip)" -eq 1093170227
      - name: Open GPS and barometric values only for identical frozen first-fix sources
        env:
          NUMBA_CACHE_DIR: /tmp/french-Gyps-dual-sensor-original-null-numba
        run: |
          set -euo pipefail
          python -m prospective.france_gyps_2019_dualsensor_identity \
            --source build/france_gyps_sensor/windTurbineAvoidance.zip \
            --preheight-result build/france_gyps_sensor/source_preheight.json \
            --source-crosswalk build/france_gyps_sensor/source_crosswalk.json \
            --out build/france_gyps_sensor/results
      - name: Record support or unavailable without any rescue
        run: |
          python - <<'PY'
          import json
          f='build/france_gyps_sensor/results/FRANCE_GYPS_2019_2021_GPS_BARO_DUAL_HEIGHT_RESULT_V1.json'
          d=json.load(open(f))
          assert d['analysis']=='FRENCH_GYPS_2019_2021_GPS_VS_BARO_5KM_INDIVIDUAL_HEIGHT_SHAPE_V1'
          assert d['source_archive_md5']=='b18cc8004d311d19ff24060f655178bf'
          assert d['source_noheight_gate_run']==39714803696
          assert d['source_overlap_gate_run']==39715960239
          assert d['source_altitude_quality']['original_total_source_fixes']==742423
          assert d['preheight_bird_roster_sha256']=='031d6226418cc0291a48d7d4eb44f1cae003df3a411ef3767a5229dbd45b1928'
          assert not d['native_sensor_independence_proven']
          assert d['terminal'] in (
              'unavailable','paired_sensor_robust_individual_height_shape',
              'paired_sensor_not_established')
          if d['terminal']=='paired_sensor_robust_individual_height_shape':
              assert all(v['terminal']=='supported_own_bird_altitude_shape'
                  for v in d['sensor_results'].values())
          print(json.dumps({
            'final_status':d['terminal'],
            'paired_quality':d['source_altitude_quality']['source_firstfix_pair_complete_fraction'],
            'paired_bird_days':d['source_altitude_quality'].get('fixed_eligible_bird_days_after_paired_qc_and_50fix'),
            'sensor_results':{key:{
               'status':v['terminal'],
               'birds':v.get('observed',{}).get('eligible_birds'),
               'bird_days':v.get('observed',{}).get('eligible_days'),
               'gain':v.get('observed',{}).get('mean_gain'),
               'null_valid':v.get('calibration',{}).get('valid'),
               'Holm_p':v.get('holm_p_upper')
            } for key,v in d['sensor_results'].items()}
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: france-gyps-2019-2021-original-dual-native-GPS-baro-5km-shape-v1
          path: build/france_gyps_sensor/results/*
          if-no-files-found: warn
