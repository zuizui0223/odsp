name: ri-solar-v2-pinned-first-taxon-composition-v0

on:
  push:
    branches:
      - ecology/ri-solar-v2-taxonomic-sensitivity-v0
    paths:
      - 'RI_SOLAR_V2_POSTOUTCOME_TAXON_COMPOSITION_CONTRACT.json'
      - 'odsp/ri_solar_v2_taxon_composition_v0.py'
      - 'tests/test_ri_solar_v2_taxon_composition_v0.py'
      - 'scripts/replay_ri_solar_v2_taxon_composition_v0.py'
      - '.github/workflows/ri-solar-v2-first-taxon-composition-v0.yml'
  workflow_dispatch:

jobs:
  existing-first-outcome-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test no fabricated year support and hash locks
        run: python -m pytest -q tests/test_ri_solar_v2_taxon_composition_v0.py
      - name: Retrieve immutable original v2 first-result artifact (NO raw wildlife ZIP)
        uses: actions/download-artifact@v4
        with:
          name: ri-solar-clock-coded-yearseason-v2-first
          run-id: 37747931559
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .analysis_input
      - name: Reproduce frozen post-outcome descriptive taxon-standardization
        run: python scripts/replay_ri_solar_v2_taxon_composition_v0.py
      - name: Archive taxon composition report even if no source can be opened
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ri-solar-v2-taxonomic-composition-v0-first
          path: RI_SOLAR_V2_TAXON_COMPOSITION_FIRST_RECEIPT.json
          if-no-files-found: warn
