name: independent-refit-untouched-external-lattice-v5

on:
  push:
    branches:
      - 'method/independent-refit-untouched-external-lattice-v5'
  pull_request:
    paths:
      - 'odsp/external_independent_lattice_freeze_manifest.py'
      - 'odsp/untouched_external_refit_independent_positive_lattice_contract_v5.py'
      - 'odsp/confirmatory_method_routing.py'
      - 'odsp/confirmatory_route_evidence.py'
      - 'ODSP_CONFIRMATORY_ROUTE_EVIDENCE_REGISTRY_V3.json'
      - 'ODSP_UNTOUCHED_EXTERNAL_INDEPENDENT_ALL_REFIT_LATTICE_V5_CONTRACT.json'
      - 'tests/test_untouched_external_independent_all_refit_lattice_v5.py'
      - '.github/workflows/independent-refit-untouched-external-lattice-v5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core package with test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run independent external lattice v5 tests
        run: python -m pytest -q tests/test_untouched_external_independent_all_refit_lattice_v5.py
