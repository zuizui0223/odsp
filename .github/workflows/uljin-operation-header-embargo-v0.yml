name: uljin-operation-metadata-header-embargo-v0

on:
  push:
    branches:
      - ecology/uljin-photoperiod-mirror-design-v0
    paths:
      - 'ULJIN_OPERATION_METADATA_HEADER_PREFLIGHT_V0_CONTRACT.json'
      - 'odsp/uljin_operation_log_header_preflight_v0.py'
      - 'tests/test_uljin_operation_log_header_preflight_v0.py'
      - 'scripts/uljin_operation_header_preflight_v0.py'
      - '.github/workflows/uljin-operation-header-embargo-v0.yml'
  workflow_dispatch:

jobs:
  embargoed-operation-source-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Synthetic source integrity and no-animal-event access tests
        run: python -m pytest -q tests/test_uljin_operation_log_header_preflight_v0.py
      - name: Emit unverified-source HOLD without accessing EcoBank animal records
        run: python scripts/uljin_operation_header_preflight_v0.py
      - name: Preserve first source-accessibility and provenance receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uljin-operation-source-header-embargo-v0-first
          path: ULJIN_OPERATION_METADATA_FIRST_HEADER_PREFLIGHT_RECEIPT.json
          if-no-files-found: warn
