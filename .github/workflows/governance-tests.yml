name: governance-tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "test_lane_policy.py"
      - "tests/conftest.py"
      - "pyproject.toml"
      - "odsp/forecast_*.py"
      - "odsp/evaluation_*.py"
      - "odsp/*provenance*.py"
      - "odsp/*trust*.py"
      - "odsp/*robust*.py"
      - "odsp/*refit*.py"
      - "odsp/*checkpoint*.py"
      - "odsp/*ledger*.py"
      - "odsp/*coverage*.py"
      - "odsp/*model_selection*.py"
      - "odsp/*block_*.py"
      - "odsp/*simultaneous*.py"
      - "odsp/*heldout_row_alignment*.py"
      - "odsp/*aligned_refit*.py"
      - "tests/test_forecast_*.py"
      - "tests/test_evaluation_*.py"
      - "tests/test_*provenance*.py"
      - "tests/test_*trust*.py"
      - "tests/test_*robust*.py"
      - "tests/test_*refit*.py"
      - "tests/test_*checkpoint*.py"
      - "tests/test_*ledger*.py"
      - "tests/test_*coverage*.py"
      - "tests/test_*model_selection*.py"
      - "tests/test_*block_*.py"
      - "tests/test_*simultaneous*.py"
      - "tests/test_*heldout_row_alignment*.py"
      - ".github/workflows/governance-tests.yml"

concurrency:
  group: governance-tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test governance lane
        run: python -m pytest -m governance --durations=20
