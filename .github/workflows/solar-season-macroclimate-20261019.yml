name: Solar season geographic macroclimate database pilot 2026-10-19
on:
  push:
    branches:
      - ecology/seasonal-hysteresis-cross-landscape-paper-v0
    paths:
      - 'research/SOLAR_SEASON_MACROCLIMATE_PILOT_20261019.json'
      - 'scripts/solar_season_macroclimate_20261019.py'
      - 'tests/test_solar_season_macroclimate_20261019.py'
      - '.github/workflows/solar-season-macroclimate-20261019.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  climate_database_pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific and landmask readers
        run: python -m pip install 'numpy>=1.24,<3' 'scipy>=1.11,<2' 'shapely>=2,<3' 'pyshp>=2.3,<4'
      - name: Run seven fixture tests before real geographic and climate data
        run: python -m unittest discover -s tests -p 'test_solar_season_macroclimate_20261019.py' -v
      - name: Generate and lock land-only roster without requesting any weather
        run: python -m scripts.solar_season_macroclimate_20261019 prepare --out outputs/macroclimate_20261019
      - name: Archive fixed all-candidate and selected-site registry before outcomes
        uses: actions/upload-artifact@v4
        with:
          name: macroclimate-land-only-roster-20261019
          path: |
            outputs/macroclimate_20261019/registry.json
            outputs/macroclimate_20261019/registry.sha256
            outputs/macroclimate_20261019/selected_sites.csv
            outputs/macroclimate_20261019/all_grid_candidates.csv
          if-no-files-found: error
      - name: Retrieve fixed ERA5 source, compare modeled daylength and create SQLite database
        run: python -m scripts.solar_season_macroclimate_20261019 collect --out outputs/macroclimate_20261019
      - name: Archive full database, original responses and all missing outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solar-season-macroclimate-database-20261019
          path: outputs/macroclimate_20261019
          if-no-files-found: error
