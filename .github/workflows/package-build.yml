name: package-build

on:
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'PYPI_README.md'
      - 'LICENSE'
      - 'CITATION.cff'
      - '.zenodo.json'
      - 'odsp/**'
      - 'docs/using_odsp_from_r.md'
      - 'docs/endpoint_contract_cli_v1.md'
      - 'tests/test_endpoint_contract_cli.py'
      - 'tests/test_release_surface.py'
      - '.github/workflows/package-build.yml'
      - '.github/workflows/publish-pypi.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install release tooling
        run: python -m pip install '.[release,predict]'
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check dist/*
      - name: Inspect built artifacts
        run: ls -lh dist
      - name: Test wheel in a clean environment
        run: |
          python -m venv /tmp/odsp-wheel
          /tmp/odsp-wheel/bin/python -m pip install --upgrade pip
          /tmp/odsp-wheel/bin/python -m pip install scikit-learn
          /tmp/odsp-wheel/bin/python -m pip install dist/*.whl
          /tmp/odsp-wheel/bin/odsp --help
          /tmp/odsp-wheel/bin/python -c "from importlib.metadata import version; assert version('odsp-niche-geometry') == '0.11.0'"
      - name: Run release-surface tests
        run: python -m pytest -q tests/test_release_surface.py tests/test_endpoint_contract_cli.py
      - uses: actions/upload-artifact@v4
        with:
          name: odsp-distributions
          path: dist/*
