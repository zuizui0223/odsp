name: Serengeti same-camera trophic photo-time contrast v0

on:
  push:
    branches:
      - ecology/seasonal-hysteresis-cross-landscape-paper-v0
    paths:
      - 'research/SERENGETI_SAME_STATION_TROPHIC_PHOTO_TIME_V0_CONTRACT.json'
      - 'scripts/run_serengeti_same_station_trophic_photo_time_v0.py'
      - 'tests/test_serengeti_same_station_trophic_photo_time_v0.py'
      - '.github/workflows/serengeti-same-camera-trophic-photo-v0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-observational-trophic-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only source-coordinate library
        run: python -m pip install 'pyproj>=3.6,<4'
      - name: Verify all five source and known-truth ecological claim tests before original event reading
        run: python -m unittest discover -s tests -p 'test_serengeti_same_station_trophic_photo_time_v0.py' -v
      - name: Download original independently pinned Serengeti consensus and camera-valid-date records
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .source_serengeti_trophic
          curl -L --fail --retry 3 --retry-delay 4 --max-time 1000 \
            'https://zenodo.org/records/5026386/files/consensus_data.csv?download=1' \
            -o .source_serengeti_trophic/consensus_data.csv
          curl -L --fail --retry 3 --retry-delay 4 --max-time 120 \
            'https://zenodo.org/records/5026386/files/search_effort.csv?download=1' \
            -o .source_serengeti_trophic/search_effort.csv
          echo '5ed2d32fd09127c178cf9dca8ccfd623  .source_serengeti_trophic/consensus_data.csv' | md5sum -c -
          echo '27cb42f3feaa0642b17cbde24ba15fbd  .source_serengeti_trophic/search_effort.csv' | md5sum -c -
      - name: Verify exact FIRST source results and evaluate frozen same-camera predator/prey contrasts
        run: |
          python -m scripts.run_serengeti_same_station_trophic_photo_time_v0 \
            --consensus .source_serengeti_trophic/consensus_data.csv \
            --effort .source_serengeti_trophic/search_effort.csv \
            --output outputs/serengeti_same_camera_trophic_photo_v0.json
      - name: Archive source-derived AGGREGATE ONLY; original camera IDs/timestamps never exported
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serengeti-trophic-same-camera-record-only-v0
          path: outputs/serengeti_same_camera_trophic_photo_v0.json
          if-no-files-found: warn
