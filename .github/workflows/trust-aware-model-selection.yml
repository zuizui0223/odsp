name: trust-aware-model-selection

on:
  pull_request:
    paths:
      - 'TRUST_AWARE_MODEL_SELECTION_CONTRACT.json'
      - 'TRUST_AWARE_MODEL_SELECTION_VALIDATION_RECEIPT.json'
      - 'odsp/trust_aware_model_selection.py'
      - 'odsp/trust_aware_model_selection_benchmark.py'
      - 'scripts/run_trust_aware_model_selection_benchmark.py'
      - 'tests/test_trust_aware_model_selection.py'
      - 'tests/test_trust_aware_model_selection_benchmark.py'
      - 'tests/test_trust_aware_model_selection_contract.py'
      - 'tests/test_trust_aware_model_selection_receipt.py'
      - 'docs/trust_aware_model_selection_v2.md'
      - '.github/workflows/trust-aware-model-selection.yml'
  push:
    branches: [main]
    paths:
      - 'TRUST_AWARE_MODEL_SELECTION_CONTRACT.json'
      - 'TRUST_AWARE_MODEL_SELECTION_VALIDATION_RECEIPT.json'
      - 'odsp/trust_aware_model_selection.py'
      - 'odsp/trust_aware_model_selection_benchmark.py'
      - 'scripts/run_trust_aware_model_selection_benchmark.py'
      - 'tests/test_trust_aware_model_selection.py'
      - 'tests/test_trust_aware_model_selection_benchmark.py'
      - 'tests/test_trust_aware_model_selection_contract.py'
      - 'tests/test_trust_aware_model_selection_receipt.py'
      - 'docs/trust_aware_model_selection_v2.md'
      - '.github/workflows/trust-aware-model-selection.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ODSP core dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Test selection API and frozen contract
        run: |
          python -m pytest -q \
            tests/test_trust_aware_model_selection.py \
            tests/test_trust_aware_model_selection_benchmark.py \
            tests/test_trust_aware_model_selection_contract.py
          if [ -f tests/test_trust_aware_model_selection_receipt.py ]; then
            python -m pytest -q tests/test_trust_aware_model_selection_receipt.py
          fi
      - name: Run frozen known-truth selection benchmark
        run: |
          mkdir -p artifacts
          python scripts/run_trust_aware_model_selection_benchmark.py \
            --output artifacts/TRUST_AWARE_MODEL_SELECTION_BENCHMARK.json
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('artifacts/TRUST_AWARE_MODEL_SELECTION_BENCHMARK.json').read_text())
          assert r['passed'] is True
          assert all(row['passed'] for row in r['checks'])
          assert r['selection']['recommended_by_log_score'] == 'balanced_trusted'
          assert r['selection']['pareto_front_names'] == ['balanced_trusted']
          by_name = {row['name']: row for row in r['selection']['candidates']}
          assert by_name['pooled_masked_coverage_failure']['forecast_score']['coverage_ok'] is True
          assert by_name['pooled_masked_coverage_failure']['groupwise_trust']['coverage_category'] == 'mixed'
          assert by_name['pooled_masked_coverage_failure']['trusted_admissible'] is False
          print(json.dumps(r, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: trust-aware-model-selection-benchmark
          path: artifacts/TRUST_AWARE_MODEL_SELECTION_BENCHMARK.json
          if-no-files-found: error
          retention-days: 90
