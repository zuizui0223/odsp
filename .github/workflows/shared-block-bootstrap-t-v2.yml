name: shared-block-bootstrap-t-v2

on:
  pull_request:
    paths:
      - 'odsp/bootstrap_t.py'
      - 'odsp/shared_block_certification.py'
      - 'odsp/shared_block_certification_v2.py'
      - 'odsp/shared_block_bootstrap_t_calibration.py'
      - 'tests/test_shared_block_certification_v2.py'
      - 'tests/test_shared_block_bootstrap_t_v2_contract.py'
      - 'ODSP_SHARED_BLOCK_BOOTSTRAP_T_V2_CONTRACT.json'
      - 'docs/shared_block_bootstrap_t_v2.md'
      - '.github/workflows/shared-block-bootstrap-t-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core package without prediction extra
        run: python -m pip install -e '.[dev]'
      - name: Run paired bootstrap-t v2 unit and contract tests
        run: >-
          python -m pytest -q
          tests/test_shared_block_certification_v2.py
          tests/test_shared_block_bootstrap_t_v2_contract.py
      - name: Run predeclared correlated-null calibration
        run: |
          python - <<'PY'
          import json
          from odsp.shared_block_bootstrap_t_calibration import run_shared_block_bootstrap_t_calibration

          result = run_shared_block_bootstrap_t_calibration()
          payload = result.as_dict()
          print('SHARED_BLOCK_BOOTSTRAP_T_V2_CALIBRATION=' + json.dumps(payload, sort_keys=True))
          assert result.qualification_pass, payload
          for scenario in result.scenarios:
              assert scenario.v2_acceptance_pass, scenario
          PY
