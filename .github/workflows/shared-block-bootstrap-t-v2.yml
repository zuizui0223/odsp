name: shared-block-bootstrap-t-v2

on:
  pull_request:
    paths:
      - 'odsp/bootstrap_t.py'
      - 'odsp/shared_block_certification.py'
      - 'odsp/shared_block_certification_v2.py'
      - 'odsp/shared_block_bootstrap_t_calibration.py'
      - 'tests/test_shared_block_certification_v2.py'
      - 'tests/test_shared_block_bootstrap_t_v2_contract.py'
      - 'tests/test_shared_block_bootstrap_t_v2_receipt.py'
      - 'ODSP_SHARED_BLOCK_BOOTSTRAP_T_V2_CONTRACT.json'
      - 'SHARED_BLOCK_BOOTSTRAP_T_V2_OPERATING_CHARACTERISTICS_RECEIPT.json'
      - 'docs/shared_block_bootstrap_t_v2.md'
      - '.github/workflows/shared-block-bootstrap-t-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core package without prediction extra
        run: python -m pip install -e '.[dev]'
      - name: Run paired bootstrap-t v2 unit, contract and receipt tests
        run: >-
          python -m pytest -q
          tests/test_shared_block_certification_v2.py
          tests/test_shared_block_bootstrap_t_v2_contract.py
          tests/test_shared_block_bootstrap_t_v2_receipt.py
      - name: Run deterministic predeclared correlated-null calibration
        run: |
          python - <<'PY'
          import json
          from odsp.shared_block_bootstrap_t_calibration import (
              GENERATOR_VERSION,
              run_shared_block_bootstrap_t_calibration,
          )

          result = run_shared_block_bootstrap_t_calibration()
          observed = result.as_dict()
          print('SHARED_BLOCK_BOOTSTRAP_T_V2_CALIBRATION=' + json.dumps(observed, sort_keys=True))
          assert observed['generator_version'] == GENERATOR_VERSION
          assert result.qualification_pass, observed
          assert all(row['v2_acceptance_pass'] is True for row in observed['scenarios'])
          print('SHARED_BLOCK_BOOTSTRAP_T_V2_DETERMINISTIC_CALIBRATION_QUALIFIED=true')
          PY
