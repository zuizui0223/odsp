name: ri-solar-clock-schema-v1-exploratory

on:
  push:
    branches:
      - ecology/ri-solar-clock-schema-v1-exploratory
    paths:
      - 'RI_SOLAR_CLOCK_SCHEMA_V1_EXPLORATORY_CONTRACT.json'
      - 'odsp/ri_solar_clock_schema_v1.py'
      - 'scripts/run_ri_solar_clock_schema_v1.py'
      - 'tests/test_ri_solar_clock_schema_v1.py'
      - '.github/workflows/ri-solar-clock-schema-v1-exploratory.yml'
  workflow_dispatch:

jobs:
  heldout-site-year-exploratory:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Original ecological mechanism and literal schema tests
        run: |
          python -m pytest -q \
            tests/test_ri_solar_clock_transfer_v0.py \
            tests/test_ri_solar_source_v0.py \
            tests/test_ri_solar_clock_schema_v1.py
      - name: One-shot source-pinned exploratory v1 solar-clock heldout comparison
        run: python scripts/run_ri_solar_clock_schema_v1.py
      - name: Preserve first exploratory result OR unavailability
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ri-solar-clock-schema-v1-first-exploratory
          path: RI_SOLAR_CLOCK_SCHEMA_V1_FIRST_EXPLORATORY_RESULT.json
          if-no-files-found: warn
