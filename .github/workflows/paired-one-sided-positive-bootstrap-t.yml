name: paired-one-sided-positive-bootstrap-t

on:
  pull_request:
    paths:
      - 'odsp/bootstrap_t.py'
      - 'odsp/positive_transfer_bootstrap_t.py'
      - 'odsp/shared_block_certification_v2.py'
      - 'odsp/shared_block_positive_certification.py'
      - 'odsp/shared_block_positive_information.py'
      - 'odsp/shared_block_positive_calibration.py'
      - 'tests/test_shared_block_positive_certification.py'
      - 'tests/test_shared_block_positive_calibration.py'
      - 'tests/test_paired_one_sided_positive_bootstrap_t_receipt.py'
      - 'ODSP_PAIRED_ONE_SIDED_POSITIVE_BOOTSTRAP_T_CONTRACT.json'
      - 'PAIRED_ONE_SIDED_POSITIVE_BOOTSTRAP_T_NULL_CALIBRATION_RECEIPT.json'
      - '.github/workflows/paired-one-sided-positive-bootstrap-t.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core package without prediction extra
        run: python -m pip install -e '.[dev]'
      - name: Run paired one-sided unit, calibration and receipt tests
        run: >-
          python -m pytest -q
          tests/test_shared_block_positive_certification.py
          tests/test_shared_block_positive_calibration.py
          tests/test_paired_one_sided_positive_bootstrap_t_receipt.py
      - name: Re-run 1000-simulation paired null panel and match frozen receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from odsp.shared_block_positive_calibration import (
              GENERATOR_VERSION,
              run_paired_positive_null_calibration,
          )

          contract = json.loads(
              Path('ODSP_PAIRED_ONE_SIDED_POSITIVE_BOOTSTRAP_T_CONTRACT.json').read_text()
          )
          expected = json.loads(
              Path('PAIRED_ONE_SIDED_POSITIVE_BOOTSTRAP_T_NULL_CALIBRATION_RECEIPT.json').read_text()
          )
          result = run_paired_positive_null_calibration()
          observed = result.as_dict()
          print('PAIRED_ONE_SIDED_POSITIVE_BOOTSTRAP_T_NULL_CALIBRATION=' + json.dumps(observed, sort_keys=True))
          assert observed['generator_version'] == GENERATOR_VERSION
          assert result.qualification_pass, observed
          run = expected['first_1000_simulation_run']
          for field in (
              'seed', 'simulations_per_scenario', 'bootstrap_draws_per_interval',
              'group_count', 'contrast_count', 'group_correlation',
              'contrast_correlation', 'familywise_lower_confidence_level'
          ):
              assert observed[field] == run[field]
          frozen = {row['scenario_id']: row for row in expected['scenarios']}
          actual = {row['scenario_id']: row for row in observed['scenarios']}
          assert set(actual) == set(frozen)
          fields = (
              'one_sided_familywise_false_positive_rate',
              'terminal_false_generalizing_rate',
              'monte_carlo_standard_error',
          )
          limit = contract['acceptance_rule']['maximum_accepted_rate_at_1000_simulations']
          for scenario_id in sorted(frozen):
              assert actual[scenario_id]['blocks_per_group'] == frozen[scenario_id]['blocks_per_group']
              assert actual[scenario_id]['distribution'] == frozen[scenario_id]['distribution']
              assert actual[scenario_id]['one_sided_familywise_false_positive_rate'] <= limit
              for field in fields:
                  assert abs(float(actual[scenario_id][field]) - float(frozen[scenario_id][field])) <= 1e-15, (
                      scenario_id, field, actual[scenario_id][field], frozen[scenario_id][field]
                  )
          print('PAIRED_ONE_SIDED_POSITIVE_BOOTSTRAP_T_NULL_CALIBRATION_MATCHES_FROZEN_RECEIPT=true')
          PY
