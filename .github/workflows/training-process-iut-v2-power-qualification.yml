name: training-process-iut-v2-power-qualification

on:
  pull_request:
    paths:
      - 'odsp/training_process_positive_transfer.py'
      - 'odsp/training_process_positive_transfer_v2.py'
      - 'odsp/training_process_positive_calibration.py'
      - 'odsp/training_process_positive_power_calibration.py'
      - 'odsp/training_process_positive_iut_power_calibration.py'
      - 'tests/test_training_process_positive_transfer_v2.py'
      - 'tests/test_training_process_iut_calibration_contracts.py'
      - 'ODSP_TRAINING_PROCESS_IUT_POWER_CALIBRATION_CONTRACT.json'
      - 'scripts/run_training_process_iut_power_calibration.py'
      - '.github/workflows/training-process-iut-v2-power-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-power:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core package
        run: python -m pip install -e '.[dev]'
      - name: Validate v2 IUT semantics and frozen design
        run: >-
          python -m pytest -q
          tests/test_training_process_positive_transfer_v2.py
          tests/test_training_process_iut_calibration_contracts.py
      - name: Run frozen first-1000 IUT power qualification
        run: |
          python scripts/run_training_process_iut_power_calibration.py \
            --output /tmp/iut-power-v2.json \
            --seed 20261014 \
            --simulations 1000 \
            --bootstrap-draws 500
          echo 'TRAINING_PROCESS_IUT_V2_POWER_BEGIN'
          cat /tmp/iut-power-v2.json
          echo 'TRAINING_PROCESS_IUT_V2_POWER_END'
