name: freeze-confirmatory-implementation-v1

on:
  pull_request:
    paths:
      - 'odsp/**/*.py'
      - 'tests/test_confirmatory_implementation_lock_v1.py'
      - 'ODSP_CONFIRMATORY_IMPLEMENTATION_LOCK_V1.json'
      - '.github/workflows/freeze-confirmatory-implementation-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core package with test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run confirmatory implementation-lock tests
        run: python -m pytest -q tests/test_confirmatory_implementation_lock_v1.py
