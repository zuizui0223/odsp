name: ri-solar-v2-postoutcome-paired-site-parity-bootstrap

on:
  push:
    branches:
      - ecology/ri-solar-v2-site-paired-parity-bootstrap-v0
    paths:
      - 'RI_SOLAR_V2_SITE_PAIRED_SEASON_PARITY_BOOTSTRAP_CONTRACT.json'
      - 'odsp/ri_solar_v2_site_paired_parity_bootstrap_v0.py'
      - 'tests/test_ri_solar_v2_site_paired_parity_bootstrap_v0.py'
      - 'scripts/run_ri_solar_v2_site_paired_parity_bootstrap_v0.py'
      - '.github/workflows/ri-solar-v2-site-paired-parity-bootstrap.yml'
  workflow_dispatch:

jobs:
  site-paired-original-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Synthetic paired bootstrap and original negative-decision guard
        run: python -m pytest -q tests/test_ri_solar_v2_site_paired_parity_bootstrap_v0.py
      - name: Reproduce original site-based means and bootstrap before post-outcome contrast
        run: python scripts/run_ri_solar_v2_site_paired_parity_bootstrap_v0.py
      - name: Preserve first result or explicit unavailable receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ri-solar-v2-site-paired-parity-bootstrap-first
          path: RI_SOLAR_V2_SITE_PAIRED_PARITY_BOOTSTRAP_FIRST_RECEIPT.json
          if-no-files-found: warn
