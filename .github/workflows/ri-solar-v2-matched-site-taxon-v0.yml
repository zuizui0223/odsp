name: ri-solar-v2-matched-site-taxon-postoutcome-v0

on:
  push:
    branches:
      - ecology/ri-solar-v2-matched-site-taxon-v0
    paths:
      - 'RI_SOLAR_V2_MATCHED_SITE_TAXON_V0_CONTRACT.json'
      - 'odsp/ri_solar_v2_matched_site_taxon_v0.py'
      - 'tests/test_ri_solar_v2_matched_site_taxon_v0.py'
      - 'scripts/run_ri_solar_v2_matched_site_taxon_v0.py'
      - '.github/workflows/ri-solar-v2-matched-site-taxon-v0.yml'
  workflow_dispatch:

jobs:
  original-result-matched-pair-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Known-truth matched physical-site and year aggregation
        run: python -m pytest -q tests/test_ri_solar_v2_matched_site_taxon_v0.py
      - name: Recompute exact original v2 site means before paired descriptive analysis
        run: python scripts/run_ri_solar_v2_matched_site_taxon_v0.py
      - name: Archive first matched-site/taxon descriptive receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ri-solar-v2-first-matched-site-taxon-v0
          path: RI_SOLAR_V2_MATCHED_SITE_TAXON_FIRST_RECEIPT.json
          if-no-files-found: warn
