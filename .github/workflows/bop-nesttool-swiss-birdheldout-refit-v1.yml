name: bop-nesttool-swiss-birdheldout-refit-v1
on:
  pull_request:
    paths:
      - 'research/BOP_NESTTOOL_SWISS_BIRD_HELDOUT_REFIT_V1_CONTRACT.json'
      - 'BOP_NESTTOOL_SWISS_BIRD_HELDOUT_REFIT_V1_FIRST_RECEIPT.json'
      - 'scripts/bop_nesttool_swiss_prepared_schema_v1.R'
      - 'scripts/bop_nesttool_swiss_export_refit_v1.R'
      - 'scripts/bop_nesttool_swiss_birdheldout_refit_v1.py'
      - 'scripts/verify_bop_nesttool_swiss_birdheldout_refit_first_v1.py'
      - 'tests/test_bop_nesttool_swiss_birdheldout_refit_v1.py'
      - 'tests/test_bop_nesttool_swiss_birdheldout_first_receipt_v1.py'
      - 'docs/bop_nesttool_swiss_birdheldout_refit_v1.md'
      - 'manuscript/BOP_INDEPENDENT_ANIMAL_GAIN_METHODS_DRAFT_v1.md'
      - 'README.md'
      - '.github/workflows/bop-nesttool-swiss-birdheldout-refit-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
# Original prepared RDS source schema and HR/nest model first result were
# collected exactly once in run 44462371738. All future CI is OFFLINE ONLY.
# No subsequent workflow step may redownload a public RDS or access labels.
jobs:
  source-and-first-result-offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10','3.12','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install synthetic RF test dependencies only
        run: python -m pip install 'pytest>=8,<10' 'numpy>=1.24,<3' 'pandas>=2,<3' 'scikit-learn>=1.4,<2'
      - name: Synthetic known-truth bird-group split, train-only imputation and first-result tamper tests
        run: python -m pytest tests/test_bop_nesttool_swiss_birdheldout_refit_v1.py tests/test_bop_nesttool_swiss_birdheldout_first_receipt_v1.py
      - name: Recompute all 32 original aggregate panel metrics and verify immutable ZIP/JSON SHA256
        run: python scripts/verify_bop_nesttool_swiss_birdheldout_refit_first_v1.py
