name: bop-identity-checked-transport-integration-v1

on:
  pull_request:
    paths:
      - "odsp/identity_checked_transport.py"
      - "odsp/__init__.py"
      - "tests/test_identity_checked_transport.py"
      - "docs/bop_identity_checked_transport_integration_v1.md"
      - ".github/workflows/bop-identity-checked-transport-v1.yml"
      - "README.md"
  push:
    branches: [main]
    paths:
      - "odsp/identity_checked_transport.py"
      - "tests/test_identity_checked_transport.py"
      - ".github/workflows/bop-identity-checked-transport-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-independent-animal-method-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ODSP with scientific test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run source→model→forecasts→animal identity→calibration→test integration and original spine regressions
        run: python -m pytest tests/test_identity_checked_transport.py tests/test_group_identity_gate.py tests/test_common_input_transport.py tests/test_bop_method_spine_v1.py
