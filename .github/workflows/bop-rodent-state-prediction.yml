name: bop-rodent-state-prediction

on:
  pull_request:
    paths:
      - 'BOP_RODENT_STATE_PREDICTION_CONTRACT.json'
      - 'BOP_RODENT_STATE_PREDICTION_TERMINAL_RECEIPT.json'
      - 'odsp/bop_rodent_prediction.py'
      - 'odsp/covariate_state_prediction.py'
      - 'odsp/state_prediction.py'
      - 'scripts/run_bop_rodent_state_prediction.py'
      - 'tests/test_bop_rodent_state_prediction*.py'
      - '.github/workflows/bop-rodent-state-prediction.yml'
      - 'pyproject.toml'
  push:
    branches: [main]
    paths:
      - 'BOP_RODENT_STATE_PREDICTION_CONTRACT.json'
      - 'BOP_RODENT_STATE_PREDICTION_TERMINAL_RECEIPT.json'
      - 'odsp/bop_rodent_prediction.py'
      - 'odsp/covariate_state_prediction.py'
      - 'odsp/state_prediction.py'
      - 'scripts/run_bop_rodent_state_prediction.py'
      - 'tests/test_bop_rodent_state_prediction*.py'
      - '.github/workflows/bop-rodent-state-prediction.yml'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ODSP prediction dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,predict]'

      - name: Verify frozen contract and implementation before outcome access
        run: |
          python -m pytest -q \
            tests/test_bop_rodent_state_prediction_contract.py \
            tests/test_bop_rodent_state_prediction.py

      - name: Execute frozen BOP_RODENT public-data endpoint
        run: |
          python scripts/run_bop_rodent_state_prediction.py \
            --output artifacts/BOP_RODENT_STATE_PREDICTION_RESULT.json

      - name: Validate result against canonical terminal receipt and no retuning
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np

          result = json.loads(Path('artifacts/BOP_RODENT_STATE_PREDICTION_RESULT.json').read_text())
          receipt = json.loads(Path('BOP_RODENT_STATE_PREDICTION_TERMINAL_RECEIPT.json').read_text())

          assert result['schema_version'] == 1
          assert result['contract_id'] == receipt['contract_id'] == 'bop-rodent-state-prediction-v1'
          assert result['retuning_performed'] is False
          assert receipt['prospective_provenance']['retuning_performed'] is False
          assert result['closed_endpoints_untouched'] == receipt['closed_endpoints_untouched']

          decision = result['decision']
          primary = receipt['primary_random_forest']
          assert decision['terminal_category'] == primary['terminal_category'] == 'empirical_state_prediction_mixed'
          assert decision['eligible_individual_count'] == primary['eligible_individual_count'] == 30
          assert decision['positive_individual_count'] == primary['positive_individual_count'] == 27
          assert decision['nonpositive_individual_count'] == primary['nonpositive_individual_count'] == 3
          np.testing.assert_allclose(
              decision['individual_primary_gains'],
              primary['individual_gains'],
              rtol=0.0,
              atol=1e-12,
          )
          assert np.isclose(decision['mean_primary_gain_descriptive'], primary['mean_gain_descriptive'], atol=1e-12)

          observed_brier = [row['primary_score']['brier_improvement'] for row in result['heldout_results']]
          observed_top1 = [row['primary_score']['top1_accuracy'] for row in result['heldout_results']]
          observed_assigned = [row['primary_score']['mean_assigned_probability'] for row in result['heldout_results']]
          assert sum(value > 0 for value in observed_brier) == primary['positive_brier_improvement_count'] == 30
          assert np.isclose(np.mean(observed_brier), primary['mean_brier_improvement_descriptive'], atol=1e-12)
          assert np.isclose(np.mean(observed_top1), primary['mean_top1_accuracy_descriptive'], atol=1e-12)
          assert np.isclose(np.mean(observed_assigned), primary['mean_assigned_probability_descriptive'], atol=1e-12)

          assert result['data_flow'] == receipt['data_flow']
          for source_row, receipt_row in zip(result['source']['files'], receipt['source']['file_md5s']):
              assert source_row['name'] == receipt_row['name']
              assert source_row['expected_md5'] == receipt_row['expected_md5']
              assert source_row['observed_md5'] == receipt_row['observed_md5']

          print(json.dumps({
              'terminal_category': decision['terminal_category'],
              'admitted_species_count': decision['admitted_species_count'],
              'eligible_individual_count': decision['eligible_individual_count'],
              'positive_individual_count': decision['positive_individual_count'],
              'mean_primary_gain_descriptive': decision['mean_primary_gain_descriptive'],
          }, sort_keys=True))
          PY
          python -m pytest -q tests/test_bop_rodent_state_prediction_terminal_receipt.py

      - uses: actions/upload-artifact@v4
        with:
          name: bop-rodent-state-prediction-result
          path: artifacts/BOP_RODENT_STATE_PREDICTION_RESULT.json
          if-no-files-found: error
          retention-days: 90
