name: n2-mee-state-prediction-v4

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package, tests and figure dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,predict]'
          python -m pip install matplotlib

      - name: Validate state-prediction evidence, manuscript, anonymous bundle and submission admin
        run: |
          python -m pytest -q \
            tests/test_state_prediction_evidence_matrix.py \
            tests/test_n2_mee_manuscript_v4.py \
            tests/test_n2_mee_manuscript_v4_citation.py \
            tests/test_n2_mee_state_prediction_figures_v4.py \
            tests/test_n2_mee_review_package_v4.py \
            tests/test_n2_mee_v4_submission_admin.py

      - name: Build submission-facing manuscript v4
        run: |
          mkdir -p build/state_prediction_v4/manuscript
          python -m scripts.build_n2_mee_manuscript_v4 \
            --output build/state_prediction_v4/manuscript/N2_MEE_MANUSCRIPT_DRAFT_v4.md \
            --manifest build/state_prediction_v4/manuscript/N2_MEE_MANUSCRIPT_DRAFT_v4.manifest.json

      - name: Build state-prediction figures
        run: |
          python -m scripts.build_n2_mee_state_prediction_figures_v4 \
            --outdir build/state_prediction_v4/figures

      - name: Build anonymous review bundle v4
        run: |
          mkdir -p build/state_prediction_v4/review
          python -m scripts.build_n2_mee_review_bundle_v4 \
            --output build/state_prediction_v4/review/N2_MEE_ANONYMOUS_REVIEW_BUNDLE_v4.zip

      - name: Test anonymous review bundle internally
        run: |
          rm -rf build/v4_bundle_check
          mkdir -p build/v4_bundle_check
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('build/state_prediction_v4/review/N2_MEE_ANONYMOUS_REVIEW_BUNDLE_v4.zip') as z:
              z.extractall('build/v4_bundle_check')
          PY
          cd build/v4_bundle_check
          python -m pip install -e '.[dev,predict]'
          python -m pytest -q

      - name: Stage non-anonymous submission administration drafts
        run: |
          mkdir -p build/state_prediction_v4/admin
          cp manuscript/N2_MEE_TITLE_PAGE_TEMPLATE_v4.md build/state_prediction_v4/admin/
          cp manuscript/N2_MEE_COVER_LETTER_DRAFT_v4.md build/state_prediction_v4/admin/
          cp manuscript/N2_MEE_DISCLOSURE_DRAFTS_v4.md build/state_prediction_v4/admin/
          cp N2_MEE_STATE_PREDICTION_V4_SUBMISSION_CHECKLIST.json build/state_prediction_v4/admin/

      - name: Stage manuscript package
        run: |
          cp manuscript/N2_MEE_TABLE1_DRAFT_v4.md build/state_prediction_v4/manuscript/
          cp manuscript/N2_MEE_FIGURE_CAPTIONS_DRAFT_v4.md build/state_prediction_v4/manuscript/
          cp N2_STATE_PREDICTION_EVIDENCE_MATRIX.json build/state_prediction_v4/
          cp docs/n2_state_prediction_synthesis_2026-09-05.md build/state_prediction_v4/
          python - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('build/state_prediction_v4')
          manuscript_manifest = json.loads(
              (root / 'manuscript/N2_MEE_MANUSCRIPT_DRAFT_v4.manifest.json').read_text()
          )
          files = []
          for path in sorted(p for p in root.rglob('*') if p.is_file()):
              files.append({
                  'path': path.relative_to(root).as_posix(),
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  'bytes': path.stat().st_size,
              })
          manifest = {
              'schema_version': 2,
              'role': 'n2_mee_state_prediction_v4_submission_package',
              'manuscript_word_count': manuscript_manifest['word_count'],
              'abstract_word_count': manuscript_manifest['abstract_word_count'],
              'abstract_within_350_words': manuscript_manifest['abstract_within_350_words'],
              'contains_separate_anonymous_review_bundle': True,
              'contains_non_anonymous_submission_admin': True,
              'files': files,
              'empirical_endpoint_rerun': False,
          }
          (root / 'PACKAGE_MANIFEST.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          print(json.dumps(manifest, sort_keys=True))
          assert manuscript_manifest['abstract_within_350_words'] is True
          assert manuscript_manifest['retuning_performed'] is False
          admin_paths = {item['path'] for item in files if item['path'].startswith('admin/')}
          assert admin_paths == {
              'admin/N2_MEE_TITLE_PAGE_TEMPLATE_v4.md',
              'admin/N2_MEE_COVER_LETTER_DRAFT_v4.md',
              'admin/N2_MEE_DISCLOSURE_DRAFTS_v4.md',
              'admin/N2_MEE_STATE_PREDICTION_V4_SUBMISSION_CHECKLIST.json',
          }
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: n2-mee-state-prediction-v4
          path: build/state_prediction_v4
          if-no-files-found: error
          retention-days: 90
