name: n2-mee-state-prediction-v4

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package, tests and figure dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,predict]'
          python -m pip install matplotlib

      - name: Validate state-prediction evidence and manuscript v4
        run: |
          python -m pytest -q \
            tests/test_state_prediction_evidence_matrix.py \
            tests/test_n2_mee_manuscript_v4.py \
            tests/test_n2_mee_state_prediction_figures_v4.py

      - name: Build state-prediction figures
        run: |
          python -m scripts.build_n2_mee_state_prediction_figures_v4 \
            --outdir build/state_prediction_v4/figures

      - name: Stage manuscript package
        run: |
          mkdir -p build/state_prediction_v4/manuscript
          cp manuscript/N2_MEE_MANUSCRIPT_DRAFT_v4.md build/state_prediction_v4/manuscript/
          cp manuscript/N2_MEE_TABLE1_DRAFT_v4.md build/state_prediction_v4/manuscript/
          cp manuscript/N2_MEE_FIGURE_CAPTIONS_DRAFT_v4.md build/state_prediction_v4/manuscript/
          cp N2_STATE_PREDICTION_EVIDENCE_MATRIX.json build/state_prediction_v4/
          cp docs/n2_state_prediction_synthesis_2026-09-05.md build/state_prediction_v4/
          python - <<'PY'
          import hashlib, json, pathlib, re
          root = pathlib.Path('build/state_prediction_v4')
          manuscript = root / 'manuscript/N2_MEE_MANUSCRIPT_DRAFT_v4.md'
          text = manuscript.read_text(encoding='utf-8')
          abstract = text.split('## Abstract', 1)[1].split('**Keywords:**', 1)[0]
          word_count = len(re.findall(r"\b[\w'-]+\b", text))
          abstract_words = len(re.findall(r"\b[\w'-]+\b", abstract))
          files = []
          for path in sorted(p for p in root.rglob('*') if p.is_file()):
              files.append({
                  'path': path.relative_to(root).as_posix(),
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  'bytes': path.stat().st_size,
              })
          manifest = {
              'schema_version': 1,
              'role': 'n2_mee_state_prediction_v4_review_package',
              'manuscript_word_count': word_count,
              'abstract_word_count': abstract_words,
              'abstract_within_350_words': abstract_words <= 350,
              'files': files,
              'empirical_endpoint_rerun': False,
          }
          (root / 'PACKAGE_MANIFEST.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          print(json.dumps(manifest, sort_keys=True))
          assert abstract_words <= 350
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: n2-mee-state-prediction-v4
          path: build/state_prediction_v4
          if-no-files-found: error
          retention-days: 90
