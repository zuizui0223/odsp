name: uljin-official-source-landing-probe-v0

on:
  push:
    branches:
      - ecology/uljin-matched-daylength-temporal-refuge-v0
    paths:
      - '.github/workflows/uljin-official-source-landing-probe-v0.yml'
      - 'scripts/probe_uljin_ecobank_landing_v0.py'
      - 'tests/test_probe_uljin_ecobank_landing_v0.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-public-metadata-only:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check host and metadata-only fail-closed semantics
        run: python -m pytest -q tests/test_probe_uljin_ecobank_landing_v0.py
      - name: Probe actual original-provider URL without downloading private rows or outputting tokens
        run: python scripts/probe_uljin_ecobank_landing_v0.py
