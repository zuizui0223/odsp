name: ODSP Gomes v1 bat vertical source-only intake
on:
  push:
    branches:
      - prospective/vertical-species-identifiability-20261122
    paths:
      - 'scripts/gomes_zenodo_vertical_source_preflight_v1.py'
      - 'tests/test_gomes_zenodo_vertical_source_preflight_v1.py'
      - '.github/workflows/gomes-zenodo-source-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original_source_schema:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest -v tests.test_gomes_zenodo_vertical_source_preflight_v1
      - name: Public Zenodo original header/MD5 only
        run: python -m scripts.gomes_zenodo_vertical_source_preflight_v1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gomes-zenodo-source-only-v1
          path: results/gomes_zenodo_vertical_source_preflight_v1.json
          if-no-files-found: error
          retention-days: 30
