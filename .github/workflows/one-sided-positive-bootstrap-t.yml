name: one-sided-positive-bootstrap-t

on:
  pull_request:
    paths:
      - 'odsp/bootstrap_t.py'
      - 'odsp/multicontrast_bootstrap_t.py'
      - 'odsp/positive_transfer_bootstrap_t.py'
      - 'odsp/information_transfer_positive_v2.py'
      - 'odsp/positive_transfer_bootstrap_t_calibration.py'
      - 'tests/test_positive_transfer_bootstrap_t.py'
      - 'tests/test_positive_transfer_bootstrap_t_calibration.py'
      - 'tests/test_one_sided_positive_bootstrap_t_receipt.py'
      - 'ODSP_ONE_SIDED_POSITIVE_BOOTSTRAP_T_CONTRACT.json'
      - 'ONE_SIDED_POSITIVE_BOOTSTRAP_T_NULL_CALIBRATION_RECEIPT.json'
      - '.github/workflows/one-sided-positive-bootstrap-t.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core package without prediction extra
        run: python -m pip install -e '.[dev]'
      - name: Run one-sided bootstrap-t unit, calibration and receipt tests
        run: >-
          python -m pytest -q
          tests/test_positive_transfer_bootstrap_t.py
          tests/test_positive_transfer_bootstrap_t_calibration.py
          tests/test_one_sided_positive_bootstrap_t_receipt.py
      - name: Re-run 1000-simulation one-sided null panel and match frozen receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from odsp.positive_transfer_bootstrap_t_calibration import (
              GENERATOR_VERSION,
              run_positive_transfer_null_calibration,
          )

          expected = json.loads(
              Path('ONE_SIDED_POSITIVE_BOOTSTRAP_T_NULL_CALIBRATION_RECEIPT.json').read_text()
          )
          result = run_positive_transfer_null_calibration()
          observed = result.as_dict()
          print('ONE_SIDED_POSITIVE_BOOTSTRAP_T_NULL_CALIBRATION=' + json.dumps(observed, sort_keys=True))
          assert observed['generator_version'] == GENERATOR_VERSION
          assert result.qualification_pass, observed

          run = expected['first_1000_simulation_run']
          assert observed['seed'] == run['seed']
          assert observed['simulations_per_scenario'] == run['simulations_per_scenario']
          assert observed['bootstrap_draws_per_interval'] == run['bootstrap_draws_per_interval']
          assert observed['group_count'] == run['group_count']
          assert observed['contrast_correlation'] == run['contrast_correlation']
          assert observed['familywise_lower_confidence_level'] == run['familywise_lower_confidence_level']
          assert observed['generator_version'] == run['generator_version']

          frozen = {row['scenario_id']: row for row in expected['scenarios']}
          actual = {row['scenario_id']: row for row in observed['scenarios']}
          assert set(actual) == set(frozen)
          fields = (
              'one_sided_familywise_false_positive_rate',
              'terminal_false_generalizing_rate',
              'monte_carlo_standard_error',
              'maximum_accepted_rate',
          )
          for scenario_id in sorted(frozen):
              assert actual[scenario_id]['simulations'] == run['simulations_per_scenario']
              assert actual[scenario_id]['blocks_per_group'] == frozen[scenario_id]['blocks_per_group']
              assert actual[scenario_id]['contrast_count'] == frozen[scenario_id]['contrast_count']
              assert actual[scenario_id]['distribution'] == frozen[scenario_id]['distribution']
              assert actual[scenario_id]['acceptance_pass'] is True
              for field in fields:
                  assert abs(float(actual[scenario_id][field]) - float(frozen[scenario_id][field])) <= 1e-15, (
                      scenario_id, field, actual[scenario_id][field], frozen[scenario_id][field]
                  )
          print('ONE_SIDED_POSITIVE_BOOTSTRAP_T_NULL_CALIBRATION_MATCHES_FROZEN_RECEIPT=true')
          PY
