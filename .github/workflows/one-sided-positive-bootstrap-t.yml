name: one-sided-positive-bootstrap-t

on:
  pull_request:
    paths:
      - 'odsp/bootstrap_t.py'
      - 'odsp/multicontrast_bootstrap_t.py'
      - 'odsp/positive_transfer_bootstrap_t.py'
      - 'odsp/information_transfer_positive_v2.py'
      - 'odsp/positive_transfer_bootstrap_t_calibration.py'
      - 'tests/test_positive_transfer_bootstrap_t.py'
      - 'tests/test_positive_transfer_bootstrap_t_calibration.py'
      - 'ODSP_ONE_SIDED_POSITIVE_BOOTSTRAP_T_CONTRACT.json'
      - 'ONE_SIDED_POSITIVE_BOOTSTRAP_T_NULL_CALIBRATION_RECEIPT.json'
      - '.github/workflows/one-sided-positive-bootstrap-t.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core package without prediction extra
        run: python -m pip install -e '.[dev]'
      - name: Run one-sided bootstrap-t unit and calibration tests
        run: >-
          python -m pytest -q
          tests/test_positive_transfer_bootstrap_t.py
          tests/test_positive_transfer_bootstrap_t_calibration.py
      - name: Run first predeclared 1000-simulation one-sided null panel
        run: |
          python - <<'PY'
          import json
          from odsp.positive_transfer_bootstrap_t_calibration import (
              GENERATOR_VERSION,
              run_positive_transfer_null_calibration,
          )

          result = run_positive_transfer_null_calibration()
          payload = result.as_dict()
          print('ONE_SIDED_POSITIVE_BOOTSTRAP_T_NULL_CALIBRATION=' + json.dumps(payload, sort_keys=True))
          assert payload['generator_version'] == GENERATOR_VERSION
          assert result.qualification_pass, payload
          assert all(row['acceptance_pass'] is True for row in payload['scenarios'])
          print('ONE_SIDED_POSITIVE_BOOTSTRAP_T_NULL_CALIBRATION_QUALIFIED=true')
          PY
