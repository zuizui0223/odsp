name: bop-red-kite-ger-movebank-study-meta-v1
on:
  pull_request:
    paths:
      - 'research/BOP_RED_KITE_GER_MOVEBANK_STUDY_METADATA_V1_CONTRACT.json'
      - 'BOP_RED_KITE_GER_MOVEBANK_STUDY_META_V1_FIRST_RECEIPT.json'
      - 'scripts/bop_red_kite_ger_movebank_public_study_meta_v1.py'
      - 'scripts/verify_bop_red_kite_ger_movebank_meta_first_v1.py'
      - 'tests/test_bop_red_kite_ger_movebank_public_study_meta_v1.py'
      - 'tests/test_bop_red_kite_ger_movebank_meta_first_v1.py'
      - 'docs/bop_red_kite_ger_movebank_public_study_meta_v1.md'
      - '.github/workflows/bop-red-kite-ger-movebank-study-meta-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
# The ONE official source request was run 44299216766 and returned HTTPError.
# It is captured in an immutable receipt; later CI MUST NEVER repeat the URL.
jobs:
  offline-initial-access-and-claim-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10','3.12','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - name: Validate original public-only parser and immutable HTTPError first result
        run: python -m pytest tests/test_bop_red_kite_ger_movebank_public_study_meta_v1.py tests/test_bop_red_kite_ger_movebank_meta_first_v1.py
      - name: Confirm original first provider result and citation ceiling without any HTTP request
        run: python scripts/verify_bop_red_kite_ger_movebank_meta_first_v1.py
