name: bop-red-kite-ger-movebank-study-meta-v1
on:
  pull_request:
    paths:
      - 'research/BOP_RED_KITE_GER_MOVEBANK_STUDY_METADATA_V1_CONTRACT.json'
      - 'scripts/bop_red_kite_ger_movebank_public_study_meta_v1.py'
      - 'tests/test_bop_red_kite_ger_movebank_public_study_meta_v1.py'
      - 'docs/bop_red_kite_ger_movebank_public_study_meta_v1.md'
      - '.github/workflows/bop-red-kite-ger-movebank-study-meta-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata-safety-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10','3.12','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest tests/test_bop_red_kite_ger_movebank_public_study_meta_v1.py
  anonymous-provider-study-summary-first:
    needs: metadata-safety-tests
    if: ${{ needs.metadata-safety-tests.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Get ONLY current public Movebank German red kite STUDY metadata
        run: python scripts/bop_red_kite_ger_movebank_public_study_meta_v1.py --out "$RUNNER_TEMP/bop-redkite-movebank-study-meta-first.json"
      - name: Preserve anonymous study summary or permission HOLD, no animal or GPS records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bop-red-kite-ger-movebank-study-meta-first
          path: ${{ runner.temp }}/bop-redkite-movebank-study-meta-first.json
          retention-days: 90
          if-no-files-found: warn
