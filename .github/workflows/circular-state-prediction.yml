name: circular-state-prediction

on:
  pull_request:
    paths:
      - 'CIRCULAR_STATE_PREDICTION_CONTRACT.json'
      - 'CIRCULAR_STATE_PREDICTION_VALIDATION_RECEIPT.json'
      - 'odsp/circular_state.py'
      - 'odsp/circular_state_benchmark.py'
      - 'scripts/run_circular_state_benchmark.py'
      - 'tests/test_circular_state.py'
      - 'tests/test_circular_state_benchmark.py'
      - 'tests/test_circular_state_contract.py'
      - 'tests/test_circular_state_receipt.py'
      - 'docs/circular_state_prediction_v1.md'
      - '.github/workflows/circular-state-prediction.yml'
  push:
    branches: [main]
    paths:
      - 'CIRCULAR_STATE_PREDICTION_CONTRACT.json'
      - 'CIRCULAR_STATE_PREDICTION_VALIDATION_RECEIPT.json'
      - 'odsp/circular_state.py'
      - 'odsp/circular_state_benchmark.py'
      - 'scripts/run_circular_state_benchmark.py'
      - 'tests/test_circular_state.py'
      - 'tests/test_circular_state_benchmark.py'
      - 'tests/test_circular_state_contract.py'
      - 'tests/test_circular_state_receipt.py'
      - 'docs/circular_state_prediction_v1.md'
      - '.github/workflows/circular-state-prediction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ODSP test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Test circular state prediction and contract
        run: |
          python -m pytest -q \
            tests/test_circular_state.py \
            tests/test_circular_state_benchmark.py \
            tests/test_circular_state_contract.py
          if [ -f tests/test_circular_state_receipt.py ]; then
            python -m pytest -q tests/test_circular_state_receipt.py
          fi

      - name: Run frozen known-truth circular benchmark
        run: |
          python scripts/run_circular_state_benchmark.py \
            --output artifacts/CIRCULAR_STATE_BENCHMARK.json \
            --seed 20260905 \
            --replicates 128 \
            --training-rows 800 \
            --heldout-rows 1600 \
            --period 24
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('artifacts/CIRCULAR_STATE_BENCHMARK.json').read_text())
          assert r['passed'] is True
          assert r['stable_all_positive'] is True
          assert r['shifted_all_negative'] is True
          assert r['null_mean_gain_near_zero'] is True
          assert r['phase_origin_gain_invariance_error'] <= 1e-10
          assert r['period_unit_gain_invariance_error'] <= 1e-10
          assert 0.87 <= r['interval_empirical_coverage'] <= 0.93
          print(json.dumps(r, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: circular-state-benchmark
          path: artifacts/CIRCULAR_STATE_BENCHMARK.json
          if-no-files-found: error
          retention-days: 90
