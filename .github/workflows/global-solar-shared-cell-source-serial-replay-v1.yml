name: Strict serial recheck of five original shared-cell source holds v1
on:
  push:
    branches:
      - ecology/global-solar-azimuth-macroniche-v0
    paths:
      - 'research/GLOBAL_SOLAR_AZIMUTH_SHARED_CELL_SOURCE_REPLAY_V1_CONTRACT.json'
      - 'scripts/global_solar_azimuth_shared_cell_source_replay_v1.py'
      - 'tests/test_global_solar_azimuth_shared_cell_source_replay_v1.py'
      - '.github/workflows/global-solar-shared-cell-source-serial-replay-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  five_original_held_sources_serial:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify one-shot fixed source-only serial replay contract
        run: |
          python -m unittest discover -s tests -p 'test_global_solar_azimuth_shared_cell_source_replay_v1.py' -v
          python -m unittest discover -s tests -p 'test_global_solar_azimuth_multitaxon_shared_cells_v0.py' -v
      - name: Run frozen ecological source comparison serially with exact original MD5
        run: |
          python -m scripts.global_solar_azimuth_shared_cell_source_replay_v1 \
            --out outputs/global_solar_shared_cell_serial_replay
      - name: Publish ONLY aggregated source and species-level results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-solar-five-original-source-hold-strict-serial-v1
          path: outputs/global_solar_shared_cell_serial_replay/solar_azimuth_shared_cell_serial_recovery_v1.json
          if-no-files-found: warn
