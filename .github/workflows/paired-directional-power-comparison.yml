name: paired-directional-power-comparison

on:
  pull_request:
    paths:
      - 'odsp/shared_block_certification_v2.py'
      - 'odsp/shared_block_positive_certification.py'
      - 'odsp/paired_directional_power_comparison.py'
      - 'tests/test_paired_directional_power_comparison.py'
      - 'tests/test_paired_directional_power_comparison_receipt.py'
      - 'ODSP_PAIRED_DIRECTIONAL_POWER_COMPARISON_CONTRACT.json'
      - 'PAIRED_DIRECTIONAL_POWER_COMPARISON_RECEIPT.json'
      - '.github/workflows/paired-directional-power-comparison.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core package without prediction extra
        run: python -m pip install -e '.[dev]'
      - name: Run paired directional comparison and receipt tests
        run: >-
          python -m pytest -q
          tests/test_paired_directional_power_comparison.py
          tests/test_paired_directional_power_comparison_receipt.py
      - name: Re-run 1000-simulation paired comparison and match frozen receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from odsp.paired_directional_power_comparison import (
              COMPARISON_VERSION,
              run_paired_directional_power_comparison,
          )

          contract = json.loads(
              Path('ODSP_PAIRED_DIRECTIONAL_POWER_COMPARISON_CONTRACT.json').read_text()
          )
          expected = json.loads(
              Path('PAIRED_DIRECTIONAL_POWER_COMPARISON_RECEIPT.json').read_text()
          )
          result = run_paired_directional_power_comparison()
          observed = result.as_dict()
          print('PAIRED_DIRECTIONAL_POWER_COMPARISON=' + json.dumps(observed, sort_keys=True))
          assert observed['comparison_version'] == COMPARISON_VERSION
          assert result.qualification_pass, observed

          run = expected['first_1000_simulation_run']
          for field in (
              'seed', 'simulations_per_scenario', 'bootstrap_draws_per_interval',
              'group_count', 'group_correlation', 'step_correlation',
              'noise_standard_deviation', 'familywise_confidence_level',
              'same_world_per_method', 'same_shared_block_bootstrap_seed_per_method'
          ):
              assert observed[field] == run[field]

          frozen = {row['scenario_id']: row for row in expected['scenarios']}
          actual = {row['scenario_id']: row for row in observed['scenarios']}
          assert set(actual) == set(frozen)
          numeric_fields = (
              'two_sided_exact_ceiling_recovery_rate',
              'one_sided_exact_ceiling_recovery_rate',
              'exact_recovery_rate_difference',
              'two_sided_overreach_rate', 'one_sided_overreach_rate',
              'two_sided_underreach_rate', 'one_sided_underreach_rate',
              'two_sided_full_ceiling_rate', 'one_sided_full_ceiling_rate',
          )
          integer_fields = (
              'paired_dataset_ceiling_advance_count',
              'paired_dataset_ceiling_regression_count',
          )
          limit = contract['qualification_rules']['coarse_truth_one_sided_overreach_maximum']
          for scenario_id in sorted(frozen):
              row = actual[scenario_id]
              ref = frozen[scenario_id]
              assert row['distribution'] == ref['distribution']
              assert row['blocks_per_group'] == ref['blocks_per_group']
              assert row['truth_ceiling'] == ref['truth_ceiling']
              for field in numeric_fields:
                  assert abs(float(row[field]) - float(ref[field])) <= 1e-15, (
                      scenario_id, field, row[field], ref[field]
                  )
              for field in integer_fields:
                  assert row[field] == ref[field]
              assert row['candidate_acceptance_pass'] is True
              if row['truth_ceiling'] == 'coarse':
                  assert row['one_sided_overreach_rate'] <= limit
          print('PAIRED_DIRECTIONAL_POWER_COMPARISON_MATCHES_FROZEN_RECEIPT=true')
          PY
