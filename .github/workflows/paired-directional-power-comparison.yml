name: paired-directional-power-comparison

on:
  pull_request:
    paths:
      - 'odsp/shared_block_certification_v2.py'
      - 'odsp/shared_block_positive_certification.py'
      - 'odsp/paired_directional_power_comparison.py'
      - 'tests/test_paired_directional_power_comparison.py'
      - 'ODSP_PAIRED_DIRECTIONAL_POWER_COMPARISON_CONTRACT.json'
      - 'PAIRED_DIRECTIONAL_POWER_COMPARISON_RECEIPT.json'
      - '.github/workflows/paired-directional-power-comparison.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core package without prediction extra
        run: python -m pip install -e '.[dev]'
      - name: Run paired directional comparison contract tests
        run: python -m pytest -q tests/test_paired_directional_power_comparison.py
      - name: Run first predeclared 1000-simulation paired power comparison
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from odsp.paired_directional_power_comparison import (
              COMPARISON_VERSION,
              run_paired_directional_power_comparison,
          )

          contract = json.loads(
              Path('ODSP_PAIRED_DIRECTIONAL_POWER_COMPARISON_CONTRACT.json').read_text()
          )
          result = run_paired_directional_power_comparison()
          payload = result.as_dict()
          print('PAIRED_DIRECTIONAL_POWER_COMPARISON=' + json.dumps(payload, sort_keys=True))
          assert payload['comparison_version'] == COMPARISON_VERSION
          assert payload['same_world_per_method'] is True
          assert payload['same_shared_block_bootstrap_seed_per_method'] is True
          assert result.qualification_pass, payload
          limit = contract['qualification_rules']['coarse_truth_one_sided_overreach_maximum']
          for row in payload['scenarios']:
              assert row['paired_dataset_ceiling_regression_count'] == 0
              assert row['candidate_acceptance_pass'] is True
              if row['truth_ceiling'] == 'coarse':
                  assert row['one_sided_overreach_rate'] <= limit
          print('PAIRED_DIRECTIONAL_POWER_COMPARISON_QUALIFIED=true')
          PY
