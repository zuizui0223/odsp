name: confirmatory-method-routing

on:
  push:
    branches:
      - 'method/confirmatory-method-routing'
  pull_request:
    paths:
      - 'odsp/confirmatory_method_routing.py'
      - 'odsp/confirmatory_route_evidence.py'
      - 'odsp/cli.py'
      - 'ODSP_CONFIRMATORY_METHOD_ROUTING_CONTRACT.json'
      - 'ODSP_CONFIRMATORY_ROUTE_EVIDENCE_REGISTRY_V2.json'
      - 'ODSP_CONFIRMATORY_ROUTE_EVIDENCE_REGISTRY_V3.json'
      - 'ODSP_CONFIRMATORY_ROUTE_EVIDENCE_REGISTRY_V4.json'
      - 'ODSP_CONFIRMATORY_ROUTE_EVIDENCE_REGISTRY_V5.json'
      - 'ODSP_CONFIRMATORY_ROUTE_EVIDENCE_REGISTRY_V6.json'
      - 'ODSP_CONFIRMATORY_ROUTE_EVIDENCE_REGISTRY_V7.json'
      - 'ODSP_CONFIRMATORY_EVIDENCE_CONTENT_LOCK_V1.json'
      - 'ODSP_CONFIRMATORY_EVIDENCE_CONTENT_LOCK_V2.json'
      - 'ODSP_CONFIRMATORY_EVIDENCE_CONTENT_LOCK_V3.json'
      - 'ODSP_CONFIRMATORY_EVIDENCE_CONTENT_LOCK_V4.json'
      - 'ODSP_CONFIRMATORY_EVIDENCE_CONTENT_LOCK_V5.json'
      - 'TRAINING_PROCESS_V5_EXTERNAL_EVIDENCE_HASH_RECEIPT.json'
      - 'ODSP_TRAINING_PROCESS_V5_EXTERNAL_REGISTRATION_CORRECTION_CONTRACT.json'
      - 'TRAINING_PROCESS_V5_EXTERNAL_EVIDENCE_CHRONOLOGY_CLARIFICATION.json'
      - 'ODSP_TRAINING_PROCESS_V5_EXTERNAL_ROUTE_PROMOTION_CONTRACT.json'
      - 'TRAINING_PROCESS_V5_EXTERNAL_FOCUSED_ENDPOINT_RECEIPT_V2.json'
      - 'TRAINING_PROCESS_V5_EXTERNAL_ENDPOINT_IDENTITY_RECEIPT_V2.json'
      - 'tests/test_confirmatory_method_routing.py'
      - 'tests/test_confirmatory_method_routing_contract.py'
      - 'tests/test_confirmatory_route_evidence_v2.py'
      - 'tests/test_training_source_process_v0_confirmatory_routing.py'
      - 'ODSP_TRAINING_SOURCE_PROCESS_V0_ROUTE_REGISTRATION_CONTRACT.json'
      - 'TRAINING_SOURCE_PROCESS_V0_EVIDENCE_HASH_RECEIPT.json'
      - 'tests/test_training_process_v5_external_registration_correction.py'
      - 'tests/test_training_process_v5_external_evidence_chronology.py'
      - 'tests/test_training_process_v5_external_route_promotion.py'
      - '.github/workflows/confirmatory-method-routing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core package with test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run routing tests
        run: >-
          python -m pytest -q
          tests/test_confirmatory_method_routing.py
          tests/test_confirmatory_method_routing_contract.py
          tests/test_confirmatory_route_evidence_v2.py
          tests/test_training_source_process_v0_confirmatory_routing.py
          tests/test_training_source_process_v0_route_registration.py
          tests/test_training_source_process_v0_evidence_hash_receipt.py
          tests/test_confirmatory_evidence_content_lock_v1.py
          tests/test_training_process_v5_external_final_receipts.py
          tests/test_training_process_v5_external_registration_correction.py
          tests/test_training_process_v5_external_evidence_chronology.py
          tests/test_training_process_v5_external_route_promotion.py
