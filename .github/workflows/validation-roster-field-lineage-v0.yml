name: validation-roster-field-lineage-v0

on:
  push:
    branches:
      - method/validation-roster-lineage-v0
    paths:
      - 'odsp/validation_roster_field_lineage_v0.py'
      - 'tests/test_validation_roster_field_lineage_v0.py'
      - 'tests/test_validation_roster_field_lineage_examples_v0.py'
      - 'examples/validation_roster_lineage/**'
      - 'ODSP_VALIDATION_ROSTER_FIELD_LINEAGE_V0_CONTRACT.json'
      - '.github/workflows/validation-roster-field-lineage-v0.yml'
  workflow_dispatch:

jobs:
  semantic-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test known lineage, recursion and fail-closed schema
        run: |
          python -m pytest -q \
            tests/test_validation_roster_field_lineage_v0.py \
            tests/test_validation_roster_field_lineage_examples_v0.py
      - name: Reproduce independent-declaration and image-correction decisions
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from odsp.validation_roster_field_lineage_v0 import audit_validation_roster_field_lineage_v0
          root=Path("examples/validation_roster_lineage")
          outputs={}
          for file in sorted(root.glob("*.json")):
              out=audit_validation_roster_field_lineage_v0(json.loads(file.read_text()))
              outputs[file.name]=out.as_dict()
          assert outputs["snapshot_usa_photo_corrected_hold.json"]["selection_lineage_status"] == "HOLD_OUTCOME_DERIVED_SOURCE_METADATA"
          assert outputs["hypothetical_predeclared_site_plan.json"]["selection_lineage_status"] == "DECLARED_INDEPENDENT_LINEAGE_ONLY_NOT_ATTESTED"
          assert all(not item["trusted_external_lineage_attestation_verified"] for item in outputs.values())
          Path("validation_roster_lineage_v0_examples_receipt.json").write_text(
              json.dumps({"head_sha":os.environ.get("GITHUB_SHA"),"primary_qualified":False,
                          "examples":outputs},indent=2,sort_keys=True)+"\n"
          )
          print("Source-lineage examples reproduced without outcome data")
          PY
      - name: Preserve example audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-roster-lineage-v0-examples
          path: validation_roster_lineage_v0_examples_receipt.json
          if-no-files-found: warn
