      - 'tests/test_training_source_process_v0_confirmatory_routing.py'
      - 'tests/test_confirmatory_evidence_content_lock_v1.py'
      - 'tests/test_training_process_v5_external_registration_correction.py'
      - 'tests/test_training_process_v5_external_evidence_chronology.py'
      - 'tests/test_training_process_v5_external_route_promotion.py'
      - '.github/workflows/freeze-confirmatory-evidence-content-v7.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core package with test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Verify active qualification evidence content lock
        run: >-
          python -m pytest -q
          tests/test_confirmatory_evidence_content_lock_v1.py
          tests/test_training_process_v5_external_registration_correction.py
          tests/test_training_process_v5_external_evidence_chronology.py
          tests/test_training_process_v5_external_route_promotion.py
