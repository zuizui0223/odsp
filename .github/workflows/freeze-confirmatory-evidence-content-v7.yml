      - 'TRAINING_SOURCE_PROCESS_V0_SUPPORT_ENVELOPE_RECEIPT.json'
      - 'ODSP_TRAINING_SOURCE_PROCESS_V0_STATUS_SEMANTICS_CONTRACT.json'
      - 'ODSP_TRAINING_SOURCE_PROCESS_V0_FREEZE_MANIFEST_CONTRACT.json'
