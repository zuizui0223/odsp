name: training-process-v5-untouched-external-v1

on:
  pull_request:
    paths:
      - 'odsp/training_process_external_freeze_v1.py'
      - 'odsp/untouched_external_training_process_v1.py'
      - 'tests/test_untouched_external_training_process_v1.py'
      - 'ODSP_TRAINING_PROCESS_V5_UNTOUCHED_EXTERNAL_CONTRACT.json'
      - 'docs/training_process_v5_untouched_external_v1.md'
      - '.github/workflows/training-process-v5-untouched-external-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Run process-specific untouched external tests
        run: python -m pytest -q tests/test_untouched_external_training_process_v1.py
