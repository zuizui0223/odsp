name: ODSP Gomes v4 corrected count-weighted detected stratification
on:
  push:
    branches:
      - prospective/vertical-species-identifiability-20261122
    paths:
      - 'odsp/weighted_detected_vertical_transfer.py'
      - 'scripts/gomes_zenodo_number_weighted_v4.py'
      - 'tests/test_gomes_zenodo_number_weighted_v4.py'
      - '.github/workflows/gomes-number-weighted-v4.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  author_corrected_number_v4:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify known-truth weighted count model BEFORE original response
        run: |
          python -m pip install -e '.[dev]'
          python -m unittest -v tests.test_gomes_zenodo_number_weighted_v4
      - name: Verify original Zenodo file and evaluate fixed number-count endpoint
        run: python -m scripts.gomes_zenodo_number_weighted_v4
      - name: Store aggregate results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gomes-zenodo-author-corrected-number-v4
          path: results/gomes_zenodo_number_weighted_v4.json
          if-no-files-found: warn
          retention-days: 45
