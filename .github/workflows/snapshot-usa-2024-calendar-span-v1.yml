name: snapshot-usa-2024-calendar-span-v1

on:
  push:
    branches:
      - research/snapshot-usa-calendar-span-v1
    paths:
      - 'ODSP_SNAPSHOT_USA_2024_CALENDAR_SPAN_V1_CONTRACT.json'
      - 'odsp/snapshot_usa_2024_calendar_span_v1.py'
      - 'scripts/screen_snapshot_usa_2024_calendar_span_v1.py'
      - 'tests/test_snapshot_usa_2024_calendar_span_v1.py'
      - 'odsp/weak_gain_nonparametric_barrier_v1.py'
      - 'tests/test_weak_gain_nonparametric_barrier_v1.py'
      - '.github/workflows/snapshot-usa-2024-calendar-span-v1.yml'
  workflow_dispatch:

jobs:
  structural-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Pre-result unit tests on synthetic physical site rosters
        run: |
          python -m pytest -q \
            tests/test_snapshot_usa_2024_calendar_span_v1.py \
            tests/test_weak_gain_nonparametric_barrier_v1.py
      - name: Frozen original Dryad deployment URL only
        run: |
          python scripts/screen_snapshot_usa_2024_calendar_span_v1.py \
            --frozen-download \
            --receipt snapshot_usa_2024_calendar_span_v1_first_receipt.json
      - name: Preserve first source-screen outcome even on error
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-usa-2024-calendar-span-v1-first-screen
          path: snapshot_usa_2024_calendar_span_v1_first_receipt.json
          if-no-files-found: warn
