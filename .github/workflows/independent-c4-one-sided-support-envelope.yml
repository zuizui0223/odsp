name: independent-c4-one-sided-support-envelope

on:
  push:
    branches:
      - 'method/independent-c4-support-envelope'
  pull_request:
    paths:
      - 'odsp/positive_transfer_c4_support_calibration.py'
      - 'ODSP_INDEPENDENT_C4_ONE_SIDED_SUPPORT_ENVELOPE_CONTRACT.json'
      - 'INDEPENDENT_C4_ONE_SIDED_SUPPORT_ENVELOPE_RECEIPT.json'
      - 'tests/test_positive_transfer_c4_support_calibration.py'
      - '.github/workflows/independent-c4-one-sided-support-envelope.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core package with test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run support-envelope unit tests
        run: python -m pytest -q tests/test_positive_transfer_c4_support_calibration.py
      - name: Run frozen 1000-simulation support envelope
        run: |
          python - <<'PY'
          import json
          from odsp.positive_transfer_c4_support_calibration import run_independent_c4_support_envelope_calibration
          result = run_independent_c4_support_envelope_calibration(
              seed=20260921,
              simulations_per_scenario=1000,
              bootstrap_draws=500,
              group_count=6,
              contrast_correlation=0.5,
              confidence_level=0.95,
          )
          print(json.dumps(result.as_dict(), sort_keys=True))
          if not result.qualification_pass:
              raise SystemExit("support-envelope qualification failed")
          PY
