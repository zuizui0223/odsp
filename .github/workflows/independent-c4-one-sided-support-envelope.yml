name: independent-c4-one-sided-support-envelope

on:
  push:
    branches:
      - 'method/independent-c4-support-envelope'
  pull_request:
    paths:
      - 'odsp/positive_transfer_c4_support_calibration.py'
      - 'ODSP_INDEPENDENT_C4_ONE_SIDED_SUPPORT_ENVELOPE_CONTRACT.json'
      - 'INDEPENDENT_C4_ONE_SIDED_SUPPORT_ENVELOPE_RECEIPT.json'
      - 'tests/test_positive_transfer_c4_support_calibration.py'
      - 'tests/test_positive_transfer_c4_support_calibration_receipt.py'
      - '.github/workflows/independent-c4-one-sided-support-envelope.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core package with test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run support-envelope contract and receipt tests
        run: >-
          python -m pytest -q
          tests/test_positive_transfer_c4_support_calibration.py
          tests/test_positive_transfer_c4_support_calibration_receipt.py
      - name: Re-run frozen 1000-simulation support envelope and match receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from odsp.positive_transfer_c4_support_calibration import run_independent_c4_support_envelope_calibration

          result = run_independent_c4_support_envelope_calibration(
              seed=20260921,
              simulations_per_scenario=1000,
              bootstrap_draws=500,
              group_count=6,
              contrast_correlation=0.5,
              confidence_level=0.95,
          )
          payload = result.as_dict()
          frozen = json.loads(
              Path("INDEPENDENT_C4_ONE_SIDED_SUPPORT_ENVELOPE_RECEIPT.json").read_text(
                  encoding="utf-8"
              )
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          assert result.qualification_pass
          run = frozen["first_1000_simulation_run"]
          assert payload["generator_version"] == frozen["generator_version"]
          assert payload["seed"] == run["seed"]
          assert payload["simulations_per_scenario"] == run["simulations_per_scenario"]
          assert payload["bootstrap_draws_per_interval"] == run["bootstrap_draws_per_interval"]
          assert payload["group_count"] == run["group_count"]
          assert payload["contrast_count"] == run["contrast_count"]
          assert payload["contrast_correlation"] == run["contrast_correlation"]
          assert payload["familywise_lower_confidence_level"] == run["familywise_lower_confidence_level"]
          assert payload["support_anchor_counts"] == frozen["summary"]["support_anchor_counts"]
          actual = {row["scenario_id"]: row for row in payload["scenarios"]}
          expected = {row["scenario_id"]: row for row in frozen["scenarios"]}
          assert actual.keys() == expected.keys()
          for scenario_id, row in actual.items():
              receipt = expected[scenario_id]
              for key in (
                  "distribution",
                  "blocks_per_group",
                  "contrast_count",
                  "one_sided_familywise_false_positive_rate",
                  "terminal_false_generalizing_rate",
                  "monte_carlo_standard_error",
                  "acceptance_pass",
              ):
                  assert row[key] == receipt[key]
          PY
