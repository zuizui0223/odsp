name: bop-fixed-model-group-validation

on:
  pull_request:
    paths:
      - "odsp/fixed_group_gain_protocol.py"
      - "odsp/new_group_gain_envelope.py"
      - "odsp/__init__.py"
      - "scripts/run_bop_fixed_model_group_transfer_benchmark.py"
      - "research/BOP_FIXED_MODEL_GROUP_TRANSFER_V1_CONTRACT.json"
      - "docs/bop_fixed_model_group_validation_v1.md"
      - "tests/test_fixed_group_gain_protocol.py"
      - "tests/test_bop_fixed_model_group_transfer_benchmark.py"
      - ".github/workflows/bop-fixed-model-group-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install scientific method
        run: python -m pip install -e '.[dev]'
      - name: Verify role isolation, frozen forecast binding and synthetic contract
        run: python -m pytest tests/test_fixed_group_gain_protocol.py tests/test_bop_fixed_model_group_transfer_benchmark.py tests/test_new_group_gain_envelope.py tests/test_bop_new_group_gain_envelope.py

  frozen-known-truth:
    needs: protocol-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fixed method dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run full PRE-FROZEN 128-world method benchmark
        run: python scripts/run_bop_fixed_model_group_transfer_benchmark.py --out "$RUNNER_TEMP/bop-fixed-model-knowntruth-v1.json"
      - name: Publish immutable first-result evaluation artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bop-fixed-model-knowntruth-v1
          path: ${{ runner.temp }}/bop-fixed-model-knowntruth-v1.json
          if-no-files-found: warn
          retention-days: 90
