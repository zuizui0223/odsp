name: bukhansan-published-site-spatial-influence-v2

on:
  push:
    branches: [ecology/uljin-matched-daylength-temporal-refuge-v0]
    paths:
      - 'BUKHANSAN_PUBLISHED_CAMERA_SITE_INFLUENCE_V2_CONTRACT.json'
      - 'scripts/run_bukhansan_published_camera_site_influence_v2.py'
      - 'tests/test_bukhansan_published_camera_site_influence_v2.py'
      - '.github/workflows/bukhansan-published-camera-site-influence-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  derived-published-site-evidence-no-causal-activity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Test original author-published margins, all-camera LOO, and source-HOLD guards
        run: python -m pytest -q tests/test_bukhansan_published_camera_site_influence_v2.py
      - name: Recompute real observed camera spatial allocation and all 11 leave-one-site-out contrasts
        run: python scripts/run_bukhansan_published_camera_site_influence_v2.py
