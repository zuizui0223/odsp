name: uljin-original-provider-JS-readonly-v0

on:
  push:
    branches: [ecology/uljin-matched-daylength-temporal-refuge-v0]
    paths:
      - 'scripts/probe_uljin_ecobank_download_js_v0.py'
      - 'tests/test_probe_uljin_ecobank_download_js_v0.py'
      - '.github/workflows/uljin-original-provider-js-readonly-v0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-download-handler-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal test dependency
        run: python -m pip install pytest
      - name: Check privacy, source provenance and read-only guards
        run: python -m pytest -q tests/test_probe_uljin_ecobank_download_js_v0.py
      - name: Inspect static HTML JavaScript handlers only
        run: python scripts/probe_uljin_ecobank_download_js_v0.py
