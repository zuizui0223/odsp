name: bop-identity-admission-gate-v1

on:
  pull_request:
    paths:
      - "odsp/group_identity_gate.py"
      - "odsp/__init__.py"
      - "tests/test_group_identity_gate.py"
      - "research/BOP_GROUP_IDENTITY_ADMISSION_V1_CONTRACT.json"
      - "docs/bop_group_identity_admission_v1.md"
      - "docs/bop_method_spine_v1.md"
      - "README.md"
      - ".github/workflows/bop-identity-admission-gate-v1.yml"
  push:
    branches: [main]
    paths:
      - "odsp/group_identity_gate.py"
      - "tests/test_group_identity_gate.py"
      - ".github/workflows/bop-identity-admission-gate-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity-and-group-count:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install method and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Verify canonical animal identity and rank feasibility without reading outcomes
        run: python -m pytest tests/test_group_identity_gate.py tests/test_fixed_group_gain_protocol.py tests/test_bop_method_spine_v1.py
