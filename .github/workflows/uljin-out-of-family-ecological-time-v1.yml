name: uljin-out-of-family-ecological-time-v1

on:
  push:
    branches:
      - method/uljin-out-of-family-ecological-time-controls-v1
    paths:
      - 'ULJIN_OUT_OF_FAMILY_ECOLOGICAL_TIME_V1_CONTRACT.json'
      - 'odsp/uljin_out_of_family_ecological_time_v1.py'
      - 'tests/test_uljin_out_of_family_ecological_time_v1.py'
      - 'scripts/run_uljin_out_of_family_ecological_time_v1.py'
      - '.github/workflows/uljin-out-of-family-ecological-time-v1.yml'
  workflow_dispatch:

jobs:
  first-frozen-out-of-family-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Verify observation-alias proof and old model integrity
        run: python -m pytest -q tests/test_uljin_out_of_family_ecological_time_v1.py
      - name: First frozen 30-world ecological misspecification benchmark
        run: python scripts/run_uljin_out_of_family_ecological_time_v1.py
      - name: Archive first out-of-family ecological result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uljin-out-of-family-ecological-time-first-v1
          path: ULJIN_OUT_OF_FAMILY_ECOLOGICAL_TIME_V1_FIRST_RECEIPT.json
          if-no-files-found: warn
