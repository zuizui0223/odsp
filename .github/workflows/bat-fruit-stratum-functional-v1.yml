name: ODSP bat fruit three-strata original-source functional information
on:
  push:
    branches:
      - prospective/bat-fruit-three-stratum-functional-20261123
    paths:
      - 'odsp/bat_fruit_stratum_functional_v1.py'
      - 'tests/test_bat_fruit_stratum_functional_v1.py'
      - '.github/workflows/bat-fruit-stratum-functional-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authenticated_source_functional_test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install repository scientific core dependencies
        run: python -m pip install -e '.[dev]'
      - name: Known-truth source/parser/math/null checks
        run: python -m unittest -v tests.test_bat_fruit_stratum_functional_v1
      - name: Fetch four pinned original Git blobs and evaluate registered functional nulls
        run: python -m odsp.bat_fruit_stratum_functional_v1
      - name: Archive original-source integrity and aggregate conditional information
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bat-fruit-three-stratum-functional-v1
          path: results/bat_fruit_three_stratum_functional_v1.json
          if-no-files-found: warn
          retention-days: 60
