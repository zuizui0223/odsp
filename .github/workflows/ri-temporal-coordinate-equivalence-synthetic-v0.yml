name: ri-temporal-coordinate-equivalence-synthetic-v0

on:
  push:
    branches:
      - ecology/ri-solar-v2-season-parity-audit-v0
    paths:
      - 'RI_TEMPORAL_COORDINATE_EQUIVALENCE_SYNTHETIC_V0_CONTRACT.json'
      - 'odsp/ri_temporal_coordinate_equivalence_synthetic_v0.py'
      - 'tests/test_ri_temporal_coordinate_equivalence_synthetic_v0.py'
      - 'scripts/run_ri_temporal_coordinate_equivalence_synthetic_v0.py'
      - '.github/workflows/ri-temporal-coordinate-equivalence-synthetic-v0.yml'
  workflow_dispatch:

jobs:
  two-opposed-worlds-and-nonidentifiability:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ODSP and scientific test requirements
        run: python -m pip install -e '.[dev]'
      - name: Validate exact density/Jacobian, dual known-truth worlds and detection aliasing
        run: python -m pytest -q tests/test_ri_temporal_coordinate_equivalence_synthetic_v0.py
      - name: Execute FIRST frozen theoretical panel without wildlife data
        run: python scripts/run_ri_temporal_coordinate_equivalence_synthetic_v0.py
      - name: Archive first synthetic receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ri-temporal-coordinate-equivalence-synthetic-v0
          path: RI_TEMPORAL_COORDINATE_EQUIVALENCE_SYNTHETIC_V0_FIRST_RECEIPT.json
          if-no-files-found: warn
