name: uljin-96bin-simultaneous-q-calibration-v0

on:
  push:
    branches:
      - method/uljin-96bin-simultaneous-q-calibration-v0
    paths:
      - 'ULJIN_96BIN_SIMULTANEOUS_Q_CALIBRATION_V0_CONTRACT.json'
      - 'odsp/uljin_96bin_simultaneous_q_calibration_v0.py'
      - 'tests/test_uljin_96bin_simultaneous_q_calibration_v0.py'
      - 'scripts/run_uljin_96bin_simultaneous_q_calibration_v0.py'
      - '.github/workflows/uljin-96bin-simultaneous-q-calibration-v0.yml'
  workflow_dispatch:

jobs:
  first-source-free-joint-q-clock-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ODSP and optional exact binomial quantile solver
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install 'scipy>=1.12,<2'
      - name: Verify q 4h-vs-15min binomial scope and 192 paired model score bounds
        run: python -m pytest -q tests/test_uljin_96bin_simultaneous_q_calibration_v0.py
      - name: Score FIRST frozen 192 model comparisons with independent q references
        run: python scripts/run_uljin_96bin_simultaneous_q_calibration_v0.py
      - name: Archive first complete calibration and model comparison receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uljin-96bin-simultaneous-q-calibration-first-v0
          path: ULJIN_96BIN_SIMULTANEOUS_Q_CALIBRATION_V0_FIRST_RECEIPT.json
          if-no-files-found: warn
