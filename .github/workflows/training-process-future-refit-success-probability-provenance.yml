name: training-process-future-refit-success-probability-provenance

on:
  pull_request:
    paths:
      - 'odsp/training_process_future_refit_success_probability.py'
      - 'odsp/training_process_future_refit_success_probability_confirmatory.py'
      - 'tests/test_training_process_future_refit_success_probability.py'
      - 'tests/test_training_process_future_refit_success_probability_confirmatory.py'
      - '.github/workflows/training-process-future-refit-success-probability-provenance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Verify future-refit probability provenance wrapper
        run: >-
          python -m pytest -q
          tests/test_training_process_future_refit_success_probability.py
          tests/test_training_process_future_refit_success_probability_confirmatory.py
