name: uljin-original-41-mirror-latitude-envelope-v0

on:
  push:
    branches:
      - ecology/uljin-photoperiod-mirror-design-v0
    paths:
      - 'ULJIN_MIRROR_LATITUDE_ENVELOPE_V0_CONTRACT.json'
      - 'odsp/uljin_mirror_latitude_envelope_v0.py'
      - 'tests/test_uljin_mirror_latitude_envelope_v0.py'
      - 'scripts/run_uljin_mirror_latitude_envelope_v0.py'
      - '.github/workflows/uljin-latitude-envelope-v0.yml'
  workflow_dispatch:

jobs:
  original-date-pair-latitude-robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test unmodified first paired-date calendar under latitude envelope
        run: python -m pytest -q tests/test_uljin_mirror_latitude_envelope_v0.py
      - name: Compute outcome-free original date pairs across public regional latitudes
        run: python scripts/run_uljin_mirror_latitude_envelope_v0.py
      - name: Preserve first deterministic sensitivity receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uljin-original-mirror-latitude-first-v0
          path: ULJIN_MIRROR_LATITUDE_ENVELOPE_FIRST_RECEIPT.json
          if-no-files-found: warn
