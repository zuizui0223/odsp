name: uljin-sparse-events-with-exposure-zero-preservation-v0

on:
  push:
    branches:
      - ecology/uljin-photoperiod-mirror-design-v0
    paths:
      - 'ULJIN_PAIRED_DAY_ZERO_PRESERVING_FEASIBILITY_V0_CONTRACT.json'
      - 'odsp/uljin_paired_day_zero_preserving_feasibility_v0.py'
      - 'tests/test_uljin_paired_day_zero_preserving_feasibility_v0.py'
      - 'scripts/run_uljin_paired_day_zero_preserving_feasibility_v0.py'
      - '.github/workflows/uljin-zero-preserving-feasibility-v0.yml'
  workflow_dispatch:

jobs:
  sparse-detection-design-not-observational-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Check predeclared homogeneous Poisson hypothetical support and real zero-count likelihood
        run: python -m pytest -q tests/test_uljin_paired_day_zero_preserving_feasibility_v0.py
      - name: Publish ONLY source-aggregate hypothetical, no animal events
        run: python scripts/run_uljin_paired_day_zero_preserving_feasibility_v0.py
      - name: Preserve first hypothetical design receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uljin-zero-preserving-feasibility-v0-first
          path: ULJIN_PAIRED_DAY_ZERO_PRESERVING_FEASIBILITY_FIRST_RECEIPT.json
          if-no-files-found: warn
