name: bop-swiss-temporal-bird-purge-v1
on:
  pull_request:
    paths:
      - 'research/BOP_SWISS_TEMPORAL_BIRD_PURGE_V1_CONTRACT.json'
      - 'scripts/bop_swiss_temporal_bird_purge_schema_v1.R'
      - 'scripts/bop_swiss_temporal_bird_purge_ranger_v1.R'
      - 'tests/test_bop_swiss_temporal_bird_purge_v1.py'
      - 'docs/bop_swiss_temporal_bird_purge_v1.md'
      - '.github/workflows/bop-swiss-temporal-bird-purge-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-bird-purged-calendar-split:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10','3.12','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - name: Check three predeclared year cutoffs and complete future bird-ID purge using known truth
        run: python -m pytest tests/test_bop_swiss_temporal_bird_purge_v1.py
  first-source-global-forward-model:
    needs: synthetic-bird-purged-calendar-split
    if: ${{ needs.synthetic-bird-purged-calendar-split.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 31
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
      - name: Install previously audited original-family ranger and aggregate JSON serializer
        run: Rscript -e 'install.packages(c("jsonlite","ranger"),repos="https://cloud.r-project.org")'
      - name: Test global time and animal purge using ONLY synthetic RF source before original RDS access
        run: Rscript scripts/bop_swiss_temporal_bird_purge_ranger_v1.R --self-test
      - name: Verify original RDS full Git blob and run two outcome-blind schema gates before training
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          f="$RUNNER_TEMP/nesttool_original_2024_swiss_ephemeral.rds"
          trap 'rm -f "$f"' EXIT
          curl --fail --location --silent --show-error --max-time 180 --retry 2 --output "$f" 'https://raw.githubusercontent.com/Vogelwarte/NestTool/8fdf3884b5f6079afdffdc5c563c9050766670a4/input_data_prepared.rds'
          test "$(stat -c%s "$f")" = '53709803'
          test "$(git hash-object "$f")" = 'fab942c0df8d6f77dc1db2bd2e2717681b9a3632'
          Rscript scripts/bop_nesttool_swiss_prepared_schema_v1.R "$f" "$RUNNER_TEMP/bop-swiss-forward-original-schema-first.json"
          Rscript scripts/bop_swiss_temporal_bird_purge_schema_v1.R "$f" "$RUNNER_TEMP/bop-swiss-forward-chronology-cohort-first.json"
          Rscript scripts/bop_swiss_temporal_bird_purge_ranger_v1.R "$f" "$RUNNER_TEMP/bop-swiss-forward-bird-purge-ranger-first.json"
      - name: Preserve aggregate source cohort counts or frozen model results/HOLD only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bop-swiss-temporal-bird-purge-first
          path: |
            ${{ runner.temp }}/bop-swiss-forward-original-schema-first.json
            ${{ runner.temp }}/bop-swiss-forward-chronology-cohort-first.json
            ${{ runner.temp }}/bop-swiss-forward-bird-purge-ranger-first.json
          retention-days: 90
          if-no-files-found: warn
