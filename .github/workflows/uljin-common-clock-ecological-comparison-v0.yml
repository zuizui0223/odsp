name: uljin-common-clock-ecological-comparison-v0

on:
  push:
    branches:
      - method/uljin-common-clock-ecological-comparison-v0
    paths:
      - 'ULJIN_COMMON_CLOCK_MECHANISTIC_COMPARISON_V0_CONTRACT.json'
      - 'odsp/uljin_common_clock_mechanistic_comparison_v0.py'
      - 'tests/test_uljin_common_clock_mechanistic_comparison_v0.py'
      - 'scripts/run_uljin_common_clock_mechanistic_comparison_v0.py'
      - '.github/workflows/uljin-common-clock-ecological-comparison-v0.yml'
  workflow_dispatch:

jobs:
  first-shared-clock-support-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Same civil outcomes, sunrise/sunset Jacobian, camera exposure and heldout site tests
        run: python -m pytest -q tests/test_uljin_common_clock_mechanistic_comparison_v0.py
      - name: First frozen 30-world clock vs astronomy vs season scoring
        run: python scripts/run_uljin_common_clock_mechanistic_comparison_v0.py
      - name: Archive source-free first fixed-common-clock result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uljin-common-clock-ecological-comparison-first-v0
          path: ULJIN_COMMON_CLOCK_MECHANISTIC_COMPARISON_V0_FIRST_RECEIPT.json
          if-no-files-found: warn
