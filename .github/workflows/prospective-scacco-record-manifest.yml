name: prospective Scacco 2026 38-taxon source archive metadata pin

on:
  push:
    branches: [prospective/multitaxon-airflow-20261021]
    paths:
      - prospective/scacco_archive_manifest.py
      - prospective/test_scacco_archive_manifest.py
      - .github/workflows/prospective-scacco-record-manifest.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-file-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit record-level checksum and license code before catalog request
        run: |
          python -m pip install pytest
          python -m pytest -q prospective/test_scacco_archive_manifest.py
      - name: Read only Zenodo 21915776 official source metadata
        run: |
          python -m prospective.scacco_archive_manifest \
            --out build/scacco_source/SCACCO_21915776_FILE_MANIFEST_V1.json
      - name: Verify official DOI, required source files and no outcomes
        run: |
          python - <<'PY'
          import json
          x=json.load(open('build/scacco_source/SCACCO_21915776_FILE_MANIFEST_V1.json'))
          assert x['record_id']==21915776
          assert x['doi']=='10.5281/zenodo.21915776'
          assert x['native_gps_altitude_values_read'] is False
          assert x['stage']=='ARCHIVE_MANIFEST_ONLY'
          assert x['files']['Data.zip']['bytes']>0
          print({k: (v['bytes'],v['md5']) for k,v in x['files'].items()})
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scacco-2026-38species-immutable-source-manifest-v1
          path: build/scacco_source/SCACCO_21915776_FILE_MANIFEST_V1.json
          if-no-files-found: warn
