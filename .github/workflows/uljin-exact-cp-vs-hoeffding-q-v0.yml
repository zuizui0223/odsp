name: uljin-exact-cp-vs-hoeffding-q-v0

on:
  push:
    branches:
      - method/uljin-exact-binomial-q-vs-hoeffding-v0
    paths:
      - 'ULJIN_EXACT_CP_VS_HOEFFDING_Q_V0_CONTRACT.json'
      - 'odsp/uljin_exact_cp_vs_hoeffding_q_v0.py'
      - 'tests/test_uljin_exact_cp_vs_hoeffding_q_v0.py'
      - 'scripts/run_uljin_exact_cp_vs_hoeffding_q_v0.py'
      - '.github/workflows/uljin-exact-cp-vs-hoeffding-q-v0.yml'
  workflow_dispatch:

jobs:
  first-frozen-exact-q-calibration-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Validate exact binomial CP inversion and split-alpha source embargo
        run: python -m pytest -q tests/test_uljin_exact_cp_vs_hoeffding_q_v0.py
      - name: First deterministic 16-case CP versus Hoeffding joint q calibration screen
        run: python scripts/run_uljin_exact_cp_vs_hoeffding_q_v0.py
      - name: Archive predeclared exact q interval comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uljin-exact-cp-vs-hoeffding-q-first-v0
          path: ULJIN_EXACT_CP_VS_HOEFFDING_Q_V0_FIRST_RECEIPT.json
          if-no-files-found: warn
