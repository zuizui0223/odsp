name: training-process-v5-untouched-external

on:
  pull_request:
    paths:
      - 'odsp/training_process_external_freeze_v1.py'
      - 'odsp/training_process_internal_qualification_v5.py'
      - 'odsp/training_process_managed_external_scoring.py'
      - 'odsp/training_process_untouched_external_v5.py'
      - 'tests/test_training_process_v5_untouched_external_freeze_contract.py'
      - 'tests/test_training_process_v5_untouched_external_freeze_contract_v2.py'
      - 'tests/test_training_process_v5_untouched_external_freeze_contract_v3.py'
      - 'tests/test_training_process_untouched_external_v5.py'
      - 'tests/test_training_process_v5_external_promotion_gate.py'
      - 'tests/test_training_process_v5_external_identity.py'
      - 'tests/test_training_process_v5_external_final_receipts.py'
      - 'ODSP_TRAINING_PROCESS_V5_UNTOUCHED_EXTERNAL_FREEZE_CONTRACT.json'
      - 'ODSP_TRAINING_PROCESS_V5_UNTOUCHED_EXTERNAL_FREEZE_CONTRACT_V2.json'
      - 'ODSP_TRAINING_PROCESS_V5_UNTOUCHED_EXTERNAL_FREEZE_CONTRACT_V3.json'
      - 'ODSP_TRAINING_PROCESS_V5_MANAGED_EXTERNAL_SCORING_CONTRACT.json'
      - 'ODSP_TRAINING_PROCESS_V5_EXTERNAL_PROMOTION_GATE.json'
      - 'ODSP_TRAINING_PROCESS_V5_EXTERNAL_PROMOTION_GATE_V2.json'
      - 'ODSP_TRAINING_PROCESS_V5_EXTERNAL_PROMOTION_GATE_V3.json'
      - 'ODSP_TRAINING_PROCESS_V5_EXTERNAL_ENDPOINT_IDENTITY_CONTRACT.json'
      - 'ODSP_TRAINING_PROCESS_V5_EXTERNAL_ENDPOINT_IDENTITY_CONTRACT_V2.json'
      - 'TRAINING_PROCESS_V5_EXTERNAL_FOCUSED_ENDPOINT_RECEIPT_V2.json'
      - 'TRAINING_PROCESS_V5_EXTERNAL_ENDPOINT_IDENTITY_RECEIPT_V2.json'
      - 'scripts/run_training_process_v5_external_identity.py'
      - '.github/workflows/training-process-v5-untouched-external.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate process-v5 untouched external endpoint
        run: >-
          python -m pytest -q
          tests/test_training_process_v5_untouched_external_freeze_contract.py
          tests/test_training_process_v5_untouched_external_freeze_contract_v2.py
          tests/test_training_process_v5_untouched_external_freeze_contract_v3.py
          tests/test_training_process_untouched_external_v5.py
          tests/test_training_process_v5_external_promotion_gate.py
          tests/test_training_process_v5_external_identity.py
          tests/test_training_process_v5_external_final_receipts.py
      - name: Snapshot external endpoint identity
        run: |
          python scripts/run_training_process_v5_external_identity.py
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.run_training_process_v5_external_identity import build_snapshot
          observed = build_snapshot()
          frozen = json.loads(
              Path("TRAINING_PROCESS_V5_EXTERNAL_ENDPOINT_IDENTITY_RECEIPT_V2.json").read_text()
          )
          for field in (
              "schema_version",
              "canonical_surface",
              "implementation_lock_id",
              "implementation_source_snapshot",
              "runtime_environment_lock_id",
              "runtime_environment_snapshot",
              "internal_v5_route_snapshot",
              "external_contract_sha256",
          ):
              assert observed[field] == frozen[field], field
          print("TRAINING_PROCESS_V5_EXTERNAL_IDENTITY_V2_MATCH=true")
          PY
