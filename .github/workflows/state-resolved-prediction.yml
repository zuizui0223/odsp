name: state-resolved-prediction

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Test state-resolved prediction API
        run: |
          python -m pytest -q \
            tests/test_state_prediction.py \
            tests/test_state_prediction_benchmark.py

      - name: Run finite-sample known-truth benchmark
        run: |
          python scripts/run_state_prediction_benchmark.py \
            --output artifacts/state_prediction_benchmark.json

      - uses: actions/upload-artifact@v4
        with:
          name: state-resolved-prediction-benchmark
          path: artifacts/state_prediction_benchmark.json
          if-no-files-found: error
          retention-days: 90
