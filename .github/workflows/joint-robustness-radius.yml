name: joint-robustness-radius

on:
  pull_request:
    paths:
      - 'JOINT_ROBUSTNESS_RADIUS_CONTRACT.json'
      - 'JOINT_ROBUSTNESS_RADIUS_VALIDATION_RECEIPT.json'
      - 'odsp/joint_robustness_radius.py'
      - 'odsp/joint_robustness_radius_benchmark.py'
      - 'scripts/run_joint_robustness_radius_benchmark.py'
      - 'tests/test_joint_robustness_radius.py'
      - 'tests/test_joint_robustness_radius_benchmark.py'
      - 'tests/test_joint_robustness_radius_contract.py'
      - 'tests/test_joint_robustness_radius_receipt.py'
      - 'docs/joint_robustness_radius_v1.md'
      - '.github/workflows/joint-robustness-radius.yml'
  push:
    branches: [main]
    paths:
      - 'JOINT_ROBUSTNESS_RADIUS_CONTRACT.json'
      - 'JOINT_ROBUSTNESS_RADIUS_VALIDATION_RECEIPT.json'
      - 'odsp/joint_robustness_radius.py'
      - 'odsp/joint_robustness_radius_benchmark.py'
      - 'scripts/run_joint_robustness_radius_benchmark.py'
      - 'tests/test_joint_robustness_radius.py'
      - 'tests/test_joint_robustness_radius_benchmark.py'
      - 'tests/test_joint_robustness_radius_contract.py'
      - 'tests/test_joint_robustness_radius_receipt.py'
      - 'docs/joint_robustness_radius_v1.md'
      - '.github/workflows/joint-robustness-radius.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ODSP core dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Test radius API and frozen contract
        run: |
          python -m pytest -q \
            tests/test_joint_robustness_radius.py \
            tests/test_joint_robustness_radius_benchmark.py \
            tests/test_joint_robustness_radius_contract.py
          if [ -f tests/test_joint_robustness_radius_receipt.py ]; then
            python -m pytest -q tests/test_joint_robustness_radius_receipt.py
          fi
      - name: Run frozen known-truth radius benchmark
        run: |
          python scripts/run_joint_robustness_radius_benchmark.py \
            --output artifacts/JOINT_ROBUSTNESS_RADIUS_BENCHMARK.json \
            --seed 20260906 \
            --bootstrap-draws 500
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/JOINT_ROBUSTNESS_RADIUS_BENCHMARK.json').read_text())
          assert r['passed'] is True
          assert len(r['checks']) == 12
          assert all(row['passed'] for row in r['checks'])
          assert r['strong_positive']['radius_status'] == 'robust_through_search_upper'
          assert r['strong_negative']['radius_status'] == 'robust_through_search_upper'
          assert r['mixed_positive']['radius_status'] == 'finite_radius'
          assert r['weak_positive']['radius_status'] == 'not_certified_at_baseline'
          assert r['too_few_blocks']['radius_status'] == 'unavailable'
          print(json.dumps(r,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: joint-robustness-radius-benchmark
          path: artifacts/JOINT_ROBUSTNESS_RADIUS_BENCHMARK.json
          if-no-files-found: error
          retention-days: 90
