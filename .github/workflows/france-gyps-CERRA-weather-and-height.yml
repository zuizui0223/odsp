name: France Gyps 2019-21 paired native heights with independent CERRA solar/wind site context

on:
  push:
    branches: [diagnostic/france-gyps-CERRA-day-context-20261023]
    paths:
      - prospective/FRANCE_GYPS_CERRA_POSTHOC_DUAL_SENSOR_HEIGHT_TEST_PLAN_V1.json
      - prospective/france_gyps_CERRA_day_height_kernel.py
      - prospective/run_france_gyps_CERRA_day_height_posthoc.py
      - prospective/test_run_france_gyps_CERRA_day_height_posthoc.py
      - .github/workflows/france-gyps-CERRA-weather-and-height.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  numerical-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy numba pyproj pytest
      - name: Verify noheight source plus simultaneous whole-calendar-day shuffles and source-matched sensor model
        env:
          NUMBA_CACHE_DIR: /tmp/france-gyps-CERRA-synth
        run: |
          python -m pytest -q \
            prospective/test_france_gyps_CERRA_context_support.py \
            prospective/test_run_france_gyps_CERRA_day_height_posthoc.py

  joint-source-weather-and-height:
    needs: numerical-synthetic
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy numba pyproj
      - name: Verify both original height-blind 28-bird roster and older exact study-parent crosswalk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/france_env
          curl --fail --silent --show-error --location --retry 3 --max-time 180 \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/zuizui0223/odsp/actions/artifacts/12400333253/zip' \
            -o build/france_env/original_noheight.zip
          echo '99677b58289e2663bfd1c87f0de661f996be0032ff39973e9725cb32ccb5189b  build/france_env/original_noheight.zip' | sha256sum --check
          unzip -p build/france_env/original_noheight.zip FRANCE_GYPS_2019_2021_XY_INSTRUMENT_SUPPORT_V1.json \
            > build/france_env/corrected_original_bird_roster.json
          curl --fail --silent --show-error --location --retry 3 --max-time 180 \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/zuizui0223/odsp/actions/artifacts/12399325799/zip' \
            -o build/france_env/original_crosswalk.zip
          echo '86a5c4c587119fb62ab331833ece731b2d937b46f717ed1f20dff86763dcdb6e  build/france_env/original_crosswalk.zip' | sha256sum --check
          unzip -p build/france_env/original_crosswalk.zip FRANCE_GYPS_2019_VS_SCACCO_PARENT_STUDY_SOURCE_CROSSWALK_V1.json \
            > build/france_env/original_crosswalk.json
          python - <<'PY'
          import json
          x=json.load(open('build/france_env/corrected_original_bird_roster.json'))
          y=json.load(open('build/france_env/original_crosswalk.json'))
          assert x['quarantined_nonbiological_animal_IDs']==['Test géodésie ornitela']
          assert x['horizontal_day_eligibility_by_cell_m']['5000']['n_unique_birds_with_qualifying_day_events']==28
          assert x['numeric_native_GPS_height_values_read'] is False
          assert y['source_independence_category']=='DIFFERENT_STUDY_NAMES_AND_ZERO_EXACT_SOURCE_ANIMAL_IDS'
          assert y['native_height_values_read'] is False
          print('Source bird IDs and prior source overlap verified, original height effects remain unchanged')
          PY
      - name: Download official original 1.09GB ZIP with HTTP resume after truncated responses
        run: |
          set -euo pipefail
          cd build/france_env
          url='https://data.indores.fr/api/access/datafile/5114'
          good=false
          for attempt in $(seq 1 16); do
            echo "Source ZIP attempt $attempt at byte position $(stat -c %s windTurbineAvoidance.zip 2>/dev/null || echo 0)"
            if curl --http1.1 --fail --location --silent --show-error \
                 --retry 1 --retry-all-errors --retry-delay 3 \
                 --connect-timeout 45 --max-time 600 --continue-at - \
                 -o windTurbineAvoidance.zip "$url"; then
              good=true
              break
            fi
            size=$(stat -c %s windTurbineAvoidance.zip 2>/dev/null || echo 0)
            if [ "$size" -gt 1093170227 ]; then
              echo 'Invalid source byte range, restart from original official URL'
              rm -f windTurbineAvoidance.zip
            fi
            sleep 3
          done
          test "$good" = true
          test "$(stat -c %s windTurbineAvoidance.zip)" -eq 1093170227
          echo 'b18cc8004d311d19ff24060f655178bf  windTurbineAvoidance.zip' | md5sum --check
      - name: Classify independently sourced solar and wind calendar days; NO native altitude inspected
        run: |
          set -euo pipefail
          python -m prospective.france_gyps_CERRA_context_support \
            --source build/france_env/windTurbineAvoidance.zip \
            --preheight build/france_env/corrected_original_bird_roster.json \
            --out build/france_env/FRANCE_GYPS_CERRA_SOLAR_WIND_NOHEIGHT_SOURCE_V1.json
      - name: Freeze environmental feasibility and selectively allow exploratory test
        run: |
          python - <<'PY'
          import json,os
          p='build/france_env/FRANCE_GYPS_CERRA_SOLAR_WIND_NOHEIGHT_SOURCE_V1.json'
          x=json.load(open(p))
          assert x['numeric_GPS_height_read'] is False
          assert x['numeric_baro_height_read'] is False
          assert x['original_biological_5min_events']==742078
          assert x['source_original_GPS_zip_md5']=='b18cc8004d311d19ff24060f655178bf'
          assert len(x['daily_climate'])>=1050
          for name in ('solar','wind'):
              s=x['source_support'][name]
              assert s['n_eligible_birds']<=28
              assert not s['native_altitude_read']
          good=x['solar_primary_source_admitted']
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('SOLAR_PASSED='+('true' if good else 'false')+'\n')
          print(json.dumps({
              'n_CERRA_days':len(x['daily_climate']),
              'solar_eligible_birds':x['source_support']['solar']['n_eligible_birds'],
              'solar_days':x['source_support']['solar']['eligible_bird_days'],
              'wind_eligible_birds':x['source_support']['wind']['n_eligible_birds'],
              'main_solar_support':good,
              'altitude_opened_in_source_gate':False,
          },sort_keys=True))
          PY
      - name: Run 5km POST-OUTCOME exploratory solar/wind shape scores on exact matched GPS/barometric source fixes
        if: env.SOLAR_PASSED == 'true'
        env:
          NUMBA_CACHE_DIR: /tmp/france-Gyps-CERRA-combined-numba
        run: |
          set -euo pipefail
          python -m prospective.run_france_gyps_CERRA_day_height_posthoc \
            --source build/france_env/windTurbineAvoidance.zip \
            --preheight-original build/france_env/corrected_original_bird_roster.json \
            --old-crosswalk build/france_env/original_crosswalk.json \
            --CERRA-source build/france_env/FRANCE_GYPS_CERRA_SOLAR_WIND_NOHEIGHT_SOURCE_V1.json \
            --out build/france_env/results
      - name: Verify empirical outcomes are explicitly postoutcome and sensor family complete
        if: env.SOLAR_PASSED == 'true'
        run: |
          python - <<'PY'
          import json
          path='build/france_env/results/FRANCE_GYPS_CERRA_SOLAR_WIND_5KM_DUAL_HEIGHT_POSTHOC_RESULT_V1.json'
          r=json.load(open(path))
          assert r['family_size']==4
          assert r['previous_height_results_opened_before_new_weather_hypothesis'] is True
          assert r['paired_sensor_quality']['joint_5min_GPS_fixes_for_scoring']==417821
          assert r['original_same_GPS_target_fixes_both_sensors']
          for climate in ('solar','wind'):
              for sensor in ('GPS','BAROMETRIC'):
                  p=r['panels'][climate][sensor]
                  assert p['terminal'] in ('supported_exploratory_environmental_shape',
                                           'not_supported_exploratory_environmental_shape',
                                           'unavailable')
                  assert p['Holm_exploratory_p_upper']>=p['family_p_placeholder']
                  if p['terminal']!='unavailable':
                      assert p['calibration']['requested']==999
                      assert p['calibration']['valid']>=950
          print(json.dumps({m:{sensor:{
              'birds':r['panels'][m][sensor]['observed']['eligible_birds'],
              'days':r['panels'][m][sensor]['observed']['eligible_bird_days'],
              'mean_gain':r['panels'][m][sensor]['observed']['mean_gain'],
              'null_excess':r['panels'][m][sensor].get('calibration',{}).get('observed_minus_null_mean'),
              'valid_null':r['panels'][m][sensor].get('calibration',{}).get('valid'),
              'Holm_p_upper':r['panels'][m][sensor]['Holm_exploratory_p_upper'],
              'status':r['panels'][m][sensor]['terminal']
          } for sensor in ('GPS','BAROMETRIC')} for m in ('solar','wind')},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: france-Gyps-CERRA-2019-2021-solar-wind-site-day-noheight-support-v1
          path: build/france_env/FRANCE_GYPS_CERRA_SOLAR_WIND_NOHEIGHT_SOURCE_V1.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: france-Gyps-postoutcome-5km-dualheight-solar-wind-context-v1
          path: build/france_env/results/*
          if-no-files-found: warn
