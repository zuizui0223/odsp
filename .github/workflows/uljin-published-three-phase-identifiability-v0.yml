name: uljin-published-ecological-phase-identifiability-v0

on:
  push:
    branches: [ecology/uljin-matched-daylength-temporal-refuge-v0]
    paths:
      - 'ULJIN_PUBLISHED_SUPPL3_PHASE_IDENTIFIABILITY_V0_CONTRACT.json'
      - 'scripts/run_uljin_published_three_phase_identifiability_v0.py'
      - 'tests/test_uljin_published_three_phase_identifiability_v0.py'
      - '.github/workflows/uljin-published-three-phase-identifiability-v0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authentic-published-source-versus-conditional-nonidentification:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight test dependency
        run: python -m pip install pytest
      - name: Test 3-part exact decomposition, bias threshold, pure site-mix witness and source-freeze safeguards
        run: python -m pytest -q tests/test_uljin_published_three_phase_identifiability_v0.py
      - name: Independently checksum-verify the authentic Zenodo Supplement 3 and compute empirical descriptive results
        run: python scripts/run_uljin_published_three_phase_identifiability_v0.py
