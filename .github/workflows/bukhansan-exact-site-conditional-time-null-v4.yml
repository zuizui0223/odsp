name: bukhansan-exact-site-conditional-time-null-v4

on:
  push:
    branches: [ecology/uljin-matched-daylength-temporal-refuge-v0]
    paths:
      - 'BUKHANSAN_PUBLISHED_SITE_CONDITIONAL_CLOCK_NULL_V4_CONTRACT.json'
      - 'scripts/run_bukhansan_published_exact_site_clock_null_v4.py'
      - 'tests/test_bukhansan_published_exact_site_clock_null_v4.py'
      - '.github/workflows/bukhansan-exact-site-conditional-time-null-v4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-source-exact-photograph-allocation-null:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest only
        run: python -m pip install pytest
      - name: Validate exact local hypergeometric masses, full 11-camera DP and biological source-HOLD
        run: python -m pytest -q tests/test_bukhansan_published_exact_site_clock_null_v4.py
      - name: Independently compute integer exact conditional null from author-published camera clock counts
        run: python scripts/run_bukhansan_published_exact_site_clock_null_v4.py
