name: future-refit-shared-validation-evalue-v0-panel

on:
  push:
    branches:
      - method/future-refit-shared-validation-evalue-v0
    paths:
      - 'odsp/future_refit_shared_validation_evalue_v0.py'
      - 'scripts/run_future_refit_shared_evalue_v0_panel.py'
      - 'ODSP_FUTURE_REFIT_SHARED_EVALUE_V0_SIMULATION_PLAN.json'
      - '.github/workflows/future-refit-shared-validation-evalue-v0-panel.yml'
  workflow_dispatch:

jobs:
  statistical-panel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Syntax and contract preflight
        run: python -m py_compile odsp/future_refit_shared_validation_evalue_v0.py scripts/run_future_refit_shared_evalue_v0_panel.py
      - name: Run prospectively frozen known-p worlds (never promote automatically)
        shell: bash
        run: |
          set -o pipefail
          python -u scripts/run_future_refit_shared_evalue_v0_panel.py | tee future_refit_shared_evalue_v0_panel_receipt.json
      - name: Preserve first outcome even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: future-refit-shared-evalue-v0-frozen-first-panel
          path: future_refit_shared_evalue_v0_panel_receipt.json
          if-no-files-found: warn
