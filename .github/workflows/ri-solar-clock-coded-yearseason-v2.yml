name: ri-solar-clock-coded-yearseason-v2-exploratory

on:
  push:
    branches:
      - ecology/ri-solar-clock-yearseason-v2-exploratory
    paths:
      - 'RI_SOLAR_CLOCK_YEARSEASON_V2_EXPLORATORY_CONTRACT.json'
      - 'odsp/ri_solar_clock_yearseason_v2.py'
      - 'scripts/run_ri_solar_clock_yearseason_v2.py'
      - 'tests/test_ri_solar_clock_yearseason_v2.py'
      - '.github/workflows/ri-solar-clock-coded-yearseason-v2.yml'
  workflow_dispatch:

jobs:
  site-year-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen ODSP package
        run: python -m pip install -e '.[dev]'
      - name: Scientific geometry, source and coded-season known-truth tests
        run: |
          python -m pytest -q \
            tests/test_ri_solar_clock_transfer_v0.py \
            tests/test_ri_solar_source_v0.py \
            tests/test_ri_solar_clock_yearseason_v2.py
      - name: One-shot public ecological v2 after known source-format exposure
        run: python scripts/run_ri_solar_clock_yearseason_v2.py
      - name: Archive first v2 exploratory result or unavailability
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ri-solar-clock-coded-yearseason-v2-first
          path: RI_SOLAR_CLOCK_YEARSEASON_V2_FIRST_RESULT.json
          if-no-files-found: warn
