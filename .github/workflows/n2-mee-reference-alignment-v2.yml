name: n2-mee-reference-alignment-v2

on:
  pull_request:
    paths:
      - 'N2_MEE_REFERENCE_ALIGNMENT_MANUSCRIPT_V2_CONTRACT.json'
      - 'N2_FAILURE_MODE_MANUSCRIPT_SUPERSESSION_RECEIPT_V2.json'
      - 'docs/n2_reference_alignment_manuscript_spine_v2.md'
      - 'scripts/build_n2_mee_reference_alignment_manuscript_v2.py'
      - 'tests/test_n2_mee_reference_alignment_manuscript_v2.py'
      - 'N2_STAGE1_FAILURE_MODE_RESULT_RECEIPT_V1.json'
      - 'N2_STAGE2_REAL_DATA_RESULT_RECEIPT_V1.json'
      - '.github/workflows/n2-mee-reference-alignment-v2.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and tests
        run: python -m pip install -e '.[dev]'
      - name: Validate reference-alignment manuscript contract and draft
        run: >-
          python -m pytest -q
          tests/test_n2_stage2_result_receipt.py
          tests/test_n2_mee_reference_alignment_manuscript_v2.py
      - name: Build reference-alignment manuscript
        run: |
          python scripts/build_n2_mee_reference_alignment_manuscript_v2.py \
            --output build/n2_reference_alignment_v2/N2_MEE_REFERENCE_ALIGNMENT_MANUSCRIPT_DRAFT_v2.md \
            --manifest build/n2_reference_alignment_v2/N2_MEE_REFERENCE_ALIGNMENT_MANUSCRIPT_DRAFT_v2.manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: n2-mee-reference-alignment-manuscript-v2
          path: build/n2_reference_alignment_v2/
          if-no-files-found: error
          retention-days: 90
