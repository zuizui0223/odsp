name: ODSP independent numpy replay 62-study vertical profiles v3
on:
  push:
    branches:
      - prospective/vertebrate-vertical-study-transfer-20261123
    paths:
      - 'scripts/verify_vertebrate_vertical_study_v3_independent.py'
      - '.github/workflows/vertebrate-vertical-study-independent-v3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent_source_score_replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NumPy for independent fitting
        run: python -m pip install 'numpy>=1.24,<3'
      - name: Independent source parser, numpy CV and numerical score comparison
        run: python -m scripts.verify_vertebrate_vertical_study_v3_independent
      - name: Archive independent original-source logscore receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vertebrate-vertical-independent-numpy-v3
          path: results/vertebrate_vertical_study_independent_v3.json
          retention-days: 60
          if-no-files-found: warn
