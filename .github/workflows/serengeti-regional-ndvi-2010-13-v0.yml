name: Real MOD13Q1 2010-2013 regional NDVI seasonal mirrors v0

on:
  push:
    branches:
      - ecology/seasonal-hysteresis-cross-landscape-paper-v0
    paths:
      - 'research/SERENGETI_REGIONAL_MOD13Q1_NDVI_2010_2013_SEASON_MIRROR_V0_CONTRACT.json'
      - 'scripts/run_serengeti_regional_ndvi_mirror_2010_2013_v0.py'
      - 'tests/test_serengeti_regional_modis_mirror_v0.py'
      - '.github/workflows/serengeti-regional-ndvi-2010-13-v0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-screened-regional-ndvi-series:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install GDAL/rasterio COG range-read wheels
        run: python -m pip install 'numpy>=1.24,<3' 'rasterio>=1.3.10,<2'
      - name: Validate Terra-only 522 fixed date-pairs / no future imagery / cloud-gap fail-closed
        run: python -m unittest discover -s tests -p 'test_serengeti_regional_modis_mirror_v0.py' -v
      - name: Source-only historical NDVI, 250-m QA=0, fixed 3x3 coarse public patch
        run: |
          python -m scripts.run_serengeti_regional_ndvi_mirror_2010_2013_v0 \
            --output outputs/serengeti_region_ndvi_2010_2013_522pairs_v0.json
      - name: Archive source item ID and scientific environmental-only receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serengeti-modis-terra-2010-13-ndvi-522-mirror-v0
          path: outputs/serengeti_region_ndvi_2010_2013_522pairs_v0.json
          if-no-files-found: warn
