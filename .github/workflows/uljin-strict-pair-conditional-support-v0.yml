name: uljin-strict-pair-conditional-support-v0

on:
  push:
    branches:
      - method/uljin-conditional-support-feasibility-v0
    paths:
      - 'ULJIN_STRICT_PAIR_CONDITIONAL_SUPPORT_V0_CONTRACT.json'
      - 'odsp/uljin_strict_pair_conditional_support_v0.py'
      - 'tests/test_uljin_strict_pair_conditional_support_v0.py'
      - 'scripts/run_uljin_strict_pair_conditional_support_v0.py'
      - '.github/workflows/uljin-strict-pair-conditional-support-v0.yml'
  workflow_dispatch:

jobs:
  first-analytic-source-free-feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate exact finite-N multinomial probability and safeguards
        run: python -m pytest -q tests/test_uljin_strict_pair_conditional_support_v0.py
      - name: Generate first full-year supply bound scenarios, no source events
        run: python scripts/run_uljin_strict_pair_conditional_support_v0.py
      - name: Archive exact source-free analytic result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uljin-strict-pair-conditional-support-first-v0
          path: ULJIN_STRICT_PAIR_CONDITIONAL_SUPPORT_V0_FIRST_RECEIPT.json
          if-no-files-found: warn
