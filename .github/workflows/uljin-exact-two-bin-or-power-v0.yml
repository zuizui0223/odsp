name: uljin-exact-two-bin-or-power-v0

on:
  push:
    branches:
      - method/uljin-exact-conditional-or-power-v0
    paths:
      - 'ULJIN_EXACT_TWO_BIN_OR_POWER_V0_CONTRACT.json'
      - 'odsp/uljin_exact_two_bin_or_power_v0.py'
      - 'tests/test_uljin_exact_two_bin_or_power_v0.py'
      - 'scripts/run_uljin_exact_two_bin_or_power_v0.py'
      - '.github/workflows/uljin-exact-two-bin-or-power-v0.yml'
  workflow_dispatch:

jobs:
  first-frozen-exact-conditional-power:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Verify exact Fisher conditional null size and fixed design power
        run: python -m pytest -q tests/test_uljin_exact_two_bin_or_power_v0.py
      - name: First frozen exact effect-size/sample-size panel
        run: python scripts/run_uljin_exact_two_bin_or_power_v0.py
      - name: Archive first source-free exact power receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uljin-exact-two-bin-power-first-v0
          path: ULJIN_EXACT_TWO_BIN_OR_POWER_V0_FIRST_RECEIPT.json
          if-no-files-found: warn
