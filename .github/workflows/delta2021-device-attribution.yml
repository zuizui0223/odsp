name: DELTATRACK 2021 device and measurement attribution

on:
  push:
    branches: [diagnostic/delta2021-device-context-20261020]
    paths:
      - prospective/delta2021_device_qc.py
      - prospective/test_delta2021_device_qc.py
      - prospective/DELTATRACK_2021_DEVICE_IDENTIFIABILITY_CONTRACT_V1.json
      - .github/workflows/delta2021-device-attribution.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q prospective/test_delta2021_device_qc.py
  immutable-source-qc:
    needs: synthetic-tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Freeze-validation and source download
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/delta2021_device
          cd build/delta2021_device
          curl --fail --silent --show-error --location --retry 3 --retry-delay 5 --max-time 900 \
            'https://zenodo.org/records/22102508/files/DELTATRACK-gps-2021.csv.gz?download=1' \
            -o DELTATRACK-gps-2021.csv.gz
          curl --fail --silent --show-error --location --retry 3 --retry-delay 5 --max-time 120 \
            'https://zenodo.org/records/22102508/files/DELTATRACK-reference-data.csv?download=1' \
            -o DELTATRACK-reference-data.csv
          printf '%s\n' \
            '1a3145234cccd1a48b280b0fb485d679  DELTATRACK-gps-2021.csv.gz' \
            'f1dd2f8966b3748a24165b989c10095d  DELTATRACK-reference-data.csv' | md5sum --check
      - name: Run metadata-only instrument adequacy audit
        run: |
          python -m prospective.delta2021_device_qc \
            --gps build/delta2021_device/DELTATRACK-gps-2021.csv.gz \
            --reference build/delta2021_device/DELTATRACK-reference-data.csv \
            --output build/delta2021_device/DELTATRACK_2021_DEVICE_QC_V1.json
      - name: Validate absence of identity-rescoring
        run: |
          python - <<'PY'
          import json
          p='build/delta2021_device/DELTATRACK_2021_DEVICE_QC_V1.json'
          d=json.load(open(p))
          assert d['permutations_run']==0
          assert d['altitude_individual_identity_not_rescored']
          assert d['gps_md5']=='1a3145234cccd1a48b280b0fb485d679'
          assert set(d['panels'])=={'Larus fuscus','Larus argentatus'}
          for t,v in d['panels'].items():
              assert v['flight']['valid_gps_height_bins']>0
              print(t,'tags',v['device']['tags'],'bar candidate',v['barometer']['channel_candidate'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deltatrack-2021-device-and-measurement-audit
          path: build/delta2021_device/DELTATRACK_2021_DEVICE_QC_V1.json
          if-no-files-found: warn
