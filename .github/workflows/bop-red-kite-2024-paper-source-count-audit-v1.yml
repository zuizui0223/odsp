name: bop-red-kite-2024-paper-source-count-audit-v1
on:
  pull_request:
    paths:
      - "research/BOP_RED_KITE_2024_PAPER_SOURCE_COUNT_AUDIT_V1.json"
      - "scripts/audit_bop_red_kite_paper_source_count_path_v1.py"
      - "tests/test_bop_red_kite_2024_paper_source_count_audit_v1.py"
      - "docs/bop_red_kite_2024_paper_source_count_audit_v1.md"
      - "manuscript/BOP_INDEPENDENT_ANIMAL_GAIN_METHODS_DRAFT_v1.md"
      - ".github/workflows/bop-red-kite-2024-paper-source-count-audit-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publication-source-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - name: Confirm only original count receipts and anchored 2024 code are interpreted
        run: python -m pytest tests/test_bop_red_kite_2024_paper_source_count_audit_v1.py
      - name: Replay version-caveated paper/source count reconciliation without GPS
        run: python scripts/audit_bop_red_kite_paper_source_count_path_v1.py --out "$RUNNER_TEMP/bop-red-kite-count-provenance-v1.json"
