name: uljin-paired-random-cp-calibration-v1

on:
  push:
    branches:
      - method/uljin-paired-random-cp-calibration-power-v1
    paths:
      - 'ULJIN_PAIRED_RANDOM_CP_VS_HOEFFDING_V1_CONTRACT.json'
      - 'odsp/uljin_paired_random_cp_calibration_v1.py'
      - 'tests/test_uljin_paired_random_cp_calibration_v1.py'
      - 'scripts/run_uljin_paired_random_cp_calibration_v1.py'
      - '.github/workflows/uljin-paired-random-cp-calibration-v1.yml'
  workflow_dispatch:

jobs:
  first-frozen-paired-randomized-detector-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and isolated exact-beta-quantile dependency
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install 'scipy>=1.12,<2'
      - name: Validate exact Clopper-Pearson coverage and exact prior Hoeffding replay
        run: python -m pytest -q tests/test_uljin_paired_random_cp_calibration_v1.py
      - name: FIRST frozen 9600 paired-world CP-versus-Hoeffding calibration panel
        run: python scripts/run_uljin_paired_random_cp_calibration_v1.py
      - name: Archive first full paired calibration result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uljin-paired-random-cp-calibration-first-v1
          path: ULJIN_PAIRED_RANDOM_CP_VS_HOEFFDING_V1_FIRST_RECEIPT.json
          if-no-files-found: warn
