name: training-process-positive-pigeonhole-iut-v3-power

on:
  pull_request:
    paths:
      - 'odsp/training_process_positive_pigeonhole_iut.py'
      - 'odsp/training_process_positive_pigeonhole_iut_calibration.py'
      - 'tests/test_training_process_positive_pigeonhole_iut_v3.py'
      - 'tests/test_training_process_positive_pigeonhole_iut_calibration.py'
      - 'ODSP_TRAINING_PROCESS_POSITIVE_PIGEONHOLE_IUT_V3_CONTRACT.json'
      - 'ODSP_TRAINING_PROCESS_POSITIVE_PIGEONHOLE_IUT_V3_POWER_CALIBRATION_CONTRACT.json'
      - 'scripts/run_training_process_positive_pigeonhole_iut_v3_power_calibration.py'
      - '.github/workflows/training-process-positive-pigeonhole-iut-v3-power.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-power:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test v3
        run: >-
          python -m pytest -q
          tests/test_training_process_positive_pigeonhole_iut_v3.py
          tests/test_training_process_positive_pigeonhole_iut_calibration.py
      - name: Run frozen v3 power qualification
        run: |
          python scripts/run_training_process_positive_pigeonhole_iut_v3_power_calibration.py             --output /tmp/v3-power.json             --seed 20261010             --simulations 1000             --bootstrap-draws 500
          echo V3_POWER_BEGIN
          cat /tmp/v3-power.json
          echo V3_POWER_END
