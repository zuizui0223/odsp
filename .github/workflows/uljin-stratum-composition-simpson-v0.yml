name: uljin-stratum-composition-simpson-v0

on:
  push:
    branches:
      - method/uljin-stratum-composition-simpson-v0
    paths:
      - 'ULJIN_STRATUM_COMPOSITION_SIMPSON_V0_CONTRACT.json'
      - 'odsp/uljin_stratum_composition_simpson_v0.py'
      - 'tests/test_uljin_stratum_composition_simpson_v0.py'
      - 'scripts/run_uljin_stratum_composition_simpson_v0.py'
      - '.github/workflows/uljin-stratum-composition-simpson-v0.yml'
  workflow_dispatch:

jobs:
  source-free-simpson-null-power-panel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate Simpson oracle, fixed sites, partial pooling, and exact permutation null
        run: python -m pytest -q tests/test_uljin_stratum_composition_simpson_v0.py
      - name: Execute first frozen 600-world panel
        run: python scripts/run_uljin_stratum_composition_simpson_v0.py
      - name: Archive synthetic panel without field records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uljin-stratum-composition-simpson-first-v0
          path: ULJIN_STRATUM_COMPOSITION_SIMPSON_V0_FIRST_RECEIPT.json
          if-no-files-found: warn
