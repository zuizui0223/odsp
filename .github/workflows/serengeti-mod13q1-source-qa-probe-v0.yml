name: Real MOD13Q1 NDVI satellite source and QA pixel probe v0

on:
  push:
    branches:
      - ecology/seasonal-hysteresis-cross-landscape-paper-v0
    paths:
      - 'research/SERENGETI_MOD13Q1_QA_SOURCE_PROBE_V0_CONTRACT.json'
      - 'scripts/probe_serengeti_mod13q1_ndvi_cog_v0.py'
      - 'tests/test_serengeti_mod13q1_ndvi_source_probe_v0.py'
      - '.github/workflows/serengeti-mod13q1-source-qa-probe-v0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-terra-ndvi-qa-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install raster window and science test dependencies
        run: python -m pip install 'numpy>=1.24,<3' 'rasterio>=1.3.10,<2'
      - name: Prove strict source/QA rules from synthetic fixtures
        run: python -m unittest discover -s tests -p 'test_serengeti_mod13q1_ndvi_source_probe_v0.py' -v
      - name: Read ONE REAL public original 2012 Terra 250-m NDVI + QA 3x3 window
        run: |
          python -m scripts.probe_serengeti_mod13q1_ndvi_cog_v0 \
            --output outputs/serengeti_mod13q1_source_qa_probe_v0.json
          python - <<'PY'
          import json
          data=json.load(open('outputs/serengeti_mod13q1_source_qa_probe_v0.json'))
          if data['status'].startswith('HOLD'):
              print('SOURCE_ACCESS_HOLD_NOT_ANIMAL_ECOLOGY')
          elif data['status'].startswith('QA_HOLD'):
              print('REAL_COG_READ_SUCCESSFUL_BUT_INSUFFICIENT_GOOD_PIXELS')
          else:
              print('REAL_COG_QA_GOOD_NDVI_READ_SUCCESSFUL')
          assert data['animal_event_data_read'] is False if 'animal_event_data_read' in data else True
          PY
      - name: Upload only public coarse-point first-satellite QA receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serengeti-mod13q1-real-ndvi-qa-source-v0
          path: outputs/serengeti_mod13q1_source_qa_probe_v0.json
          if-no-files-found: warn
