name: multicontrast-bootstrap-t-v2-calibration

on:
  pull_request:
    paths:
      - 'odsp/bootstrap_t.py'
      - 'odsp/multicontrast_bootstrap_t.py'
      - 'odsp/multicontrast_bootstrap_t_calibration.py'
      - 'tests/test_multicontrast_bootstrap_t_calibration.py'
      - 'ODSP_MULTICONTRAST_BOOTSTRAP_T_V2_CALIBRATION_CONTRACT.json'
      - 'MULTICONTRAST_BOOTSTRAP_T_V2_OPERATING_CHARACTERISTICS_RECEIPT.json'
      - '.github/workflows/multicontrast-bootstrap-t-v2-calibration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core package without prediction extra
        run: python -m pip install -e '.[dev]'
      - name: Run calibration unit tests
        run: python -m pytest -q tests/test_multicontrast_bootstrap_t_calibration.py
      - name: Run predeclared 1000-simulation multicontrast calibration
        run: |
          python - <<'PY'
          import json
          from odsp.multicontrast_bootstrap_t_calibration import (
              GENERATOR_VERSION,
              run_multicontrast_bootstrap_t_calibration,
          )

          result = run_multicontrast_bootstrap_t_calibration()
          payload = result.as_dict()
          print('MULTICONTRAST_BOOTSTRAP_T_V2_CALIBRATION=' + json.dumps(payload, sort_keys=True))
          assert payload['generator_version'] == GENERATOR_VERSION
          assert result.qualification_pass, payload
          assert all(row['v2_acceptance_pass'] is True for row in payload['scenarios'])
          print('MULTICONTRAST_BOOTSTRAP_T_V2_CALIBRATION_QUALIFIED=true')
          PY
