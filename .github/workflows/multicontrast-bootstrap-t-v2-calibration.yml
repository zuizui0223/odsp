name: multicontrast-bootstrap-t-v2-calibration

on:
  pull_request:
    paths:
      - 'odsp/bootstrap_t.py'
      - 'odsp/multicontrast_bootstrap_t.py'
      - 'odsp/multicontrast_bootstrap_t_calibration.py'
      - 'tests/test_multicontrast_bootstrap_t_calibration.py'
      - 'tests/test_multicontrast_bootstrap_t_v2_receipt.py'
      - 'ODSP_MULTICONTRAST_BOOTSTRAP_T_V2_CALIBRATION_CONTRACT.json'
      - 'MULTICONTRAST_BOOTSTRAP_T_V2_OPERATING_CHARACTERISTICS_RECEIPT.json'
      - '.github/workflows/multicontrast-bootstrap-t-v2-calibration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core package without prediction extra
        run: python -m pip install -e '.[dev]'
      - name: Run calibration and receipt tests
        run: >-
          python -m pytest -q
          tests/test_multicontrast_bootstrap_t_calibration.py
          tests/test_multicontrast_bootstrap_t_v2_receipt.py
      - name: Re-run 1000-simulation calibration and match frozen receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from odsp.multicontrast_bootstrap_t_calibration import (
              GENERATOR_VERSION,
              run_multicontrast_bootstrap_t_calibration,
          )

          expected = json.loads(Path('MULTICONTRAST_BOOTSTRAP_T_V2_OPERATING_CHARACTERISTICS_RECEIPT.json').read_text())
          result = run_multicontrast_bootstrap_t_calibration()
          observed = result.as_dict()
          print('MULTICONTRAST_BOOTSTRAP_T_V2_CALIBRATION=' + json.dumps(observed, sort_keys=True))
          assert result.qualification_pass, observed
          assert observed['generator_version'] == GENERATOR_VERSION == expected['generator_version']
          frozen = {row['scenario_id']: row for row in expected['scenarios']}
          actual = {row['scenario_id']: row for row in observed['scenarios']}
          assert set(actual) == set(frozen)
          fields = (
              'v2_two_sided_familywise_noncoverage_rate',
              'v2_terminal_false_generalizing_rate',
              'v2_monte_carlo_standard_error',
          )
          run = expected['first_1000_simulation_run']
          for scenario_id in sorted(frozen):
              assert actual[scenario_id]['simulations'] == run['simulations_per_scenario']
              assert actual[scenario_id]['blocks_per_group'] == frozen[scenario_id]['blocks_per_group']
              assert actual[scenario_id]['contrast_count'] == frozen[scenario_id]['contrast_count']
              assert actual[scenario_id]['distribution'] == frozen[scenario_id]['distribution']
              assert actual[scenario_id]['v2_acceptance_pass'] is True
              for field in fields:
                  assert abs(float(actual[scenario_id][field]) - float(frozen[scenario_id][field])) <= 1e-15, (
                      scenario_id, field, actual[scenario_id][field], frozen[scenario_id][field]
                  )
          assert observed['seed'] == run['seed']
          assert observed['simulations_per_scenario'] == run['simulations_per_scenario']
          assert observed['bootstrap_draws_per_interval'] == run['bootstrap_draws_per_interval']
          assert observed['group_count'] == run['group_count']
          assert observed['contrast_correlation'] == run['contrast_correlation']
          print('MULTICONTRAST_BOOTSTRAP_T_V2_CALIBRATION_MATCHES_FROZEN_RECEIPT=true')
          PY
