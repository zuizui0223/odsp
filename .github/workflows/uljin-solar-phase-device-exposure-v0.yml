name: uljin-exact-solar-phase-device-exposure-v0

on:
  push:
    branches:
      - method/uljin-zero-preserving-conditional-rate-v0
    paths:
      - 'ULJIN_SOLAR_PHASE_DEVICE_EXPOSURE_V0_CONTRACT.json'
      - 'odsp/uljin_solar_phase_device_exposure_v0.py'
      - 'tests/test_uljin_solar_phase_device_exposure_v0.py'
      - 'scripts/run_uljin_solar_phase_device_exposure_v0.py'
      - '.github/workflows/uljin-solar-phase-device-exposure-v0.yml'
  workflow_dispatch:

jobs:
  source-free-jacobian:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Verify continuous solar phase uptime measurement and bin crossing
        run: python -m pytest -q tests/test_uljin_solar_phase_device_exposure_v0.py
      - name: Reproduce first original date-pair no-data astronomy control
        run: python scripts/run_uljin_solar_phase_device_exposure_v0.py
      - name: Preserve first source-free companion receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uljin-solar-phase-operating-hours-first-v0
          path: ULJIN_SOLAR_PHASE_DEVICE_EXPOSURE_V0_FIRST_RECEIPT.json
          if-no-files-found: warn
