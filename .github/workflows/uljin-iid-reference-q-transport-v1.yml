name: uljin-iid-reference-q-transport-v1

on:
  push:
    branches:
      - method/uljin-iid-reference-q-transport-control-v1
    paths:
      - 'ULJIN_IID_REFERENCE_Q_TRANSPORT_V1_CONTRACT.json'
      - 'odsp/uljin_iid_reference_q_transport_v1.py'
      - 'tests/test_uljin_iid_reference_q_transport_v1.py'
      - 'scripts/run_uljin_iid_reference_q_transport_v1.py'
      - '.github/workflows/uljin-iid-reference-q-transport-v1.yml'
  workflow_dispatch:

jobs:
  first-frozen-valid-IID-reference-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install optional scientific calibration
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install 'scipy>=1.12,<2'
      - name: Verify proper iid source binomial law and parent replay
        run: python -m pytest -q tests/test_uljin_iid_reference_q_transport_v1.py
      - name: Score first 2400 proper iid reference versus target q worlds
        run: python scripts/run_uljin_iid_reference_q_transport_v1.py
      - name: Archive first transport receipt without source events
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uljin-iid-reference-q-transport-first-v1
          path: ULJIN_IID_REFERENCE_Q_TRANSPORT_V1_FIRST_RECEIPT.json
          if-no-files-found: warn
