name: block-aware-transfer-uncertainty

on:
  pull_request:
    paths:
      - 'BLOCK_AWARE_TRANSFER_UNCERTAINTY_CONTRACT.json'
      - 'BLOCK_AWARE_TRANSFER_UNCERTAINTY_VALIDATION_RECEIPT.json'
      - 'odsp/block_aware_transfer_uncertainty.py'
      - 'odsp/block_aware_transfer_uncertainty_benchmark.py'
      - 'scripts/run_block_aware_transfer_uncertainty_benchmark.py'
      - 'tests/test_block_aware_transfer_uncertainty.py'
      - 'tests/test_block_aware_transfer_uncertainty_benchmark.py'
      - 'tests/test_block_aware_transfer_uncertainty_contract.py'
      - 'tests/test_block_aware_transfer_uncertainty_receipt.py'
      - 'docs/block_aware_transfer_uncertainty_v1.md'
      - '.github/workflows/block-aware-transfer-uncertainty.yml'
  push:
    branches: [main]
    paths:
      - 'BLOCK_AWARE_TRANSFER_UNCERTAINTY_CONTRACT.json'
      - 'BLOCK_AWARE_TRANSFER_UNCERTAINTY_VALIDATION_RECEIPT.json'
      - 'odsp/block_aware_transfer_uncertainty.py'
      - 'odsp/block_aware_transfer_uncertainty_benchmark.py'
      - 'scripts/run_block_aware_transfer_uncertainty_benchmark.py'
      - 'tests/test_block_aware_transfer_uncertainty.py'
      - 'tests/test_block_aware_transfer_uncertainty_benchmark.py'
      - 'tests/test_block_aware_transfer_uncertainty_contract.py'
      - 'tests/test_block_aware_transfer_uncertainty_receipt.py'
      - 'docs/block_aware_transfer_uncertainty_v1.md'
      - '.github/workflows/block-aware-transfer-uncertainty.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ODSP core dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Test API and frozen contract
        run: |
          python -m pytest -q \
            tests/test_block_aware_transfer_uncertainty.py \
            tests/test_block_aware_transfer_uncertainty_benchmark.py \
            tests/test_block_aware_transfer_uncertainty_contract.py
          if [ -f tests/test_block_aware_transfer_uncertainty_receipt.py ]; then
            python -m pytest -q tests/test_block_aware_transfer_uncertainty_receipt.py
          fi
      - name: Run frozen known-truth benchmark
        run: |
          python scripts/run_block_aware_transfer_uncertainty_benchmark.py \
            --output artifacts/BLOCK_AWARE_TRANSFER_UNCERTAINTY_BENCHMARK.json \
            --seed 20260906 \
            --bootstrap-draws 2000 \
            --confidence-level 0.95
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('artifacts/BLOCK_AWARE_TRANSFER_UNCERTAINTY_BENCHMARK.json').read_text())
          assert r['passed'] is True
          assert len(r['checks']) == 14
          assert all(row['passed'] for row in r['checks'])
          assert r['strong_positive']['robust_transfer_category'] == 'robust_generalizing'
          assert r['weak_positive']['robust_transfer_category'] == 'uncertain'
          assert r['pseudoreplication_row_mode']['groups'][0]['lower_bound'] > 0.0
          assert r['pseudoreplication_block_mode']['groups'][0]['lower_bound'] <= 0.0
          assert r['too_few_blocks']['robust_transfer_category'] == 'unavailable'
          print(json.dumps(r, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: block-aware-transfer-uncertainty-benchmark
          path: artifacts/BLOCK_AWARE_TRANSFER_UNCERTAINTY_BENCHMARK.json
          if-no-files-found: error
          retention-days: 90
