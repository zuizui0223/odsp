name: bounded-reweighting-robustness

on:
  pull_request:
    paths:
      - 'BOUNDED_REWEIGHTING_ROBUSTNESS_CONTRACT.json'
      - 'BOUNDED_REWEIGHTING_ROBUSTNESS_VALIDATION_RECEIPT.json'
      - 'odsp/bounded_reweighting_robustness.py'
      - 'odsp/bounded_reweighting_robustness_benchmark.py'
      - 'scripts/run_bounded_reweighting_robustness_benchmark.py'
      - 'tests/test_bounded_reweighting_robustness.py'
      - 'tests/test_bounded_reweighting_robustness_benchmark.py'
      - 'tests/test_bounded_reweighting_robustness_contract.py'
      - 'tests/test_bounded_reweighting_robustness_receipt.py'
      - 'docs/bounded_reweighting_robustness_v1.md'
      - '.github/workflows/bounded-reweighting-robustness.yml'
  push:
    branches: [main]
    paths:
      - 'BOUNDED_REWEIGHTING_ROBUSTNESS_CONTRACT.json'
      - 'BOUNDED_REWEIGHTING_ROBUSTNESS_VALIDATION_RECEIPT.json'
      - 'odsp/bounded_reweighting_robustness.py'
      - 'odsp/bounded_reweighting_robustness_benchmark.py'
      - 'scripts/run_bounded_reweighting_robustness_benchmark.py'
      - 'tests/test_bounded_reweighting_robustness.py'
      - 'tests/test_bounded_reweighting_robustness_benchmark.py'
      - 'tests/test_bounded_reweighting_robustness_contract.py'
      - 'tests/test_bounded_reweighting_robustness_receipt.py'
      - 'docs/bounded_reweighting_robustness_v1.md'
      - '.github/workflows/bounded-reweighting-robustness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ODSP core dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Test bounded reweighting API and frozen contract
        run: |
          python -m pytest -q \
            tests/test_bounded_reweighting_robustness.py \
            tests/test_bounded_reweighting_robustness_benchmark.py \
            tests/test_bounded_reweighting_robustness_contract.py
          if [ -f tests/test_bounded_reweighting_robustness_receipt.py ]; then
            python -m pytest -q tests/test_bounded_reweighting_robustness_receipt.py
          fi
      - name: Run frozen known-truth bounded reweighting benchmark
        run: |
          python scripts/run_bounded_reweighting_robustness_benchmark.py \
            --output artifacts/BOUNDED_REWEIGHTING_ROBUSTNESS_BENCHMARK.json \
            --gamma 2.0
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/BOUNDED_REWEIGHTING_ROBUSTNESS_BENCHMARK.json').read_text())
          assert r['passed'] is True
          assert len(r['checks']) == 12
          assert all(row['passed'] for row in r['checks'])
          assert r['all_positive']['envelope_transfer_category'] == 'gamma_robust_generalizing'
          assert r['mixed_sign_primary_gamma']['envelope_transfer_category'] == 'gamma_sensitive'
          assert r['all_negative']['envelope_transfer_category'] == 'gamma_robust_non_generalizing'
          assert r['mixed_sign_critical_gamma_error'] <= 1e-10
          assert r['small_n_exhaustive_error'] <= 1e-12
          print(json.dumps(r,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bounded-reweighting-robustness-benchmark
          path: artifacts/BOUNDED_REWEIGHTING_ROBUSTNESS_BENCHMARK.json
          if-no-files-found: error
          retention-days: 90
