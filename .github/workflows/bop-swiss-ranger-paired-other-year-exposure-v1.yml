name: bop-swiss-ranger-paired-other-year-exposure-v1
on:
  pull_request:
    paths:
      - 'research/BOP_SWISS_RANGER_PAIRED_OTHER_YEAR_EXPOSURE_V1_CONTRACT.json'
      - 'BOP_SWISS_RANGER_PAIRED_OTHER_YEAR_EXPOSURE_V1_FIRST_RECEIPT.json'
      - 'scripts/bop_swiss_ranger_paired_other_year_exposure_v1.R'
      - 'scripts/verify_bop_swiss_ranger_paired_first_v1.py'
      - 'tests/test_bop_swiss_ranger_paired_other_year_exposure_v1.py'
      - 'tests/test_bop_swiss_ranger_paired_first_receipt_v1.py'
      - 'docs/bop_swiss_ranger_paired_other_year_exposure_v1.md'
      - 'manuscript/BOP_INDEPENDENT_ANIMAL_GAIN_METHODS_DRAFT_v1.md'
      - 'README.md'
      - '.github/workflows/bop-swiss-ranger-paired-other-year-exposure-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
# The first real 2024 Swiss ranger paired source analysis succeeded in
# official run 44476326291, job 135398733458. Its original artifact hashes
# and compact source-wide aggregate metrics were committed afterward.
# ALL future CI is OFFLINE ONLY and must not redownload RDS/outcome labels.
jobs:
  first-source-and-paired-result-offline-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10','3.12','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install source-independent test dependencies only
        run: python -m pip install -e '.[dev]'
      - name: Verify pre-outcome 50-bird same-test design and original 16-seed paired metrics
        run: python -m pytest tests/test_bop_swiss_ranger_paired_other_year_exposure_v1.py tests/test_bop_swiss_ranger_paired_first_receipt_v1.py
      - name: Check immutable original provider/action SHA256 and scientific STOP without HTTP
        run: python scripts/verify_bop_swiss_ranger_paired_first_v1.py
