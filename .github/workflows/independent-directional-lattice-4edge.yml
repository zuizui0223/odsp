name: independent-directional-lattice-4-12edge

on:
  pull_request:
    paths:
      - 'odsp/information_lattice_positive_v2.py'
      - 'odsp/confirmatory_method_routing.py'
      - 'ODSP_INDEPENDENT_DIRECTIONAL_LATTICE_4EDGE_CONTRACT.json'
      - 'ODSP_INDEPENDENT_DIRECTIONAL_LATTICE_4_12EDGE_CONTRACT.json'
      - 'ODSP_CONFIRMATORY_METHOD_ROUTING_CONTRACT.json'
      - 'tests/test_information_lattice_positive_v2.py'
      - 'tests/test_information_lattice_positive_v2_three_block.py'
      - 'tests/test_independent_directional_lattice_contract.py'
      - '.github/workflows/independent-directional-lattice-4edge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core package with test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run independent directional lattice tests
        run: >-
          python -m pytest -q
          tests/test_information_lattice_positive_v2.py
          tests/test_information_lattice_positive_v2_three_block.py
          tests/test_independent_directional_lattice_contract.py
      - name: Import directional lattice API
        run: >-
          python -c "from odsp.information_lattice_positive_v2 import certify_positive_information_lattice_v2; assert callable(certify_positive_information_lattice_v2)"
