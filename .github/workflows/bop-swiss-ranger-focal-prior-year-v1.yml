name: bop-swiss-ranger-focal-prior-year-v1
on:
  pull_request:
    paths:
      - 'research/BOP_SWISS_RANGER_FOCAL_PRIOR_YEAR_V1_CONTRACT.json'
      - 'scripts/bop_swiss_ranger_focal_prior_year_v1.R'
      - 'scripts/bop_swiss_ranger_focal_prior_year_schema_v1.R'
      - 'tests/test_bop_swiss_ranger_focal_prior_year_v1.py'
      - 'docs/bop_swiss_ranger_focal_prior_year_v1.md'
      - '.github/workflows/bop-swiss-ranger-focal-prior-year-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-focal-chronology-known-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10','3.12','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - name: Check frozen earlier-year target and 50-bird same-test 488-train group design
        run: python -m pytest tests/test_bop_swiss_ranger_focal_prior_year_v1.py
  source-first-chronological-ranger:
    needs: frozen-focal-chronology-known-truth
    if: ${{ needs.frozen-focal-chronology-known-truth.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 31
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
      - name: Install original-family ranger and JSON source gate dependencies
        run: Rscript -e 'install.packages(c("jsonlite","ranger"),repos="https://cloud.r-project.org")'
      - name: Source-free chronology/year-ID synthetic test and ranger forest fitting BEFORE any real source access
        run: Rscript scripts/bop_swiss_ranger_focal_prior_year_v1.R --self-test
      - name: Verify 2024 source exact Git blob, outcome-blind old and chronological gates, then fit fixed 64 ranger panels
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          f="$RUNNER_TEMP/nesttool_prepared_pinned_focal_chronology.rds"
          trap 'rm -f "$f"' EXIT
          curl --fail --location --silent --show-error --max-time 180 --retry 2 --output "$f" 'https://raw.githubusercontent.com/Vogelwarte/NestTool/8fdf3884b5f6079afdffdc5c563c9050766670a4/input_data_prepared.rds'
          test "$(stat -c%s "$f")" = '53709803'
          test "$(git hash-object "$f")" = 'fab942c0df8d6f77dc1db2bd2e2717681b9a3632'
          Rscript scripts/bop_nesttool_swiss_prepared_schema_v1.R "$f" "$RUNNER_TEMP/bop-swiss-focal-prior-original-schema-first.json"
          Rscript scripts/bop_swiss_ranger_focal_prior_year_schema_v1.R "$f" "$RUNNER_TEMP/bop-swiss-focal-prior-chronology-schema-first.json"
          Rscript scripts/bop_swiss_ranger_focal_prior_year_v1.R "$f" "$RUNNER_TEMP/bop-swiss-focal-prior-model-first.json"
      - name: Archive only source-wide schema, chronological gate and 64-panel aggregate result / HOLD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bop-swiss-focal-prior-year-first
          path: |
            ${{ runner.temp }}/bop-swiss-focal-prior-original-schema-first.json
            ${{ runner.temp }}/bop-swiss-focal-prior-chronology-schema-first.json
            ${{ runner.temp }}/bop-swiss-focal-prior-model-first.json
          retention-days: 90
          if-no-files-found: warn
