name: uljin-q-w-variance-budget-v0

on:
  push:
    branches:
      - method/uljin-q-w-variance-budget-decomposition-v0
    paths:
      - 'ULJIN_Q_W_VARIANCE_BUDGET_V0_CONTRACT.json'
      - 'odsp/uljin_q_w_variance_budget_v0.py'
      - 'tests/test_uljin_q_w_variance_budget_v0.py'
      - 'scripts/run_uljin_q_w_variance_budget_v0.py'
      - '.github/workflows/uljin-q-w-variance-budget-v0.yml'
  workflow_dispatch:

jobs:
  first-frozen-independent-q-w-variance-panel:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ODSP (no new external dependency)
        run: python -m pip install -e '.[dev]'
      - name: Validate exact derivatives, cost minimum and simulated variance
        run: python -m pytest -q tests/test_uljin_q_w_variance_budget_v0.py
      - name: First frozen 48x800 source-free independent q/w variance decomposition
        run: python scripts/run_uljin_q_w_variance_budget_v0.py
      - name: Archive original source-free q and w uncertainty result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uljin-q-w-variance-budget-first-v0
          path: ULJIN_Q_W_VARIANCE_BUDGET_V0_FIRST_RECEIPT.json
          if-no-files-found: warn
