name: freeze-confirmatory-runtime-environment-v1

on:
  pull_request:
    paths:
      - 'odsp/confirmatory_environment_lock.py'
      - 'odsp/frozen_confirmatory_route.py'
      - 'tests/test_confirmatory_runtime_environment_lock_v1.py'
      - 'ODSP_CONFIRMATORY_RUNTIME_ENVIRONMENT_LOCK_V1.json'
      - 'ODSP_CONFIRMATORY_METHOD_ROUTING_CONTRACT.json'
      - '.github/workflows/freeze-confirmatory-runtime-environment-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core package with test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run runtime-environment lock tests
        run: python -m pytest -q tests/test_confirmatory_runtime_environment_lock_v1.py
