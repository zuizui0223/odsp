name: uljin-joint-q-site-majority-v0

on:
  push:
    branches:
      - method/uljin-calibrated-heldout-site-sign-v0
    paths:
      - 'ULJIN_JOINT_Q_SITE_MAJORITY_V0_CONTRACT.json'
      - 'odsp/uljin_joint_q_site_majority_v0.py'
      - 'tests/test_uljin_joint_q_site_majority_v0.py'
      - 'scripts/run_uljin_joint_q_site_majority_v0.py'
      - '.github/workflows/uljin-joint-q-site-majority-v0.yml'
  workflow_dispatch:

jobs:
  first-frozen-q-calibrated-physical-site-sign:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ODSP and isolated exact source q reference beta quantile
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install 'scipy>=1.12,<2'
      - name: Verify 16 physical-site exact tests oracle-leak prevention and detector q scope
        run: python -m pytest -q tests/test_uljin_joint_q_site_majority_v0.py
      - name: Score first frozen 192 calibrated physical-site majority comparisons
        run: python scripts/run_uljin_joint_q_site_majority_v0.py
      - name: Archive original full q and site conditional inference receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uljin-joint-q-site-majority-first-v0
          path: ULJIN_JOINT_Q_SITE_MAJORITY_V0_FIRST_RECEIPT.json
          if-no-files-found: warn
