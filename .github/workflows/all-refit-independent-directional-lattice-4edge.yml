name: all-refit-independent-directional-lattice-4edge

on:
  pull_request:
    paths:
      - 'odsp/refit_positive_independent_lattice_robustness.py'
      - 'odsp/information_lattice_positive_v2.py'
      - 'odsp/confirmatory_method_routing.py'
      - 'ODSP_ALL_REFIT_INDEPENDENT_DIRECTIONAL_LATTICE_4EDGE_CONTRACT.json'
      - 'ODSP_CONFIRMATORY_METHOD_ROUTING_CONTRACT.json'
      - 'tests/test_refit_positive_independent_lattice_robustness.py'
      - 'tests/test_all_refit_independent_directional_lattice_contract.py'
      - '.github/workflows/all-refit-independent-directional-lattice-4edge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core package with test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run all-refit independent lattice tests
        run: >-
          python -m pytest -q
          tests/test_refit_positive_independent_lattice_robustness.py
          tests/test_all_refit_independent_directional_lattice_contract.py
      - name: Import all-refit independent lattice API
        run: >-
          python -c "from odsp.refit_positive_independent_lattice_robustness import certify_all_refit_independent_positive_information_lattice_v2; assert callable(certify_all_refit_independent_positive_information_lattice_v2)"
