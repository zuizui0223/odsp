name: forecast-assessment-v4

on:
  pull_request:
    paths:
      - 'FORECAST_ASSESSMENT_V4_PROVENANCE_CONTRACT.json'
      - 'FORECAST_ASSESSMENT_V4_PROVENANCE_VALIDATION_RECEIPT.json'
      - 'odsp/forecast_assessment_v4.py'
      - 'odsp/forecast_assessment_v4_benchmark.py'
      - 'scripts/run_forecast_assessment_v4_benchmark.py'
      - 'tests/test_forecast_assessment_v4.py'
      - 'tests/test_forecast_assessment_v4_benchmark.py'
      - 'tests/test_forecast_assessment_v4_contract.py'
      - 'tests/test_forecast_assessment_v4_receipt.py'
      - 'docs/forecast_assessment_v4.md'
      - '.github/workflows/forecast-assessment-v4.yml'
  push:
    branches: [main]
    paths:
      - 'FORECAST_ASSESSMENT_V4_PROVENANCE_CONTRACT.json'
      - 'FORECAST_ASSESSMENT_V4_PROVENANCE_VALIDATION_RECEIPT.json'
      - 'odsp/forecast_assessment_v4.py'
      - 'odsp/forecast_assessment_v4_benchmark.py'
      - 'scripts/run_forecast_assessment_v4_benchmark.py'
      - 'tests/test_forecast_assessment_v4.py'
      - 'tests/test_forecast_assessment_v4_benchmark.py'
      - 'tests/test_forecast_assessment_v4_contract.py'
      - 'tests/test_forecast_assessment_v4_receipt.py'
      - 'docs/forecast_assessment_v4.md'
      - '.github/workflows/forecast-assessment-v4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ODSP prediction dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,predict]'
      - name: Test Forecast Assessment v4 API and frozen contract
        run: |
          python -m pytest -q \
            tests/test_forecast_assessment_v4.py \
            tests/test_forecast_assessment_v4_contract.py
          if [ -f tests/test_forecast_assessment_v4_receipt.py ]; then
            python -m pytest -q tests/test_forecast_assessment_v4_receipt.py
          fi
      - name: Run frozen Forecast Assessment v4 benchmark
        run: |
          python scripts/run_forecast_assessment_v4_benchmark.py \
            --output artifacts/FORECAST_ASSESSMENT_V4_PROVENANCE_BENCHMARK.json \
            --seed 20260907
          python -m pytest -q tests/test_forecast_assessment_v4_benchmark.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/FORECAST_ASSESSMENT_V4_PROVENANCE_BENCHMARK.json').read_text())
          assert r['passed'] is True
          assert len(r['checks']) == 13
          assert all(row['passed'] for row in r['checks'])
          assert r['strong_exact']['v4_certification']['certification_status'] == 'certified'
          assert r['strong_permuted']['v4_certification']['row_provenance_status'] == 'reorderable_alignment'
          assert r['row_mismatch']['v4_certification']['certification_status'] == 'unavailable'
          assert r['row_mismatch']['aligned_refit_scheme_audit']['statistical_audit_run'] is False
          assert r['scheme_sensitive']['v4_certification']['certification_status'] == 'not_certified'
          print(json.dumps(r, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: forecast-assessment-v4-provenance-benchmark
          path: artifacts/FORECAST_ASSESSMENT_V4_PROVENANCE_BENCHMARK.json
          if-no-files-found: error
          retention-days: 90
