name: forecast-model-comparison

on:
  pull_request:
    paths:
      - 'FORECAST_MODEL_COMPARISON_CONTRACT.json'
      - 'FORECAST_MODEL_COMPARISON_VALIDATION_RECEIPT.json'
      - 'odsp/forecast_model_comparison.py'
      - 'odsp/forecast_model_comparison_benchmark.py'
      - 'scripts/run_forecast_model_comparison_benchmark.py'
      - 'tests/test_forecast_model_comparison.py'
      - 'tests/test_forecast_model_comparison_benchmark.py'
      - 'tests/test_forecast_model_comparison_contract.py'
      - 'tests/test_forecast_model_comparison_receipt.py'
      - 'docs/forecast_model_comparison_v1.md'
      - '.github/workflows/forecast-model-comparison.yml'
  push:
    branches: [main]
    paths:
      - 'FORECAST_MODEL_COMPARISON_CONTRACT.json'
      - 'FORECAST_MODEL_COMPARISON_VALIDATION_RECEIPT.json'
      - 'odsp/forecast_model_comparison.py'
      - 'odsp/forecast_model_comparison_benchmark.py'
      - 'scripts/run_forecast_model_comparison_benchmark.py'
      - 'tests/test_forecast_model_comparison.py'
      - 'tests/test_forecast_model_comparison_benchmark.py'
      - 'tests/test_forecast_model_comparison_contract.py'
      - 'tests/test_forecast_model_comparison_receipt.py'
      - 'docs/forecast_model_comparison_v1.md'
      - '.github/workflows/forecast-model-comparison.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ODSP core dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Test comparison API and frozen contract
        run: |
          python -m pytest -q \
            tests/test_forecast_model_comparison.py \
            tests/test_forecast_model_comparison_benchmark.py \
            tests/test_forecast_model_comparison_contract.py
          if [ -f tests/test_forecast_model_comparison_receipt.py ]; then
            python -m pytest -q tests/test_forecast_model_comparison_receipt.py
          fi

      - name: Run frozen known-truth comparison benchmark
        run: |
          python scripts/run_forecast_model_comparison_benchmark.py \
            --output artifacts/FORECAST_MODEL_COMPARISON_BENCHMARK.json \
            --seed 20260905
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('artifacts/FORECAST_MODEL_COMPARISON_BENCHMARK.json').read_text())
          assert r['passed'] is True
          assert len(r['checks']) == 8
          assert all(row['passed'] for row in r['checks'])
          assert r['recommended_candidate'] == 'well_calibrated'
          assert r['aggregate_confidence_score_emitted'] is False
          print(json.dumps(r, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: forecast-model-comparison-benchmark
          path: artifacts/FORECAST_MODEL_COMPARISON_BENCHMARK.json
          if-no-files-found: error
          retention-days: 90
