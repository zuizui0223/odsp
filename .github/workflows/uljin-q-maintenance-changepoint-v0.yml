name: uljin-q-maintenance-changepoint-v0

on:
  push:
    branches:
      - method/uljin-q-maintenance-changepoint-v0
    paths:
      - 'ULJIN_Q_MAINTENANCE_CHANGEPOINT_V0_CONTRACT.json'
      - 'odsp/uljin_q_maintenance_changepoint_v0.py'
      - 'tests/test_uljin_q_maintenance_changepoint_v0.py'
      - 'scripts/run_uljin_q_maintenance_changepoint_v0.py'
      - '.github/workflows/uljin-q-maintenance-changepoint-v0.yml'
  workflow_dispatch:

jobs:
  first-frozen-maintenance-source-q:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source-free ODSP test environment and optional CP
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install 'scipy>=1.12,<2'
      - name: Verify source mean iid validity, external q step partitions, exact 16-site threshold
        run: python -m pytest -q tests/test_uljin_q_maintenance_changepoint_v0.py
      - name: First frozen 288 source-free date camera step and model comparisons
        run: python scripts/run_uljin_q_maintenance_changepoint_v0.py
      - name: Archive first original maintenance source calibration result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uljin-q-maintenance-changepoint-first-v0
          path: ULJIN_Q_MAINTENANCE_CHANGEPOINT_V0_FIRST_RECEIPT.json
          if-no-files-found: warn
