name: training-process-cv3two-v5-support-envelope

on:
  pull_request:
    paths:
      - 'odsp/training_process_cv3two_v5_support.py'
      - 'tests/test_training_process_cv3two_v5_support.py'
      - 'ODSP_TRAINING_PROCESS_CV3TWO_V5_SUPPORT_ENVELOPE_CONTRACT.json'
      - 'scripts/run_training_process_cv3two_v5_support.py'
      - '.github/workflows/training-process-cv3two-v5-support-envelope.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  support:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test support generator
        run: python -m pytest -q tests/test_training_process_cv3two_v5_support.py
      - name: Run frozen support envelope
        run: |
          python scripts/run_training_process_cv3two_v5_support.py             --output /tmp/v5-support.json --seed 20261015 --simulations 1000
          echo V5_SUPPORT_BEGIN
          cat /tmp/v5-support.json
          echo V5_SUPPORT_END
