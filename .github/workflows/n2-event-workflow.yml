name: n2-event-workflow

on:
  pull_request:
    paths:
      - 'N2_EVENT_WORKFLOW_CONTRACT.json'
      - 'odsp/workflow.py'
      - 'docs/event_workflow_v1.md'
      - 'tests/test_event_workflow.py'
      - 'tests/test_event_workflow_contract.py'
      - '.github/workflows/n2-event-workflow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e '.[dev,predict]'
      - name: Run event-workflow tests
        run: >-
          python -m pytest -q
          tests/test_event_workflow.py
          tests/test_event_workflow_contract.py
          tests/test_bop_species_baseline.py
          tests/test_distributional_gain.py
