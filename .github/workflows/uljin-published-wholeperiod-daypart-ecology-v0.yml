name: uljin-published-wholeperiod-daypart-ecology-v0

on:
  push:
    branches: [ecology/uljin-matched-daylength-temporal-refuge-v0]
    paths:
      - 'ULJIN_PUBLISHED_SUPPL3_DAYPART_SIGNATURE_V0_CONTRACT.json'
      - 'scripts/run_uljin_published_supp3_daypart_signatures_v0.py'
      - 'tests/test_uljin_published_supp3_daypart_signatures_v0.py'
      - '.github/workflows/uljin-published-wholeperiod-daypart-ecology-v0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wholeperiod-ecology-but-no-original-source-claims:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install pytest
      - name: Test exact four-species, 3-period aggregate computation and nonidentification guards
        run: python -m pytest -q tests/test_uljin_published_supp3_daypart_signatures_v0.py
      - name: Reproduce authentic Zenodo Supplement 3 period-normalized species contrasts
        run: python scripts/run_uljin_published_supp3_daypart_signatures_v0.py
