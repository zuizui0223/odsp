name: freeze-confirmatory-route-evidence-v2

on:
  pull_request:
    paths:
      - 'odsp/frozen_confirmatory_route.py'
      - 'odsp/external_freeze_manifest.py'
      - 'odsp/external_paired_freeze_manifest.py'
      - 'odsp/external_paired_lattice_freeze_manifest.py'
      - 'odsp/untouched_external_refit_positive_contract_v2.py'
      - 'odsp/untouched_external_refit_shared_block_positive_contract_v3.py'
      - 'odsp/untouched_external_refit_shared_block_positive_lattice_contract_v4.py'
      - 'tests/test_frozen_confirmatory_route_v2.py'
      - '.github/workflows/freeze-confirmatory-route-evidence-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core package with test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run frozen route evidence tests
        run: python -m pytest -q tests/test_frozen_confirmatory_route_v2.py
