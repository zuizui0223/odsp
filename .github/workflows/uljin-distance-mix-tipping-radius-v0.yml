name: uljin-distance-mix-tipping-radius-v0

on:
  push:
    branches:
      - method/uljin-distance-mix-tipping-radius-v0
    paths:
      - 'ULJIN_DISTANCE_MIX_TIPPING_RADIUS_V0_CONTRACT.json'
      - 'odsp/uljin_distance_mix_tipping_radius_v0.py'
      - 'tests/test_uljin_distance_mix_tipping_radius_v0.py'
      - 'scripts/run_uljin_distance_mix_tipping_radius_v0.py'
      - '.github/workflows/uljin-distance-mix-tipping-radius-v0.yml'
  workflow_dispatch:

jobs:
  first-frozen-distance-mix-or-radius:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install optional exact detector calibration
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install 'scipy>=1.12,<2'
      - name: Verify oracle analytic radius and q confidence bound monotonicity
        run: python -m pytest -q tests/test_uljin_distance_mix_tipping_radius_v0.py
      - name: First 150-cell frozen exact target distance uncertainty radius audit
        run: python scripts/run_uljin_distance_mix_tipping_radius_v0.py
      - name: Archive exact radius limit without real event records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uljin-distance-mix-tipping-radius-first-v0
          path: ULJIN_DISTANCE_MIX_TIPPING_RADIUS_V0_FIRST_RECEIPT.json
          if-no-files-found: warn
