name: DELTATRACK 2021 stationary negative-control structural gate

on:
  push:
    branches: [diagnostic/delta2021-device-context-20261020]
    paths:
      - prospective/DELTATRACK_2021_STATIONARY_CONTROL_STRUCTURAL_V1.json
      - prospective/delta2021_stationary_structural.py
      - prospective/test_delta2021_stationary_structural.py
      - .github/workflows/delta2021-stationary-support.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest pyproj
      - run: python -m pytest -q prospective/test_delta2021_stationary_structural.py
  immutable-data:
    needs: synthetic
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pyproj
      - name: Download frozen 2021 archive
        run: |
          set -euo pipefail
          mkdir -p build/stationary_support
          cd build/stationary_support
          curl --fail --silent --show-error --location --retry 3 --retry-delay 5 --max-time 900 \
            'https://zenodo.org/records/22102508/files/DELTATRACK-gps-2021.csv.gz?download=1' -o DELTATRACK-gps-2021.csv.gz
          echo '1a3145234cccd1a48b280b0fb485d679  DELTATRACK-gps-2021.csv.gz' | md5sum --check
      - name: Compute horizontal/time overlap without any height access
        run: |
          python -m prospective.delta2021_stationary_structural \
            --gps build/stationary_support/DELTATRACK-gps-2021.csv.gz \
            --output build/stationary_support/STATIONARY_STRUCTURAL_RECEIPT_V1.json
      - name: Check no elevation/outcome was read
        run: |
          python - <<'PY'
          import json
          d=json.load(open('build/stationary_support/STATIONARY_STRUCTURAL_RECEIPT_V1.json'))
          assert d['height_values_accessed'] is False
          assert d['height_outcomes_tested'] is False
          assert d['source_md5']=='1a3145234cccd1a48b280b0fb485d679'
          assert sorted(d['species'])==['Larus argentatus','Larus fuscus']
          print({t:(v['primary_100m']['eligible_birds'],v['sensitivity_500m']['eligible_birds']) for t,v in d['species'].items()})
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deltatrack-2021-stationary-x-y-support-v1
          path: build/stationary_support/STATIONARY_STRUCTURAL_RECEIPT_V1.json
          if-no-files-found: warn
