name: future-refit-probability-v1-postfailure-diagnostics

on:
  pull_request:
    paths:
      - 'scripts/diagnose_failed_future_refit_probability_v1.py'
      - '.github/workflows/future-refit-probability-v1-postfailure-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Diagnose frozen v1 failure (exploratory only)
        run: |
          python scripts/diagnose_failed_future_refit_probability_v1.py             --output /tmp/future-refit-v1-diagnostic.json             --repetitions 20 --seed 20261016
          echo FUTURE_REFIT_V1_DIAGNOSTIC_BEGIN
          cat /tmp/future-refit-v1-diagnostic.json
          echo FUTURE_REFIT_V1_DIAGNOSTIC_END
