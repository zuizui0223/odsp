name: Six Movebank mammal original-date within-animal ERA5 associations v0

on:
  push:
    branches:
      - ecology/seasonal-hysteresis-cross-landscape-paper-v0
    paths:
      - 'research/MOVEBANK_WITHIN_ANIMAL_ERA5_ASSOCIATION_V0_20261019.json'
      - 'scripts/movebank_six_source_within_animal_era5_associations_v0.py'
      - 'tests/test_movebank_six_source_within_animal_era5_v0.py'
      - '.github/workflows/movebank-six-within-animal-era5-v0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original_six_mammal_source_within_individual_year:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify six source-free known-truth GPS/climate association and original SHA failure tests
        run: python -m unittest discover -s tests -p 'test_movebank_six_source_within_animal_era5_v0.py' -v
      - name: Re-download exactly six provider ORIGINAL Movebank GPS files, replay all original individual and cohort GPS effects, replay eight earlier ERA5 source response SHA256s, then describe within-individual-year paired rank associations
        run: |
          python -m scripts.movebank_six_source_within_animal_era5_associations_v0 \
            --output-dir outputs/movebank_six_within_individual_year_era5_v0
      - name: Archive all six accepted or source-HOLD per-cohort results, never raw animal paths or ID
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movebank-original-six-animals-within-year-era5-20261019
          path: outputs/movebank_six_within_individual_year_era5_v0/six_source_within_animal_year_ERA5_correlations_v0.json
          if-no-files-found: warn
