name: paired-directional-lattice-family-calibration

on:
  pull_request:
    paths:
      - 'odsp/shared_block_positive_certification.py'
      - 'odsp/shared_block_positive_multicontrast_calibration.py'
      - 'tests/test_shared_block_positive_multicontrast_calibration.py'
      - 'ODSP_PAIRED_DIRECTIONAL_LATTICE_FAMILY_CALIBRATION_CONTRACT.json'
      - 'PAIRED_DIRECTIONAL_LATTICE_FAMILY_CALIBRATION_RECEIPT.json'
      - '.github/workflows/paired-directional-lattice-family-calibration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core package without prediction extra
        run: python -m pip install -e '.[dev]'
      - name: Run paired lattice-family calibration tests
        run: python -m pytest -q tests/test_shared_block_positive_multicontrast_calibration.py
      - name: Run first predeclared 1000-simulation paired lattice-family panel
        run: |
          python - <<'PY'
          import json
          from odsp.shared_block_positive_multicontrast_calibration import (
              GENERATOR_VERSION,
              run_paired_directional_family_calibration,
          )

          result = run_paired_directional_family_calibration()
          payload = result.as_dict()
          print('PAIRED_DIRECTIONAL_LATTICE_FAMILY_CALIBRATION=' + json.dumps(payload, sort_keys=True))
          assert payload['generator_version'] == GENERATOR_VERSION
          assert result.qualification_pass, payload
          assert all(row['acceptance_pass'] is True for row in payload['scenarios'])
          print('PAIRED_DIRECTIONAL_LATTICE_FAMILY_CALIBRATION_QUALIFIED=true')
          PY
