name: Serengeti MODIS relative greenness versus source PHOTO redistribution v0

on:
  push:
    branches:
      - ecology/seasonal-hysteresis-cross-landscape-paper-v0
    paths:
      - 'research/SERENGETI_MODIS_RELATIVE_GREENNESS_V0_CONTRACT.json'
      - 'scripts/run_serengeti_modis_relative_greenness_photo_v0.py'
      - 'tests/test_serengeti_modis_relative_greenness_v0.py'
      - '.github/workflows/serengeti-ndvi-relative-rank-v0.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  existing-photo-sample-relative-greenness:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install stable MODIS raster and Serengeti coordinate reading dependencies
        run: python -m pip install 'numpy>=1.24,<3' 'rasterio>=1.3.10,<2' 'pyproj>=3.6,<4'
      - name: Run all five synthetic source integrity and known-truth rank controls FIRST
        run: python -m unittest discover -s tests -p 'test_serengeti_modis_relative_greenness_v0.py' -v
      - name: Download two previous original-source artifacts before touching PHOTO or satellite values
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .original_satellite .original_photo_ndvi
          gh run download 38742381644 --repo zuizui0223/odsp \
            --name serengeti-mod13q1-public-container-83scene-v1 \
            --dir .original_satellite
          gh run download 38744196749 --repo zuizui0223/odsp \
            --name serengeti-camera-pixel-ndvi-vs-photo-mix-source-v0 \
            --dir .original_photo_ndvi
          echo 'e0e3c57de8d6a3ab9996412886e9733ea572cf9989f88a68b5c3ac5fb5557f11  .original_satellite/serengeti_modis_public_container_token_v1.json' | sha256sum -c -
          echo 'b6ed0294d6e4c6277f07ef9327f536c564c33c79265570bf7b37197eb951c25f  .original_photo_ndvi/serengeti_source_camera_ndvi_photo_v0.json' | sha256sum -c -
      - name: Download exact original published camera and event CSVs, verify MD5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .serengeti_original_relative
          curl -L --fail --retry 3 --retry-delay 4 --max-time 1200 \
            'https://zenodo.org/records/5026386/files/consensus_data.csv?download=1' \
            -o .serengeti_original_relative/consensus_data.csv
          curl -L --fail --retry 3 --retry-delay 3 --max-time 100 \
            'https://zenodo.org/records/5026386/files/search_effort.csv?download=1' \
            -o .serengeti_original_relative/search_effort.csv
          echo '5ed2d32fd09127c178cf9dca8ccfd623  .serengeti_original_relative/consensus_data.csv' | md5sum -c -
          echo '27cb42f3feaa0642b17cbde24ba15fbd  .serengeti_original_relative/search_effort.csv' | md5sum -c -
      - name: Check all 15 old original rho results byte/source-exact then calculate frozen alternative NDVI predictors
        run: |
          python -m scripts.run_serengeti_modis_relative_greenness_photo_v0 \
            --consensus .serengeti_original_relative/consensus_data.csv \
            --effort .serengeti_original_relative/search_effort.csv \
            --original-satellite-receipt .original_satellite/serengeti_modis_public_container_token_v1.json \
            --old-camera-ndvi-photo-receipt .original_photo_ndvi/serengeti_source_camera_ndvi_photo_v0.json \
            --output outputs/serengeti_ndvi_absolute_rank_vs_delta_photo_v0.json
      - name: Archive ONLY site-aggregated already-positive-photo subset stats and all unavailable cells
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serengeti-photo-source-ndvi-absolute-and-relative-rank-v0
          path: outputs/serengeti_ndvi_absolute_rank_vs_delta_photo_v0.json
          if-no-files-found: warn
