name: ODSP tropical vertebrate macro height source-only study gate
on:
  push:
    branches:
      - prospective/vertebrate-vertical-study-transfer-20261123
    paths:
      - 'scripts/vertebrate_vertical_study_source_v1.py'
      - 'tests/test_vertebrate_vertical_study_source_v1.py'
      - '.github/workflows/vertebrate-vertical-study-source-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original_study_identifier_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source-only synthetic cohort tests
        run: python -m unittest -v tests.test_vertebrate_vertical_study_source_v1
      - name: Verify original author Git blob and independent study schema
        run: python -m scripts.vertebrate_vertical_study_source_v1
      - name: Archive source PASS or structural HOLD (no biological outcomes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vertebrate-vertical-62study-source-v1
          path: results/vertebrate_vertical_study_source_v1.json
          if-no-files-found: error
          retention-days: 45
