name: evaluation-access-log-chain

on:
  pull_request:
    paths:
      - 'EVALUATION_ACCESS_LOG_CHAIN_CONTRACT.json'
      - 'EVALUATION_ACCESS_LOG_CHAIN_VALIDATION_RECEIPT.json'
      - 'odsp/evaluation_access_log_chain.py'
      - 'odsp/evaluation_access_log_chain_benchmark.py'
      - 'scripts/run_evaluation_access_log_chain_benchmark.py'
      - 'tests/test_evaluation_access_log_chain.py'
      - 'tests/test_evaluation_access_log_chain_contract.py'
      - 'tests/test_evaluation_access_log_chain_benchmark.py'
      - 'tests/test_evaluation_access_log_chain_receipt.py'
      - 'docs/evaluation_access_log_chain.md'
      - '.github/workflows/evaluation-access-log-chain.yml'
  push:
    branches: [main]
    paths:
      - 'EVALUATION_ACCESS_LOG_CHAIN_CONTRACT.json'
      - 'EVALUATION_ACCESS_LOG_CHAIN_VALIDATION_RECEIPT.json'
      - 'odsp/evaluation_access_log_chain.py'
      - 'odsp/evaluation_access_log_chain_benchmark.py'
      - 'scripts/run_evaluation_access_log_chain_benchmark.py'
      - 'tests/test_evaluation_access_log_chain.py'
      - 'tests/test_evaluation_access_log_chain_contract.py'
      - 'tests/test_evaluation_access_log_chain_benchmark.py'
      - 'tests/test_evaluation_access_log_chain_receipt.py'
      - 'docs/evaluation_access_log_chain.md'
      - '.github/workflows/evaluation-access-log-chain.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ODSP development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Test evaluation-access log-chain API and frozen contract
        run: |
          python -m pytest -q \
            tests/test_evaluation_access_log_chain.py \
            tests/test_evaluation_access_log_chain_contract.py
          if [ -f tests/test_evaluation_access_log_chain_receipt.py ]; then
            python -m pytest -q tests/test_evaluation_access_log_chain_receipt.py
          fi
      - name: Run frozen evaluation-access log-chain benchmark
        run: |
          python scripts/run_evaluation_access_log_chain_benchmark.py \
            --output artifacts/EVALUATION_ACCESS_LOG_CHAIN_BENCHMARK.json
          python -m pytest -q tests/test_evaluation_access_log_chain_benchmark.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/EVALUATION_ACCESS_LOG_CHAIN_BENCHMARK.json').read_text())
          assert r['passed'] is True
          assert len(r['checks']) == 17
          assert all(row['passed'] for row in r['checks'])
          assert r['clean']['separation_category'] == 'evaluation_access_log_chain_consistent'
          assert r['payload_mutation']['recomputed_event_hash_match'] is False
          assert r['dropped_tail']['terminal_event_hash_match'] is False
          assert r['id_ledger_mismatch']['stage_artifact_id_ledger_match'] is False
          assert r['digest_ledger_mismatch']['stage_digest_ledger_match'] is False
          print(json.dumps(r, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-access-log-chain-benchmark
          path: artifacts/EVALUATION_ACCESS_LOG_CHAIN_BENCHMARK.json
          if-no-files-found: error
          retention-days: 90
