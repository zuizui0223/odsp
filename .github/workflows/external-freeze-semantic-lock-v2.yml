name: external-freeze-semantic-lock-v2

on:
  pull_request:
    paths:
      - 'odsp/untouched_external_refit_positive_contract.py'
      - 'odsp/untouched_external_refit_positive_contract_v2.py'
      - 'odsp/cli.py'
      - 'tests/test_untouched_external_refit_positive_contract.py'
      - 'tests/test_untouched_external_refit_positive_contract_v2.py'
      - 'docs/untouched_external_freeze_semantic_lock_v2.md'
      - 'ODSP_UNTOUCHED_EXTERNAL_FREEZE_SEMANTIC_LOCK_V2.json'
      - '.github/workflows/external-freeze-semantic-lock-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core package without prediction extra
        run: python -m pip install -e '.[dev]'
      - name: Run v1 compatibility and v2 semantic-lock tests
        run: >-
          python -m pytest -q
          tests/test_untouched_external_refit_positive_contract.py
          tests/test_untouched_external_refit_positive_contract_v2.py
      - name: Import semantic-lock runtime
        run: >-
          python -c "from odsp.untouched_external_refit_positive_contract_v2 import run_untouched_external_refit_positive_contract_v2, verify_freeze_manifest_semantic_lock; assert callable(run_untouched_external_refit_positive_contract_v2); assert callable(verify_freeze_manifest_semantic_lock)"
      - name: Confirm compact canonical CLI and legacy compatibility
        run: |
          odsp transfer --help | grep -q 'external-refits'
          odsp transfer-refits-external --help >/dev/null
