name: training-process-v5-managed-internal

on:
  pull_request:
    paths:
      - 'ODSP_TRAINING_PROCESS_V5_MANAGED_INTERNAL_VALIDATION_CONTRACT.json'
      - 'ODSP_TRAINING_PROCESS_V5_MANAGED_INTERNAL_PROMOTION_GATE.json'
      - 'ODSP_TRAINING_PROCESS_V5_MANAGED_INTERNAL_IDENTITY_CONTRACT.json'
      - 'odsp/training_process_internal_freeze_v1.py'
      - 'odsp/training_process_managed_internal_scoring.py'
      - 'odsp/training_process_managed_internal_v5.py'
      - 'tests/test_training_process_managed_internal_v5.py'
      - 'tests/test_training_process_v5_managed_internal_contract.py'
      - 'docs/training_process_v5_managed_internal_validation.md'
      - '.github/workflows/training-process-v5-managed-internal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Verify managed internal chain
        run: >-
          python -m pytest -q
          tests/test_training_process_managed_internal_v5.py
          tests/test_training_process_v5_managed_internal_contract.py
