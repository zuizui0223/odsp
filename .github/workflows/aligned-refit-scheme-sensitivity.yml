name: aligned-refit-scheme-sensitivity

on:
  pull_request:
    paths:
      - 'ALIGNED_REFIT_SCHEME_SENSITIVITY_CONTRACT.json'
      - 'ALIGNED_REFIT_SCHEME_SENSITIVITY_VALIDATION_RECEIPT.json'
      - 'odsp/aligned_refit_scheme_sensitivity.py'
      - 'odsp/aligned_refit_scheme_sensitivity_benchmark.py'
      - 'scripts/run_aligned_refit_scheme_sensitivity_benchmark.py'
      - 'tests/test_aligned_refit_scheme_sensitivity.py'
      - 'tests/test_aligned_refit_scheme_sensitivity_benchmark.py'
      - 'tests/test_aligned_refit_scheme_sensitivity_contract.py'
      - 'tests/test_aligned_refit_scheme_sensitivity_receipt.py'
      - 'docs/aligned_refit_scheme_sensitivity.md'
      - '.github/workflows/aligned-refit-scheme-sensitivity.yml'
  push:
    branches: [main]
    paths:
      - 'ALIGNED_REFIT_SCHEME_SENSITIVITY_CONTRACT.json'
      - 'ALIGNED_REFIT_SCHEME_SENSITIVITY_VALIDATION_RECEIPT.json'
      - 'odsp/aligned_refit_scheme_sensitivity.py'
      - 'odsp/aligned_refit_scheme_sensitivity_benchmark.py'
      - 'scripts/run_aligned_refit_scheme_sensitivity_benchmark.py'
      - 'tests/test_aligned_refit_scheme_sensitivity.py'
      - 'tests/test_aligned_refit_scheme_sensitivity_benchmark.py'
      - 'tests/test_aligned_refit_scheme_sensitivity_contract.py'
      - 'tests/test_aligned_refit_scheme_sensitivity_receipt.py'
      - 'docs/aligned_refit_scheme_sensitivity.md'
      - '.github/workflows/aligned-refit-scheme-sensitivity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ODSP development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Test aligned refit-scheme API and frozen contract
        run: |
          python -m pytest -q \
            tests/test_aligned_refit_scheme_sensitivity.py \
            tests/test_aligned_refit_scheme_sensitivity_contract.py
          if [ -f tests/test_aligned_refit_scheme_sensitivity_receipt.py ]; then
            python -m pytest -q tests/test_aligned_refit_scheme_sensitivity_receipt.py
          fi
      - name: Run frozen aligned refit-scheme benchmark
        run: |
          python scripts/run_aligned_refit_scheme_sensitivity_benchmark.py \
            --nested-draws 1200 \
            --output artifacts/ALIGNED_REFIT_SCHEME_SENSITIVITY_BENCHMARK.json
          python -m pytest -q tests/test_aligned_refit_scheme_sensitivity_benchmark.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/ALIGNED_REFIT_SCHEME_SENSITIVITY_BENCHMARK.json').read_text())
          assert r['passed'] is True
          assert len(r['checks']) == 12
          assert all(row['passed'] for row in r['checks'])
          assert r['exact']['status'] == 'audited_exact_alignment'
          assert r['permuted']['status'] == 'audited_reordered_alignment'
          assert r['permuted']['reordered_scheme_count'] == 2
          assert r['mismatch']['statistical_audit_run'] is False
          print(json.dumps(r, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: aligned-refit-scheme-sensitivity-benchmark
          path: artifacts/ALIGNED_REFIT_SCHEME_SENSITIVITY_BENCHMARK.json
          if-no-files-found: error
          retention-days: 90
