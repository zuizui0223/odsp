name: independent-c12-one-sided-support-envelope

on:
  push:
    branches:
      - 'method/independent-c12-support-envelope'
  pull_request:
    paths:
      - 'odsp/independent_c12_support_calibration.py'
      - 'ODSP_INDEPENDENT_C12_ONE_SIDED_SUPPORT_ENVELOPE_CONTRACT.json'
      - 'INDEPENDENT_C12_ONE_SIDED_SUPPORT_ENVELOPE_RECEIPT.json'
      - 'tests/test_independent_c12_support_calibration.py'
      - 'tests/test_independent_c12_support_calibration_receipt.py'
      - '.github/workflows/independent-c12-one-sided-support-envelope.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core package with test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run pre-result contract tests
        run: python -m pytest -q tests/test_independent_c12_support_calibration.py
      - name: Run first formal 1000-simulation c12 support envelope
        run: |
          python - <<'PY'
          import json
          from odsp.independent_c12_support_calibration import (
              run_independent_c12_support_envelope_calibration,
          )

          result = run_independent_c12_support_envelope_calibration(
              seed=20261003,
              simulations_per_scenario=1000,
              bootstrap_draws=500,
              group_count=6,
              contrast_correlation=0.5,
              confidence_level=0.95,
          )
          payload = result.as_dict()
          print("INDEPENDENT_C12_SUPPORT_ENVELOPE=" + json.dumps(payload, sort_keys=True))
          assert result.qualification_pass, payload
          PY
