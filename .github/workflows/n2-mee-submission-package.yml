name: n2-mee-submission-package

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package, tests and figure dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' matplotlib

      - name: Build integrated anonymous manuscript v3
        run: |
          mkdir -p build/manuscript
          python -m scripts.build_n2_mee_manuscript_v3 \
            --output build/manuscript/N2_MEE_MANUSCRIPT_DRAFT_v3.md \
            --manifest build/manuscript/N2_MEE_MANUSCRIPT_DRAFT_v3.manifest.json

      - name: Build terminal-record-backed manuscript figures
        run: |
          python scripts/build_n2_mee_figures.py --output-dir build/figures
          test -f build/figures/Figure1_inferential_hierarchy.pdf
          test -f build/figures/Figure2_method_validation.pdf
          test -f build/figures/Figure3_empirical_terminal_states.pdf
          test -f build/figures/figure_manifest.json

      - name: Build policy-compliant anonymous review bundle v3
        run: |
          python -m scripts.build_n2_mee_review_bundle_v3 \
            --output build/N2_MEE_ANONYMOUS_REVIEW_BUNDLE_v3.zip

      - name: Stage non-anonymous submission administration drafts
        run: |
          mkdir -p build/admin
          cp manuscript/N2_MEE_TITLE_PAGE_TEMPLATE.md build/admin/
          cp manuscript/N2_MEE_COVER_LETTER_DRAFT.md build/admin/
          cp manuscript/N2_MEE_DISCLOSURE_DRAFTS.md build/admin/
          cp N2_MEE_FINAL_SUBMISSION_CHECKLIST.json build/admin/

      - name: Run submission-package source tests
        run: |
          python -m pytest -q \
            tests/test_n2_mee_submission_package.py \
            tests/test_n2_mee_review_package.py \
            tests/test_n2_mee_policy_compliance.py

      - name: Extract and test the anonymous review bundle itself
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          archive = Path('build/N2_MEE_ANONYMOUS_REVIEW_BUNDLE_v3.zip')
          target = Path('build/review_extracted')
          target.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(archive) as zf:
              zf.extractall(target)
          print(f'extracted {len(list(target.rglob("*")))} paths')
          PY
          python -m pip install -e 'build/review_extracted[dev]'
          python -m pytest -q build/review_extracted/tests

      - name: Record package checksums
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path('build')
          files = []
          for path in sorted(p for p in root.rglob('*') if p.is_file() and 'review_extracted' not in p.parts):
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              files.append({'path': path.relative_to(root).as_posix(), 'sha256': digest, 'bytes': path.stat().st_size})
          (root / 'submission_package_manifest.json').write_text(json.dumps({'schema_version': 2, 'files': files}, indent=2, sort_keys=True) + '\n')
          print(json.dumps({'file_count': len(files)}, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: n2-mee-submission-package
          path: |
            build/manuscript/
            build/figures/
            build/N2_MEE_ANONYMOUS_REVIEW_BUNDLE_v3.zip
            build/admin/
            build/submission_package_manifest.json
          if-no-files-found: error
          retention-days: 90
