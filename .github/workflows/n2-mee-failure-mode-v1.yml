name: n2-mee-failure-mode-v1

on:
  pull_request:
    paths:
      - 'N2_MEE_FAILURE_MODE_MANUSCRIPT_V1_CONTRACT.json'
      - 'docs/n2_failure_mode_manuscript_spine_v1.md'
      - 'scripts/build_n2_mee_failure_mode_manuscript_v1.py'
      - 'tests/test_n2_mee_failure_mode_manuscript_v1.py'
      - 'N2_STAGE1_FAILURE_MODE_RESULT_RECEIPT_V1.json'
      - 'N2_STAGE2_REAL_DATA_RESULT_RECEIPT_V1.json'
      - '.github/workflows/n2-mee-failure-mode-v1.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and tests
        run: python -m pip install -e '.[dev]'
      - name: Validate failure-mode manuscript contract and draft
        run: >-
          python -m pytest -q
          tests/test_n2_stage2_result_receipt.py
          tests/test_n2_mee_failure_mode_manuscript_v1.py
      - name: Build failure-mode manuscript
        run: |
          python scripts/build_n2_mee_failure_mode_manuscript_v1.py             --output build/n2_failure_mode_v1/N2_MEE_FAILURE_MODE_MANUSCRIPT_DRAFT_v1.md             --manifest build/n2_failure_mode_v1/N2_MEE_FAILURE_MODE_MANUSCRIPT_DRAFT_v1.manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: n2-mee-failure-mode-manuscript-v1
          path: build/n2_failure_mode_v1/
          if-no-files-found: error
          retention-days: 90
