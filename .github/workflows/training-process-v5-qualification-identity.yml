name: training-process-v5-qualification-identity

on:
  pull_request:
    paths:
      - 'odsp/training_process_confirmatory_v5.py'
      - 'odsp/training_process_positive_cv3two_iut.py'
      - 'odsp/training_process_managed_generation.py'
      - 'odsp/training_process_validation_provenance.py'
      - 'odsp/confirmatory_implementation_lock.py'
      - 'odsp/confirmatory_environment_lock.py'
      - 'tests/test_training_process_confirmatory_v5.py'
      - 'ODSP_TRAINING_PROCESS_V5_QUALIFICATION_IDENTITY_CONTRACT.json'
      - 'scripts/run_training_process_v5_qualification_identity.py'
      - '.github/workflows/training-process-v5-qualification-identity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Verify provenance wrapper
        run: python -m pytest -q tests/test_training_process_confirmatory_v5.py
      - name: Snapshot qualified v5 identity
        run: |
          python scripts/run_training_process_v5_qualification_identity.py
          echo TRAINING_PROCESS_V5_IDENTITY_BEGIN
          cat /tmp/training-process-v5-identity.json
          echo TRAINING_PROCESS_V5_IDENTITY_END
