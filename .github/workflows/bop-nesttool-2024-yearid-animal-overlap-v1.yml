name: bop-nesttool-2024-yearid-animal-overlap-v1
on:
  pull_request:
    paths:
      - 'research/BOP_NESTTOOL_2024_YEARID_SPLIT_ANIMAL_OVERLAP_V1_CONTRACT.json'
      - 'scripts/bop_nesttool_2024_yearid_animal_overlap_v1.py'
      - 'tests/test_bop_nesttool_2024_yearid_animal_overlap_v1.py'
      - 'docs/bop_nesttool_2024_yearid_animal_overlap_v1.md'
      - 'manuscript/BOP_INDEPENDENT_ANIMAL_GAIN_METHODS_DRAFT_v1.md'
      - '.github/workflows/bop-nesttool-2024-yearid-animal-overlap-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  known-truth-source-math-offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10','3.12','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - name: Test sharp expected-overlap bounds and synthetic historical R trainer split parity
        run: python -m pytest tests/test_bop_nesttool_2024_yearid_animal_overlap_v1.py
  official-archived-three-trainer-source-first:
    needs: known-truth-source-math-offline
    if: ${{ needs.known-truth-source-math-offline.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare only 2024 archived CODE ZIP source with three pinned GitHub trainer blobs
        run: python scripts/bop_nesttool_2024_yearid_animal_overlap_v1.py --out "$RUNNER_TEMP/bop-nesttool-yearid-overlap-first.json"
      - name: Archive code fingerprints and conditional mathematical result or source HOLD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bop-nesttool-yearid-animal-overlap-first
          path: ${{ runner.temp }}/bop-nesttool-yearid-overlap-first.json
          retention-days: 90
          if-no-files-found: warn
