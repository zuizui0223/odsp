name: uljin-stationary-solar-alias-negative-control-v0

on:
  push:
    branches:
      - method/uljin-stationary-solar-alias-negative-control-v0
    paths:
      - 'odsp/uljin_stationary_solar_alias_counterexample_v0.py'
      - 'tests/test_uljin_stationary_solar_alias_counterexample_v0.py'
      - 'scripts/run_uljin_stationary_solar_alias_counterexample_v0.py'
      - 'ULJIN_STATIONARY_SOLAR_ALIAS_NEGATIVE_CONTROL_V0_CONTRACT.json'
      - '.github/workflows/uljin-stationary-solar-alias-negative-control-v0.yml'
  workflow_dispatch:

jobs:
  source-free-oracle-negative-control:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Verify source-free solar stationary counterexample
        run: python -m pytest -q tests/test_uljin_stationary_solar_alias_counterexample_v0.py
      - name: Produce first frozen counterexample receipt
        run: python scripts/run_uljin_stationary_solar_alias_counterexample_v0.py
      - name: Archive source-free receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uljin-stationary-solar-alias-first-v0
          path: ULJIN_STATIONARY_SOLAR_ALIAS_NEGATIVE_CONTROL_V0_FIRST_RECEIPT.json
          if-no-files-found: warn
