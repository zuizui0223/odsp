name: uljin-q-transport-distance-mix-v0

on:
  push:
    branches:
      - method/uljin-q-transport-distance-mix-v0
    paths:
      - 'ULJIN_Q_TRANSPORT_DISTANCE_MIX_V0_CONTRACT.json'
      - 'odsp/uljin_q_transport_distance_mix_v0.py'
      - 'tests/test_uljin_q_transport_distance_mix_v0.py'
      - 'scripts/run_uljin_q_transport_distance_mix_v0.py'
      - '.github/workflows/uljin-q-transport-distance-mix-v0.yml'
  workflow_dispatch:

jobs:
  first-frozen-q-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install optional test dependency
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install 'scipy>=1.12,<2'
      - name: Verify transport crossproduct, reference coverage and composition-corner bounds
        run: python -m pytest -q tests/test_uljin_q_transport_distance_mix_v0.py
      - name: First frozen 12x200 source-free calibration mismatch benchmark
        run: python scripts/run_uljin_q_transport_distance_mix_v0.py
      - name: Archive first q-transport output without real camera events
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uljin-q-transport-distance-mix-first-v0
          path: ULJIN_Q_TRANSPORT_DISTANCE_MIX_V0_FIRST_RECEIPT.json
          if-no-files-found: warn
