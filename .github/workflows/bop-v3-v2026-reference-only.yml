name: bop-v3-v2026-reference-only-roster-gate

on:
  pull_request:
    paths:
      - "research/BOP_V3_V2026_REFERENCE_ONLY_GATE_V1_CONTRACT.json"
      - "research/BOP_DRYAD_EXTERNAL_SCHEMA_PREFLIGHT_V1_CONTRACT.json"
      - "scripts/bop_dryad_external_schema_preflight_v1.py"
      - "tests/test_bop_dryad_external_schema_preflight_v1.py"
      - "tests/test_bop_dryad_external_schema_first_result_v1.py"
      - "scripts/validate_bop_dryad_external_schema_first_result_v1.py"
      - "research/BOP_DRYAD_EXTERNAL_SCHEMA_PREFLIGHT_V1_FIRST_RESULT.json"
      - "BOP_DRYAD_EXTERNAL_SCHEMA_PREFLIGHT_V1_TERMINAL_RECEIPT.json"
      - "docs/bop_dryad_external_schema_preflight_v1.md"
      - "BOP_RODENT_STATE_PREDICTION_CONTRACT.json"
      - "scripts/bop_v3_v2026_reference_roster_preflight_v1.py"
      - "docs/bop_v3_v2026_reference_only_gate_v1.md"
      - "tests/test_bop_v3_v2026_reference_roster_gate_v1.py"
      - "tests/test_bop_v3_v2026_reference_first_result_v1.py"
      - "scripts/validate_bop_v3_v2026_reference_first_result_v1.py"
      - "BOP_V3_V2026_REFERENCE_ONLY_GATE_V1_TERMINAL_RECEIPT.json"
      - "research/BOP_V3_V2026_REFERENCE_ONLY_GATE_V1_FIRST_RESULT.json"
      - ".github/workflows/bop-v3-v2026-reference-only.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-source-only-rules:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Check animal identity, version alias and GPS-access ban
        run: python -m pytest tests/test_bop_v3_v2026_reference_roster_gate_v1.py tests/test_bop_v3_v2026_reference_first_result_v1.py tests/test_bop_dryad_external_schema_preflight_v1.py tests/test_bop_dryad_external_schema_first_result_v1.py

  official-reference-only-probe:
    needs: test-source-only-rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run source-only Zenodo reference check
        run: python scripts/bop_v3_v2026_reference_roster_preflight_v1.py --out "$RUNNER_TEMP/bop-v3-v2026-reference-only-v1.json"
      - name: Print scientific gate, not a GPS result
        run: |
          python -c "import json,os,pathlib; p=pathlib.Path(os.environ['RUNNER_TEMP'])/'bop-v3-v2026-reference-only-v1.json'; a=json.loads(p.read_text()); assert a['gps_event_data_accessed'] is False; print('METADATA_ONLY_TERMINAL:',a.get('identity_audit',{}).get('scientific_status',a.get('scientific_status')))"
      - name: Verify official references reproduce the original MD5-verified terminal
        run: python scripts/validate_bop_v3_v2026_reference_first_result_v1.py --result "$RUNNER_TEMP/bop-v3-v2026-reference-only-v1.json"
      - name: Archive only deidentified reference audit and source holds
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bop-v3-v2026-reference-only-v1
          path: ${{ runner.temp }}/bop-v3-v2026-reference-only-v1.json
          retention-days: 90
          if-no-files-found: warn

  official-dryad-source-only-probe:
    needs: test-source-only-rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe only two Dryad metadata API calls and three small non-GPS files
        run: python scripts/bop_dryad_external_schema_preflight_v1.py --out "$RUNNER_TEMP/bop-dryad-source-only-v1.json"
      - name: Preserve feature gate and original empirical endpoint boundary
        run: |
          python -c "import json,os,pathlib; p=pathlib.Path(os.environ['RUNNER_TEMP'])/'bop-dryad-source-only-v1.json'; r=json.loads(p.read_text()); assert r['candidate_admission']=='NOT_ADMITTED'; assert r['raw_gps_or_height_outcomes_accessed'] is False; assert r['original_BOP_RF_direct_external_transfer_status']=='ORIGINAL_RF_PREDICTOR_INCOMPATIBLE'; assert r['BOP_existing_mixed_terminal_reclassified'] is False; print(json.dumps({'source':r['metadata_source_status'],'API':r['official_metadata_api']['dataset']['status'],'small_files':{k:v['status'] for k,v in r['small_non_gps_file_checks'].items()}},sort_keys=True))"
      - name: Compare official Dryad source replay to first scientific receipt
        run: python scripts/validate_bop_dryad_external_schema_first_result_v1.py --result "$RUNNER_TEMP/bop-dryad-source-only-v1.json"
      - name: Archive Dryad source-only audit, including provider holds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bop-dryad-source-only-v1
          path: ${{ runner.temp }}/bop-dryad-source-only-v1.json
          if-no-files-found: warn
          retention-days: 90
