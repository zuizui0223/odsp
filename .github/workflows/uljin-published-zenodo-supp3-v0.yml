name: uljin-zenodo-published-diel-supp3-v0

on:
  push:
    branches: [ecology/uljin-matched-daylength-temporal-refuge-v0]
    paths:
      - 'scripts/inspect_uljin_published_supp3_aggregate_v0.py'
      - 'tests/test_uljin_published_supp3_aggregate_v0.py'
      - '.github/workflows/uljin-published-zenodo-supp3-v0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independently-published-aggregate-only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Test exact publisher checksum, confidential station guard and no original-source claims
        run: python -m pytest -q tests/test_uljin_published_supp3_aggregate_v0.py
      - name: Read independently published Zenodo whole-period supplementary summary table (not original EcoBank)
        run: python scripts/inspect_uljin_published_supp3_aggregate_v0.py
