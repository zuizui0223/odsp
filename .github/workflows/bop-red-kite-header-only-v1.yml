name: bop-red-kite-header-only-v1

on:
  pull_request:
    paths:
      - "research/BOP_RED_KITE_HEADER_ONLY_V1_CONTRACT.json"
      - "scripts/bop_red_kite_header_only_preflight_v1.py"
      - "tests/test_bop_red_kite_header_only_preflight_v1.py"
      - "tests/test_bop_red_kite_header_only_first_receipt.py"
      - "scripts/verify_bop_red_kite_header_first_result_v1.py"
      - "BOP_RED_KITE_HEADER_ONLY_V1_FIRST_RECEIPT.json"
      - "docs/bop_red_kite_header_only_preflight_v1.md"
      - ".github/workflows/bop-red-kite-header-only-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-source-safety-tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10","3.12","3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Verify strict source headers, no biological response rows or model claims
        run: python -m pytest tests/test_bop_red_kite_header_only_preflight_v1.py tests/test_bop_red_kite_first_inventory_receipt.py tests/test_bop_red_kite_header_only_first_receipt.py

  official-four-source-headers-first:
    needs: schema-source-safety-tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect first physical line ONLY from four prior MD5-manifest-pinned Zenodo CSVs
        run: python scripts/bop_red_kite_header_only_preflight_v1.py --out "$RUNNER_TEMP/red-kite-header-only-first.json"
      - name: Check complete first-source header JSON against original Actions artifact SHA
        run: python scripts/verify_bop_red_kite_header_first_result_v1.py --result "$RUNNER_TEMP/red-kite-header-only-first.json"
      - name: Archive first source schema outcome even if access failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bop-red-kite-header-only-first
          path: ${{ runner.temp }}/red-kite-header-only-first.json
          retention-days: 90
          if-no-files-found: warn
