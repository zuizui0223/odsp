name: training-process-positive-iut-v2-null

on:
  pull_request:
    paths:
      - 'odsp/training_process_positive_iut.py'
      - 'odsp/training_process_positive_iut_calibration.py'
      - 'tests/test_training_process_positive_iut_v2.py'
      - 'ODSP_TRAINING_PROCESS_POSITIVE_IUT_V2_CONTRACT.json'
      - 'ODSP_TRAINING_PROCESS_POSITIVE_IUT_V2_NULL_CALIBRATION_CONTRACT.json'
      - 'scripts/run_training_process_positive_iut_null_calibration.py'
      - 'TRAINING_PROCESS_POSITIVE_IUT_V2_QUALIFICATION_RECEIPT.json'
      - '.github/workflows/training-process-positive-iut-v2-null.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-null:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_training_process_positive_iut_v2.py
      - name: Run first frozen v2 null panel
        run: |
          python scripts/run_training_process_positive_iut_null_calibration.py \
            --output /tmp/iut-v2-null.json --seed 20261007 --simulations 1000 --bootstrap-draws 500
          echo IUT_V2_NULL_BEGIN
          cat /tmp/iut-v2-null.json
          echo IUT_V2_NULL_END
      - name: Match frozen failed qualification receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          observed=json.loads(Path('/tmp/iut-v2-null.json').read_text())
          frozen=json.loads(Path('TRAINING_PROCESS_POSITIVE_IUT_V2_QUALIFICATION_RECEIPT.json').read_text())
          actual={row['scenario_id']:row['maximum_component_false_positive_rate'] for row in observed['scenarios']}
          assert observed['qualification_pass'] is False
          assert actual == frozen['null_run']['maximum_component_false_positive_rate_by_scenario'], (actual, frozen['null_run'])
          print('IUT_V2_NULL_FAILURE_MATCHES_FROZEN_RECEIPT=true')
          PY
