name: uljin-stratified-exact-conditional-power-v0

on:
  push:
    branches:
      - method/uljin-stratified-exact-conditional-power-v0
    paths:
      - 'ULJIN_STRATIFIED_EXACT_CONDITIONAL_POWER_V0_CONTRACT.json'
      - 'odsp/uljin_stratified_exact_conditional_power_v0.py'
      - 'tests/test_uljin_stratified_exact_conditional_power_v0.py'
      - 'scripts/run_uljin_stratified_exact_conditional_power_v0.py'
      - '.github/workflows/uljin-stratified-exact-conditional-power-v0.yml'
  workflow_dispatch:

jobs:
  first-exact-multi-site-conditional-panel:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and tests
        run: python -m pip install -e '.[dev]'
      - name: Validate site-specific exact distributions, witness and frozen panel
        run: python -m pytest -q tests/test_uljin_stratified_exact_conditional_power_v0.py
      - name: Score first full pre-frozen stratified versus pooled exact distribution panel
        run: python scripts/run_uljin_stratified_exact_conditional_power_v0.py
      - name: Archive source-free first conditional calibration and power
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uljin-stratified-exact-conditional-power-first-v0
          path: ULJIN_STRATIFIED_EXACT_CONDITIONAL_POWER_V0_FIRST_RECEIPT.json
          if-no-files-found: warn
