name: Gull support root-cause diagnostic v1
on:
  push:
    branches: [diagnostic/gull-support-20261020]
    paths:
      - prospective/gull_support_diagnostic_v1.py
      - prospective/test_gull_support_diagnostic_v1.py
      - .github/workflows/gull-support-diagnostic-v1.yml
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest pyproj
      - run: python -m pytest -q prospective/test_gull_support_diagnostic_v1.py
  baseline-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev,predict]'
      - name: Run complete default suite and preserve output
        run: |
          mkdir -p build
          set -o pipefail
          python -m pytest -q 2>&1 | tee build/full-suite.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gull-diagnostic-baseline-tests
          path: build/full-suite.txt
          if-no-files-found: warn
  data:
    needs: regression
    strategy:
      fail-fast: false
      matrix:
        source: [medgull2022, lbbg2018, delta2020]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pyproj
      - name: Fetch the already-used immutable GPS source
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          python - <<'PY'
          import os, subprocess
          from pathlib import Path
          from prospective.gull_support_diagnostic_v1 import SOURCES
          key = os.environ['SOURCE']
          record, filename, *_ = SOURCES[key]
          out = Path('build') / key
          out.mkdir(parents=True, exist_ok=True)
          subprocess.run(['curl','--fail','--location','--silent','--show-error',
              '--retry','3','--retry-delay','5','--max-time','420',
              f'https://zenodo.org/records/{record}/files/{filename}?download=1',
              '-o',str(out / filename)], check=True)
          PY
      - name: Decompose support without inspecting altitude
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          python - <<'PY'
          import os, subprocess, sys
          from prospective.gull_support_diagnostic_v1 import SOURCES
          key = os.environ['SOURCE']
          filename = SOURCES[key][1]
          subprocess.run([sys.executable,'-m','prospective.gull_support_diagnostic_v1',
              '--source',key,'--gps',f'build/{key}/{filename}',
              '--out',f'build/{key}/diagnostic.json'], check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gull-support-diagnostic-${{ matrix.source }}
          path: build/${{ matrix.source }}/diagnostic.json
          if-no-files-found: warn
