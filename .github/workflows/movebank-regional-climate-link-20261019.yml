name: GPS seasonal diel displacement and regional ERA5 context 2026-10-19
on:
  push:
    branches: [ecology/seasonal-hysteresis-cross-landscape-paper-v0]
    paths:
      - 'research/MOVEBANK_REGIONAL_ERA5_MOVEMENT_LINK_V0_20261019.json'
      - 'scripts/movebank_regional_climate_link_20261019.py'
      - 'tests/test_movebank_regional_climate_link_20261019.py'
      - '.github/workflows/movebank-regional-climate-link-20261019.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source_locked_region_environment_ecology:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Run synthetic timezone, environmental arithmetic and missingness tests
        run: python -m unittest discover -s tests -p 'test_movebank_regional_climate_link_20261019.py' -v
      - name: Replay exact frozen animal GPS effects first then join preselected coarse climate grids by matched animal dates
        run: python -m scripts.movebank_regional_climate_link_20261019 --out outputs/movebank_gps_regional_climate_20261019
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: movebank-gps-matched-day-regional-era5-20261019
          path: outputs/movebank_gps_regional_climate_20261019/gps_regional_climate_joint_summary.json
          if-no-files-found: warn
