name: ODSP liana Bat visits resource leave-plant-out v2
on:
  push:
    branches:
      - prospective/nectarivore-vertical-resource-source-gate-20261123
    paths:
      - 'odsp/nectarivore_bat_resource_transfer_v2.py'
      - 'scripts/nectarivore_bat_plant_resource_transfer_v2.py'
      - 'tests/test_nectarivore_bat_resource_transfer_v2.py'
      - '.github/workflows/nectarivore-bat-resource-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plant_heldout_source_correct:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing scientific package
        run: python -m pip install -e '.[dev]'
      - name: Known-truth tests before biological XLSX response opening
        run: python -m unittest -v tests.test_nectarivore_bat_resource_transfer_v2
      - name: Authenticated original Bat visit and nectar resource plant holdout
        run: python -m scripts.nectarivore_bat_plant_resource_transfer_v2
      - name: Archive frozen result or scientific SOURCE_RESPONSE_STOP receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nectarivore-Bat-resource-heldout-plant-v2
          path: results/nectarivore_bat_plant_resource_transfer_v2.json
          if-no-files-found: warn
          retention-days: 60
