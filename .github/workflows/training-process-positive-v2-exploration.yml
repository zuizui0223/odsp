name: training-process-positive-v2-exploration

on:
  pull_request:
    paths:
      - 'odsp/training_process_positive_v2_exploration.py'
      - 'odsp/training_process_positive_v2_exploratory_panel.py'
      - 'scripts/run_training_process_positive_v2_exploration.py'
      - '.github/workflows/training-process-positive-v2-exploration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core package
        run: python -m pip install -e '.[dev]'
      - name: Run post-v1-failure exploratory panel
        run: python scripts/run_training_process_positive_v2_exploration.py
