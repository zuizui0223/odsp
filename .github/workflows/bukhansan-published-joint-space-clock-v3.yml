name: bukhansan-published-joint-space-clock-ecology-v3

on:
  push:
    branches: [ecology/uljin-matched-daylength-temporal-refuge-v0]
    paths:
      - 'BUKHANSAN_PUBLIC_JOINT_SPACE_CLOCK_OVERLAP_V3_CONTRACT.json'
      - 'scripts/run_bukhansan_published_joint_space_clock_overlap_v3.py'
      - 'tests/test_bukhansan_published_joint_space_clock_overlap_v3.py'
      - '.github/workflows/bukhansan-published-joint-space-clock-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-publication-space-clock-ecology:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Check 11-site original author margin checks and two TV decompositions
        run: python -m pytest -q tests/test_bukhansan_published_joint_space_clock_overlap_v3.py
      - name: Report source-verified spatial versus time marginal and joint overlap
        run: python scripts/run_bukhansan_published_joint_space_clock_overlap_v3.py
