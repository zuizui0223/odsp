name: bop-red-kite-published-baseline-v1
on:
  pull_request:
    paths:
      - "research/BOP_RED_KITE_PUBLISHED_BASELINE_AUDIT_V1.json"
      - "scripts/bop_red_kite_published_baseline_audit_v1.py"
      - "tests/test_bop_red_kite_published_baseline_audit_v1.py"
      - "docs/bop_red_kite_published_baseline_audit_v1.md"
      - ".github/workflows/bop-red-kite-published-baseline-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  published-aggregates-only:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest tests/test_bop_red_kite_published_baseline_audit_v1.py
      - run: python scripts/bop_red_kite_published_baseline_audit_v1.py --out "$RUNNER_TEMP/bop-redkite-published-baseline.json"
