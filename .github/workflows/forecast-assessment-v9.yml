name: forecast-assessment-v9

on:
  pull_request:
    paths:
      - 'FORECAST_ASSESSMENT_V9_LEDGER_BINDING_CONTRACT.json'
      - 'FORECAST_ASSESSMENT_V9_LEDGER_BINDING_VALIDATION_RECEIPT.json'
      - 'odsp/forecast_assessment_v9.py'
      - 'odsp/forecast_assessment_v9_benchmark.py'
      - 'scripts/run_forecast_assessment_v9_benchmark.py'
      - 'tests/test_forecast_assessment_v9.py'
      - 'tests/test_forecast_assessment_v9_contract.py'
      - 'tests/test_forecast_assessment_v9_benchmark.py'
      - 'tests/test_forecast_assessment_v9_receipt.py'
      - 'docs/forecast_assessment_v9_ledger_binding.md'
      - '.github/workflows/forecast-assessment-v9.yml'
  push:
    branches: [main]
    paths:
      - 'FORECAST_ASSESSMENT_V9_LEDGER_BINDING_CONTRACT.json'
      - 'FORECAST_ASSESSMENT_V9_LEDGER_BINDING_VALIDATION_RECEIPT.json'
      - 'odsp/forecast_assessment_v9.py'
      - 'odsp/forecast_assessment_v9_benchmark.py'
      - 'scripts/run_forecast_assessment_v9_benchmark.py'
      - 'tests/test_forecast_assessment_v9.py'
      - 'tests/test_forecast_assessment_v9_contract.py'
      - 'tests/test_forecast_assessment_v9_benchmark.py'
      - 'tests/test_forecast_assessment_v9_receipt.py'
      - 'docs/forecast_assessment_v9_ledger_binding.md'
      - '.github/workflows/forecast-assessment-v9.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ODSP prediction dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,predict]'
      - name: Test Forecast Assessment v9 API and frozen contract
        run: |
          python -m pytest -q \
            tests/test_forecast_assessment_v9.py \
            tests/test_forecast_assessment_v9_contract.py
          if [ -f tests/test_forecast_assessment_v9_receipt.py ]; then
            python -m pytest -q tests/test_forecast_assessment_v9_receipt.py
          fi
      - name: Run frozen Forecast Assessment v9 benchmark
        run: |
          python scripts/run_forecast_assessment_v9_benchmark.py \
            --output artifacts/FORECAST_ASSESSMENT_V9_LEDGER_BINDING_BENCHMARK.json
          python -m pytest -q tests/test_forecast_assessment_v9_benchmark.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/FORECAST_ASSESSMENT_V9_LEDGER_BINDING_BENCHMARK.json').read_text())
          assert r['passed'] is True
          assert len(r['checks']) == 17
          assert all(row['passed'] for row in r['checks'])
          assert r['clean_binding']['v9_certification']['certification_status'] == 'certified'
          assert r['ledger_binding_mismatch']['downstream_v8_assessment'] is None
          assert r['ledger_binding_mismatch']['v9_certification']['certification_status'] == 'unavailable'
          assert r['binding_mismatch_without_downstream_layers']['v9_certification']['certification_status'] == 'unavailable'
          print(json.dumps(r, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: forecast-assessment-v9-ledger-binding-benchmark
          path: artifacts/FORECAST_ASSESSMENT_V9_LEDGER_BINDING_BENCHMARK.json
          if-no-files-found: error
          retention-days: 90
