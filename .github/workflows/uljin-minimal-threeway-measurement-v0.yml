name: uljin-minimal-threeway-measurement-v0

on:
  push:
    branches:
      - method/uljin-minimal-threeway-measurement-design-v0
    paths:
      - 'ULJIN_MINIMAL_THREEWAY_MEASUREMENT_V0_CONTRACT.json'
      - 'odsp/uljin_minimal_threeway_measurement_v0.py'
      - 'tests/test_uljin_minimal_threeway_measurement_v0.py'
      - 'scripts/run_uljin_minimal_threeway_measurement_v0.py'
      - '.github/workflows/uljin-minimal-threeway-measurement-v0.yml'
  workflow_dispatch:

jobs:
  first-frozen-all-subsets-inference-design:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific package
        run: python -m pip install -e '.[dev]'
      - name: Validate exact integer fiber, all release policies, augmented ranks and fail-closed boundaries
        run: python -m pytest -q tests/test_uljin_minimal_threeway_measurement_v0.py
      - name: Produce first frozen source-free measurement budget result
        run: python scripts/run_uljin_minimal_threeway_measurement_v0.py
      - name: Archive frozen all-subsets measurement design result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uljin-minimal-threeway-measurement-first-v0
          path: ULJIN_MINIMAL_THREEWAY_MEASUREMENT_V0_FIRST_RECEIPT.json
          if-no-files-found: warn
