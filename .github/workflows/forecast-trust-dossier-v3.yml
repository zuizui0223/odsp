name: forecast-trust-dossier-v3

on:
  pull_request:
    paths:
      - 'FORECAST_TRUST_DOSSIER_V3_CONTRACT.json'
      - 'FORECAST_TRUST_DOSSIER_V3_VALIDATION_RECEIPT.json'
      - 'odsp/forecast_trust_dossier_v3.py'
      - 'odsp/forecast_trust_dossier_v3_benchmark.py'
      - 'scripts/run_forecast_trust_dossier_v3_benchmark.py'
      - 'tests/test_forecast_trust_dossier_v3.py'
      - 'tests/test_forecast_trust_dossier_v3_benchmark.py'
      - 'tests/test_forecast_trust_dossier_v3_contract.py'
      - 'tests/test_forecast_trust_dossier_v3_receipt.py'
      - 'docs/forecast_trust_dossier_v3.md'
      - '.github/workflows/forecast-trust-dossier-v3.yml'
  push:
    branches: [main]
    paths:
      - 'FORECAST_TRUST_DOSSIER_V3_CONTRACT.json'
      - 'FORECAST_TRUST_DOSSIER_V3_VALIDATION_RECEIPT.json'
      - 'odsp/forecast_trust_dossier_v3.py'
      - 'odsp/forecast_trust_dossier_v3_benchmark.py'
      - 'scripts/run_forecast_trust_dossier_v3_benchmark.py'
      - 'tests/test_forecast_trust_dossier_v3.py'
      - 'tests/test_forecast_trust_dossier_v3_benchmark.py'
      - 'tests/test_forecast_trust_dossier_v3_contract.py'
      - 'tests/test_forecast_trust_dossier_v3_receipt.py'
      - 'docs/forecast_trust_dossier_v3.md'
      - '.github/workflows/forecast-trust-dossier-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ODSP core dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Test dossier v3 API and frozen contract
        run: |
          python -m pytest -q \
            tests/test_forecast_trust_dossier_v3.py \
            tests/test_forecast_trust_dossier_v3_benchmark.py \
            tests/test_forecast_trust_dossier_v3_contract.py
          if [ -f tests/test_forecast_trust_dossier_v3_receipt.py ]; then
            python -m pytest -q tests/test_forecast_trust_dossier_v3_receipt.py
          fi
      - name: Run frozen known-truth dossier v3 benchmark
        run: |
          python scripts/run_forecast_trust_dossier_v3_benchmark.py \
            --output artifacts/FORECAST_TRUST_DOSSIER_V3_BENCHMARK.json \
            --seed 20260906 \
            --bootstrap-draws 500
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/FORECAST_TRUST_DOSSIER_V3_BENCHMARK.json').read_text())
          assert r['passed'] is True
          assert len(r['checks']) == 13
          assert all(row['passed'] for row in r['checks'])
          assert r['robust_recommended_radius_through_upper']['joint_radius']['status'] == 'robust_through_search_upper'
          assert r['validation_admitted_at_gamma_1_5_with_finite_radius']['joint_radius']['status'] == 'finite_radius'
          assert r['weak_positive_validation_blocked_and_radius_not_certified']['joint_radius']['status'] == 'not_certified_at_baseline'
          assert r['too_few_blocks_validation_and_radius_unavailable']['joint_radius']['status'] == 'unavailable'
          print(json.dumps(r,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: forecast-trust-dossier-v3-benchmark
          path: artifacts/FORECAST_TRUST_DOSSIER_V3_BENCHMARK.json
          if-no-files-found: error
          retention-days: 90
