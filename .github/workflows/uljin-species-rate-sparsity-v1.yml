name: uljin-published-species-rate-sparsity-v1

on:
  push:
    branches:
      - ecology/uljin-photoperiod-mirror-design-v0
    paths:
      - 'ULJIN_PUBLISHED_SPECIES_SPARSE_MATCH_SENSITIVITY_V1_CONTRACT.json'
      - 'odsp/uljin_published_taxon_rate_sparsity_v1.py'
      - 'tests/test_uljin_published_taxon_rate_sparsity_v1.py'
      - 'scripts/run_uljin_published_taxon_rate_sparsity_v1.py'
      - '.github/workflows/uljin-species-rate-sparsity-v1.yml'
  workflow_dispatch:

jobs:
  hypothetical-source-free-taxa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ODSP
        run: python -m pip install -e '.[dev]'
      - name: Check four published species totals and no-empirical-source claims
        run: python -m pytest -q tests/test_uljin_published_taxon_rate_sparsity_v1.py
      - name: Run frozen conditional published-count scenario only
        run: python scripts/run_uljin_published_taxon_rate_sparsity_v1.py
      - name: Preserve first versioned hypothetical result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uljin-published-species-sparsity-first-v1
          path: ULJIN_PUBLISHED_SPECIES_SPARSE_MATCH_V1_FIRST_RECEIPT.json
          if-no-files-found: warn
