name: bop-red-kite-2024-package-code-only-v1
on:
  pull_request:
    paths:
      - 'research/BOP_RED_KITE_2024_PACKAGE_CODE_V1_CONTRACT.json'
      - 'scripts/bop_red_kite_2024_package_code_only_v1.py'
      - 'tests/test_bop_red_kite_2024_package_code_only_v1.py'
      - 'docs/bop_red_kite_2024_package_code_only_v1.md'
      - '.github/workflows/bop-red-kite-2024-package-code-only-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  code-only-offline-safety:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - name: Validate archive ZIP member safety and exact Git blob comparison without external reads
        run: python -m pytest tests/test_bop_red_kite_2024_package_code_only_v1.py
  original-code-source-first:
    needs: code-only-offline-safety
    if: ${{ needs.code-only-offline-safety.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read only original archived CODE ZIP and R script, compare historical GitHub R source
        run: python scripts/bop_red_kite_2024_package_code_only_v1.py --out "$RUNNER_TEMP/bop-redkite-archive-code-first.json"
      - name: Archive bounded code fingerprints or source HOLD, never raw code or GPS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bop-red-kite-2024-package-code-first
          path: ${{ runner.temp }}/bop-redkite-archive-code-first.json
          retention-days: 90
          if-no-files-found: warn
