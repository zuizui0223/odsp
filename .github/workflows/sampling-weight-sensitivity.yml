name: sampling-weight-sensitivity

on:
  pull_request:
    paths:
      - 'SAMPLING_WEIGHT_SENSITIVITY_CONTRACT.json'
      - 'SAMPLING_WEIGHT_SENSITIVITY_VALIDATION_RECEIPT.json'
      - 'odsp/sampling_weight_sensitivity.py'
      - 'odsp/sampling_weight_sensitivity_benchmark.py'
      - 'scripts/run_sampling_weight_sensitivity_benchmark.py'
      - 'tests/test_sampling_weight_sensitivity.py'
      - 'tests/test_sampling_weight_sensitivity_benchmark.py'
      - 'tests/test_sampling_weight_sensitivity_contract.py'
      - 'tests/test_sampling_weight_sensitivity_receipt.py'
      - 'docs/sampling_weight_sensitivity_v1.md'
      - '.github/workflows/sampling-weight-sensitivity.yml'
  push:
    branches: [main]
    paths:
      - 'SAMPLING_WEIGHT_SENSITIVITY_CONTRACT.json'
      - 'SAMPLING_WEIGHT_SENSITIVITY_VALIDATION_RECEIPT.json'
      - 'odsp/sampling_weight_sensitivity.py'
      - 'odsp/sampling_weight_sensitivity_benchmark.py'
      - 'scripts/run_sampling_weight_sensitivity_benchmark.py'
      - 'tests/test_sampling_weight_sensitivity.py'
      - 'tests/test_sampling_weight_sensitivity_benchmark.py'
      - 'tests/test_sampling_weight_sensitivity_contract.py'
      - 'tests/test_sampling_weight_sensitivity_receipt.py'
      - 'docs/sampling_weight_sensitivity_v1.md'
      - '.github/workflows/sampling-weight-sensitivity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ODSP core dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Test sampling-weight API and frozen contract
        run: |
          python -m pytest -q \
            tests/test_sampling_weight_sensitivity.py \
            tests/test_sampling_weight_sensitivity_benchmark.py \
            tests/test_sampling_weight_sensitivity_contract.py
          if [ -f tests/test_sampling_weight_sensitivity_receipt.py ]; then
            python -m pytest -q tests/test_sampling_weight_sensitivity_receipt.py
          fi

      - name: Run frozen known-truth sampling-weight benchmark
        run: |
          python scripts/run_sampling_weight_sensitivity_benchmark.py \
            --output artifacts/SAMPLING_WEIGHT_SENSITIVITY_BENCHMARK.json \
            --seed 20260906 \
            --bootstrap-draws 2000
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('artifacts/SAMPLING_WEIGHT_SENSITIVITY_BENCHMARK.json').read_text())
          assert r['passed'] is True
          assert len(r['checks']) == 11
          assert all(row['passed'] for row in r['checks'])
          assert r['stable']['sensitivity_category'] == 'weight_robust_generalizing'
          assert r['sensitive']['sensitivity_category'] == 'weight_sensitive'
          by_name = {row['name']: row for row in r['sensitive']['scenarios']}
          assert by_name['uniform']['robust_transfer_category'] == 'robust_generalizing'
          assert by_name['upweight_negative']['robust_transfer_category'] == 'robust_non_generalizing'
          assert r['too_few_blocks']['sensitivity_category'] == 'stable_unavailable'
          print(json.dumps(r, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: sampling-weight-sensitivity-benchmark
          path: artifacts/SAMPLING_WEIGHT_SENSITIVITY_BENCHMARK.json
          if-no-files-found: error
          retention-days: 90
