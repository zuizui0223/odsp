name: ODSP independently replay nine-plant nectar Bat source v3
on:
  push:
    branches:
      - prospective/nectarivore-vertical-resource-source-gate-20261123
    paths:
      - 'scripts/verify_nectarivore_bat_plant_v3_numpy.py'
      - '.github/workflows/nectarivore-bat-plant-v3-independent.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original_nectar_numeric_replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install declared repository dependencies and NumPy
        run: python -m pip install -e '.[dev]'
      - name: Fresh original XLSX intake and separate NumPy grid scorer for 9 heldout plants
        run: python -m scripts.verify_nectarivore_bat_plant_v3_numpy
      - name: Archive original-source numerical verification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nectarivore-Bat-plant-resource-independent-v3
          path: results/nectarivore_bat_plant_resource_v3_independent.json
          if-no-files-found: warn
          retention-days: 60
