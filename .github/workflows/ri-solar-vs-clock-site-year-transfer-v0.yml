name: ri-solar-vs-clock-site-year-transfer-v0

on:
  push:
    branches:
      - ecology/ri-solar-vs-clock-transfer-v0
    paths:
      - 'ODSP_RI_SOLAR_CLOCK_TRANSFER_V0_CONTRACT.json'
      - 'odsp/ri_solar_clock_transfer_v0.py'
      - 'odsp/ri_solar_source_v0.py'
      - 'scripts/run_ri_solar_clock_transfer_v0.py'
      - 'tests/test_ri_solar_clock_transfer_v0.py'
      - 'tests/test_ri_solar_source_v0.py'
      - '.github/workflows/ri-solar-vs-clock-site-year-transfer-v0.yml'
  workflow_dispatch:

jobs:
  ecological-site-year-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen package version and scientific tests
        run: python -m pip install -e '.[dev]'
      - name: Known-truth solar and fixed-clock ecological mechanism tests
        run: |
          python -m pytest -q \
            tests/test_ri_solar_clock_transfer_v0.py \
            tests/test_ri_solar_source_v0.py
      - name: Run pinned public archive heldout ecology test
        shell: bash
        run: |
          python scripts/run_ri_solar_clock_transfer_v0.py \
            --public-archive \
            --receipt RI_SOLAR_VS_CLOCK_TRANSFER_V0_FIRST_RECEIPT.json
      - name: Archive first result OR unavailable receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ri-solar-vs-clock-v0-first-unretuned-result
          path: RI_SOLAR_VS_CLOCK_TRANSFER_V0_FIRST_RECEIPT.json
          if-no-files-found: warn
